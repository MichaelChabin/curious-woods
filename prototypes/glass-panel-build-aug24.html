<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Glass Multiplication · Curious Woods</title>
  <style>
    /* Phase 4 port (Aug 2026): the map renders on canvas, standing on the
       shared plane (../js/plane.js). The instrument column stays DOM. The
       earlier append-only style batches described the DOM grid and went with
       it; this sheet is written clean for the port. */
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#f4f1e8;color:#3d3d3a;font-family:Georgia,serif}
    body{padding:18px 14px 28px}
    button,output{font:inherit;color:inherit}
    button{touch-action:manipulation}
    [hidden]{display:none!important}
    .cw-page{width:min(1040px,100%);margin:auto}
    .cw-home{display:inline-block;margin:0 0 12px;color:#546a80;font-size:12px;text-decoration:none;letter-spacing:.03em}
    .btn{appearance:none;border:0;border-bottom:1px solid transparent;padding:4px 3px;background:transparent;color:#546a80;cursor:pointer;transition:opacity 400ms ease-in-out}
    /* Conditional presence: a word is there only when tapping it would do
       something; it fades, never greys. */
    .btn.absent{opacity:0;pointer-events:none}
    .btn:hover,.btn:focus-visible{color:#292a28;border-bottom-color:#bcae93;outline:none}
    .btn[aria-pressed=true],.btn.active{color:#252623;border-bottom-color:#546a80}
    .text-small{font-size:11px;color:#98917f;text-align:center}

    /* No letterbox: the canvas spans the whole stage and the instrument
       column floats over it as membrane — the world continues behind the
       tools, showing through translucently while the contents win
       (Interface Standard, principle 2). Narrow screens keep the stacked
       layout, where there is no left tool region to continue behind. */
    #glass-map .stage{position:relative}
    @media(min-width:711px){
      #glass-map .instrument{position:absolute;top:0;left:0;bottom:0;width:190px;z-index:10;
        padding:17px 12px 14px;overflow-y:auto;overscroll-behavior:contain;
        background:rgba(244,241,232,0.9);border-right:0.5px solid rgba(200,184,154,0.55)}
    }
    #glass-map .globals{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin:0 0 10px;padding-bottom:9px;border-bottom:1px solid rgba(84,106,128,.15)}
    #glass-map .globals .btn{padding:2px 1px;font-size:15px}
    #glass-map .product{display:flex;min-height:68px;height:68px;flex-direction:column;justify-content:flex-start;align-items:flex-start;margin:0 0 2px;font-variant-numeric:tabular-nums;text-align:left}
    #glass-map .product-number{font-size:40px;line-height:1.05;color:#31322f;overflow-wrap:anywhere}
    #glass-map .product-factors{min-height:1.4em;margin-top:2px;color:#546a80;font-size:19px;line-height:1.25}
    #glass-map .product.miss .product-number,#glass-map .product.miss .product-factors{color:#999283}
    #glass-map .readout{min-height:2.2em;margin:2px 0 6px;color:#546a80;font-size:14px;line-height:1.45}
    #glass-map .decoder{display:flex;flex-direction:row;flex-wrap:wrap;gap:12px;justify-content:flex-start;margin-top:10px}
    #glass-map .prime-key{padding:0}
    #glass-map .swatch{position:relative;display:block;width:46px;height:46px;flex:0 0 46px;border:2px solid #6c6b62;box-shadow:inset 0 0 10px rgb(0 0 0/.26)}
    #glass-map .chip-num{position:absolute;top:2px;right:5px;color:rgb(255 252 229/.96);font-size:16px;line-height:1;text-shadow:0 1px 3px rgb(0 0 0/.85),0 0 7px rgb(255 244 190/.5)}
    /* 1 reads whole and white — quietly crystalline, a slight bluish tint.
       The tint is what separates it from clear leaded glass, which means
       "prime beyond this workshop". */
    #glass-map .swatch.p1{background:radial-gradient(circle at 44% 38%,#ffffff,#e9eef5 62%,#cfd6e0)}
    #glass-map .unity-key .chip-num{color:#4a463c;text-shadow:0 1px 2px rgb(255 255 255/.55)}
    #glass-map .tally{margin:7px 0 0;color:#546a80;font-size:14px;font-variant-numeric:tabular-nums;min-height:1.3em}
    #glass-map .viewing-strip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-top:12px;padding-top:8px;border-top:1px solid rgba(84,106,128,.15)}
    #glass-map .viewing-strip .btn{font-size:13px;font-style:italic;padding:2px 1px}
    #glass-map .panel{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:15px;padding-top:10px;border-top:1px solid rgba(84,106,128,.17)}
    #glass-map .build-tools .btn,#glass-map .property-tools .btn{text-align:left;font-size:14px}

    /* --- The left rail ------------------------------------------------------
       The mode bar is dissolved — the four words across the top were
       arbitrary (Decisions-Walk-Multiplication-Aug13). What replaces it is
       Geometry's rail: a heading, and entries that summon a tool panel. Built
       from a data array, so adding an entry is one line. */
    #glass-map .rail{margin:0 0 11px;padding-bottom:10px;border-bottom:1px solid rgba(84,106,128,.15)}
    #glass-map .rail-heading{display:block;font-size:14px;color:#546a80;line-height:1}
    #glass-map .rail-list{margin:7px 0 0;padding:0;list-style:none}
    #glass-map .rail-item{display:block;position:relative;margin-top:8px;padding-left:12px;
      font-size:13px;color:#546a80;line-height:1.2;cursor:default;transition:color 80ms}
    #glass-map .rail-item::before{content:'\2022';position:absolute;left:0}
    #glass-map .rail-item:hover,#glass-map .rail-item.open{color:#3d3d3a}

    /* --- Panel windows ------------------------------------------------------
       Geometry's parchment window, with two additions these two panels need
       and the shared component does not have: a resize grip, and a body that
       scrolls. cw-panel.js is used unchanged by both labs and is left alone;
       this page carries its own copy, the same choice the PNG patcher below
       records. Draggable by the title bar (Geometry's save-note pattern),
       closeable by the close word — every canvas window, no exceptions. */
    .cw-window{position:fixed;z-index:600;display:none;flex-direction:column;
      background:rgba(244,241,232,0.96);border:0.5px solid #c8b89a;border-radius:6px;
      padding:9px 14px 12px;box-shadow:0 2px 12px rgba(42,38,32,0.1);
      font-family:Georgia,serif;user-select:none;-webkit-user-select:none;
      overflow:hidden;resize:both;opacity:0;transition:opacity 200ms ease-in}
    .cw-window-bar{display:flex;justify-content:space-between;align-items:baseline;
      gap:14px;margin-bottom:5px;flex:0 0 auto;cursor:grab;touch-action:none}
    .cw-window-bar:active{cursor:grabbing}
    .cw-window-title{font-size:13px;color:#546a80;opacity:.75}
    .cw-window-close{font-size:11px;color:#b0a090;cursor:default;transition:color 80ms}
    .cw-window-close:hover{color:#546a80}
    .cw-window-body{font:13px/1.55 Georgia,serif;color:#546a80;overflow-y:auto;
      overscroll-behavior:contain;flex:1 1 auto;min-height:0}
    .cw-window-body p{margin:0 0 11px}
    .cw-window-body p:last-child{margin-bottom:0}

    /* --- Building Numbers ---------------------------------------------------
       The lede, the just-in-time prompt line, then the tools. The prompt fades
       once she has begun, and on its own a little later if she has not —
       Geometry's competence fade (2.5s ease-out), one pattern, not two. */
    .bn-lede{margin:0 0 9px;color:#31322f}
    .bn-prompt{min-height:1.5em;margin:0 0 13px;font-style:italic;color:#546a80;
      opacity:0;transition:opacity 200ms ease-in}
    .bn-prompt.on{opacity:1}
    .bn-prompt.fading{transition:opacity 2500ms ease-out;opacity:0}
    .bn-tool{display:inline-block;margin:0;padding-bottom:1px;font-size:14px;color:#546a80;
      border-bottom:1px solid transparent;cursor:default;transition:color 80ms}
    .bn-tool:hover{color:#3d3d3a}
    .bn-tool.active{color:#252623;border-bottom-color:#546a80}
    .bn-story{display:inline-block;margin:1px 0 0 18px;font-size:12px;font-style:italic;
      color:#546a80;opacity:.7;cursor:default;transition:color 80ms,opacity 80ms}
    .bn-story:hover{color:#3d3d3a;opacity:1}
    .bn-row{margin:0 0 11px}
    .bn-row:last-child{margin-bottom:0}
    .cw-info-panel p{margin:0 0 6px}
    .cw-info-panel strong{font-weight:normal;color:#292a28}
    #glass-map .map-wrap{min-width:0}
    #glass-map canvas{display:block;width:100%;background:#f4f1e8;touch-action:none;
      /* The plane's container owns these — without them a rectangle-drag can
         select and paint the document in Safari. */
      user-select:none;-webkit-user-select:none;cursor:default}
    #glass-map canvas:focus-visible{outline:3px solid #546a80;outline-offset:-3px}
    #glass-map .rebuild{margin-top:2px;font-size:11px;display:block;margin-inline:auto}
    @media(max-width:710px){
      #glass-map .stage{display:grid;grid-template-columns:1fr;gap:7px}
      #glass-map .instrument{padding-top:0;display:grid;grid-template-columns:minmax(135px,1fr) minmax(0,2fr);gap:4px 12px;align-items:start}
      #glass-map .globals,#glass-map .product,#glass-map .readout,#glass-map .panel,#glass-map .viewing-strip{grid-column:1}
      #glass-map .decoder{grid-column:2;grid-row:1/span 5;gap:10px;margin-top:0}
      #glass-map .swatch{width:38px;height:38px;flex:0 0 38px}
    }
    @media(max-width:520px){
      body{padding:10px 6px 20px}
      #glass-map .globals .btn,#glass-map .build-tools .btn,#glass-map .property-tools .btn{font-size:13px}
    }
  </style>
</head>
<body>
<main class="cw-page">
  <a class="cw-home" href="../index.html">The Curious Woods</a>
  <section id="glass-map">
    <div class="stage">
      <aside class="instrument">
        <!-- The rail. Geometry's How this works, one entry for now; the list
             is built from RAIL in script, so a second entry is one line. -->
        <nav class="rail" id="rail" aria-label="How this works">
          <span class="rail-heading">How this works:</span>
          <ul class="rail-list" id="rail-list"></ul>
        </nav>

        <div class="globals" id="globals" aria-label="The whole table">
          <button class="btn" id="fill-map">Fill</button>
          <button class="btn" id="fill-continue" hidden>Continue?</button>
          <button class="btn" id="clear-map">Clear</button>
          <button class="btn" id="numbers" aria-pressed="false">Show numbers</button>
          <!-- Conditional presence (controls build, 13 Aug): Save is present
               only when there is something on the glass to save. -->
          <button class="btn absent" id="save-map" style="display:none">Save</button>
        </div>

        <output class="product" id="product" aria-live="polite">
          <span class="product-number"></span>
          <span class="product-factors"></span>
        </output>
        <div class="readout" id="readout" aria-live="polite">Choose two numbers. Glass builds their product on the Map.</div>

        <div class="decoder" aria-label="Prime glass">
          <button class="btn prime-key unity-key" data-prime="1"><i class="swatch p1"><span class="chip-num">1</span></i></button>
          <button class="btn prime-key" data-prime="2"><i class="swatch" data-swatch="2"><span class="chip-num">2</span></i></button>
          <button class="btn prime-key" data-prime="3"><i class="swatch" data-swatch="3"><span class="chip-num">3</span></i></button>
          <button class="btn prime-key" data-prime="5"><i class="swatch" data-swatch="5"><span class="chip-num">5</span></i></button>
          <button class="btn prime-key" data-prime="7"><i class="swatch" data-swatch="7"><span class="chip-num">7</span></i></button>
        </div>
        <div class="tally" id="tally" aria-live="polite" hidden></div>

        <!-- Interim layout, provisional ahead of the controls pass: the tool
             words sit directly below the chips (on iPad they fell below the
             fold), the number description lives in a floating info panel on
             Geometry's window pattern, and the viewing strip closes the
             column. -->
        <div class="build-tools panel" id="build-tools" hidden>
          <button class="btn build-sub" data-build="primes" aria-pressed="true">Build with primes</button>
          <button class="btn build-sub" data-build="select" aria-pressed="false">Build by selecting</button>
          <button class="btn build-sub" data-build="axes" aria-pressed="false">Rows &amp; columns</button>
          <button class="btn build-sub" data-build="multiples" aria-pressed="false">Multiples</button>
          <button class="btn build-sub" data-build="diagup" aria-pressed="false">Diagonals ↗</button>
          <button class="btn build-sub" data-build="diagdown" aria-pressed="false">Diagonals ↘</button>
        </div>

        <div class="property-tools panel" id="property-tools" hidden>
          <button class="btn property-key" data-property="squares">Squares</button>
          <button class="btn property-key" data-property="pronics">Pronics</button>
          <button class="btn property-key" data-property="powers2">Powers of 2</button>
          <button class="btn property-key" data-property="powers3">Powers of 3</button>
          <button class="btn property-key" data-property="triangular">Triangular numbers</button>
          <button class="btn property-key" data-property="nearlysquare">Nearly square</button>
        </div>

        <!-- The viewing's control strip — the Numbers control's permanent home.
             This viewing defaults to map (Phase 3 ledger) and cycles map · off. -->
        <div class="viewing-strip" id="viewing-strip" aria-label="The map itself">
          <button class="btn" id="numbers-cycle">Numbers &middot; map</button>
          <button class="btn" id="lattice-tie">grid follows zoom</button>
          <button class="btn" id="axes-toggle">axes &middot; shown</button>
        </div>
      </aside>

      <div class="map-wrap">
        <canvas id="map" tabindex="0" role="application"
                aria-label="Glass multiplication map. Arrow keys move between panes; Enter reveals a number."></canvas>
      </div>
    </div>
    <p class="text-small">A small window onto a multiplication map that continues beyond the glass.</p>
    <button class="btn rebuild" id="rebuild">rebuild</button>
  </section>
</main>

<script src="../js/plane.js?v=2026-08-13"></script>
<script src="../js/cw-panel.js?v=2026-08-13"></script>
<script>
var CW_VERSION = '2026-08-24 e4cd030'; try { console.log('Curious Woods · ' + document.title + ' · ' + CW_VERSION); } catch (e) {}
(() => {
  'use strict';

  // ==== the viewing ==========================================================
  // Decision 7 made formal: the viewing supplies meaning. (3,5) is 15 because
  // area. The numbers default is per-viewing — this one greets the child as a
  // map (Phase 3 ledger); Geometry rests at points. There are no construction
  // points here, so this viewing's cycle is map · off.
  const viewing = {
    id: 'multiplication',
    numbersDefault: 'map',
    numbersCycle: { map: 'off', off: 'map' },
    name: (column, row) => column * row,
    axesVisible: true
  };

  // ==== the workshop =========================================================
  // First workshop in the schema of 20-SPECS/Spec-Workshop-Palette-Schema.md.
  // `declared` is the authored six; `rule` is how resting and lit derive in
  // OKLCH; `primes` is the signed-off result — approved output, not cache, so
  // the two lit values that left sRGB at 125% (3 and 13) stand as declared
  // directly. Colour is the sole prime indicator (design review, 8 Aug): a
  // workshop must declare six distinguishable prime colours.
  const WORKSHOP = {
    id: 'aslab', name: 'As the lab ships',
    rule: { rest: { chroma: 92, lightness: 6 }, lit: { chroma: 125, lightness: 7 } },
    declared: { 2:'#1a4a9a', 3:'#c8a800', 5:'#a83018', 7:'#4a8a30', 11:'#6b2ea8', 13:'#c26a10' },
    primes: {
      2:  { rest:'#305da7', lit:'#1b5bc4' },
      3:  { rest:'#d9bc43', lit:'#e7bd00' },
      5:  { rest:'#b74a34', lit:'#d0300b' },
      7:  { rest:'#609b4a', lit:'#50a429' },
      11: { rest:'#7a47b5', lit:'#8531d4' },
      13: { rest:'#d27f3a', lit:'#e87600' }
    }
  };

  // ---- colour: OKLCH, lifted verbatim from experiments/fills-and-light.html —
  // these functions produced what was seen and approved at the bench.
  const s2l=v=>v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4);
  const l2s=v=>v<=0.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-0.055;
  const hex2rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const clc=v=>Math.max(0,Math.min(255,Math.round(v)));
  const rgb2hex=a=>'#'+a.map(v=>clc(v).toString(16).padStart(2,'0')).join('');
  function hex2oklch(hex){
    let [r,g,b]=hex2rgb(hex).map(v=>s2l(v/255));
    const l=Math.cbrt(0.4122214708*r+0.5363325363*g+0.0514459929*b);
    const m=Math.cbrt(0.2119034982*r+0.6806995451*g+0.1073969566*b);
    const s=Math.cbrt(0.0883024619*r+0.2817188376*g+0.6299787005*b);
    const L=0.2104542553*l+0.7936177850*m-0.0040720468*s;
    const A=1.9779984951*l-2.4285922050*m+0.4505937099*s;
    const B=0.0259040371*l+0.7827717662*m-0.8086757660*s;
    return { L, C:Math.hypot(A,B), h:Math.atan2(B,A) };
  }
  function oklch2raw({L,C,h}){
    const A=C*Math.cos(h), B=C*Math.sin(h);
    const l=Math.pow(L+0.3963377774*A+0.2158037573*B,3);
    const m=Math.pow(L-0.1055613458*A-0.0638541728*B,3);
    const s=Math.pow(L-0.0894841775*A-1.2914855480*B,3);
    return [ l2s( 4.0767416621*l-3.3077115913*m+0.2309699292*s)*255,
             l2s(-1.2684380046*l+2.6097574011*m-0.3413193965*s)*255,
             l2s(-0.0041960863*l-0.7034186147*m+1.7076147010*s)*255 ];
  }
  function derive(hex, chromaPct, lightShift){
    const c=hex2oklch(hex);
    const raw=oklch2raw({ L:Math.max(0,Math.min(1,c.L+lightShift/100)),
                          C:c.C*chromaPct/100, h:c.h });
    return { hex:rgb2hex(raw), clipped:raw.some(v=>v<-0.6||v>255.6) };
  }
  // The stored primes are approved output. Check the rule still produces them
  // and report drift rather than fixing it — a value chosen by eye should not
  // be silently recomputed by a library revision (schema spec).
  Object.keys(WORKSHOP.declared).forEach(p=>{
    const r=derive(WORKSHOP.declared[p],WORKSHOP.rule.rest.chroma,WORKSHOP.rule.rest.lightness);
    if(!r.clipped&&r.hex!==WORKSHOP.primes[p].rest)
      console.warn(`workshop drift: prime ${p} resting derives ${r.hex}, stored ${WORKSHOP.primes[p].rest}`);
  });

  // Per-piece lightness variation — required, not decorative: a flat fill with
  // zero variance reads as dead. Lightness only; hue and chroma hold, so the
  // prime is never in doubt. 10% range, in buckets so colours cache.
  const VARIANTS=8;
  const colorCache=new Map();
  const CLEAR_REST={L:0.86,C:0.018,h:1.85}, CLEAR_LIT={L:0.92,C:0.022,h:1.85};
  function pieceFill(p,variant,lit){
    const key=p+':'+variant+':'+(lit?1:0);
    if(colorCache.has(key))return colorCache.get(key);
    const shift=((variant/(VARIANTS-1))-0.5)*0.10;
    let base;
    const entry=WORKSHOP.primes[p];
    if(entry)base=hex2oklch(lit?entry.lit:entry.rest);
    else base=lit?CLEAR_LIT:CLEAR_REST;   // beyond the workshop: clear glass, still cut and leaded
    const hex=rgb2hex(oklch2raw({L:Math.max(0,Math.min(1,base.L+shift)),C:base.C,h:base.h}));
    colorCache.set(key,hex);return hex;
  }

  // ==== the plane ============================================================
  const U=200;   // world units per unit interval — the same scale Geometry declares
  const canvas=document.getElementById('map');
  const ctx=canvas.getContext('2d');
  // The instrument column overlays the canvas's left edge on wide screens;
  // the greeting window centres in the glass to its right, and the map
  // continues behind the tools.
  const MEMBRANE_W=190;
  const membraneWide=window.matchMedia('(min-width:711px)');
  const plane=CW.createPlane({
    defaultView:(w,h)=>{
      const m=membraneWide.matches?MEMBRANE_W:0;
      const vis=Math.max(120,w-m);
      const zoom=Math.min(vis,h)/(12.5*U);
      return { x:5.5*U-(m/2)/zoom, y:5.5*U, zoom };
    }
  });
  plane.setUnitFrame(0,0,U);

  // Until the child's first gesture, every layout change recomputes the
  // greeting view: embedded and slow-settling contexts can report a
  // transient tiny layout at load, and a view latched from it would greet
  // her zoomed to the wrong window. After she pans, zooms, or walks the
  // cursor, the view is hers and layout changes leave it alone.
  let viewSettled=false;
  function resizeCanvas(){
    const dpr=window.devicePixelRatio||1;
    let r=canvas.getBoundingClientRect();
    // Embedded contexts can report 0×0 at load; retry until layout exists.
    if(!r.width){requestAnimationFrame(resizeCanvas);return}
    // The canvas spans the stage; its height keeps the map area beside the
    // membrane square, as the old two-column layout did (190px column + 17px gap).
    const targetH=Math.max(220,Math.round(membraneWide.matches?r.width-207:r.width));
    if(Math.round(r.height)!==targetH){canvas.style.height=targetH+'px';r=canvas.getBoundingClientRect()}
    canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);
    ctx.setTransform(1,0,0,1,0,0);ctx.scale(dpr,dpr);
    plane.setViewport(r.width,r.height);
    if(!viewSettled||plane.zoom()===0)plane.resetView();
  }
  window.addEventListener('resize',resizeCanvas);
  resizeCanvas();

  let numbersMode=viewing.numbersDefault;   // 'map' | 'off'
  let axesVisible=viewing.axesVisible;
  let showNumerals=false;

  // ==== DOM ==================================================================
  const root=document.getElementById('glass-map');
  const readout=root.querySelector('#readout');
  const productBox=root.querySelector('#product'), productNumber=productBox.querySelector('.product-number'), productFactors=productBox.querySelector('.product-factors');
  const numbersButton=root.querySelector('#numbers'), fillButton=root.querySelector('#fill-map'), fillContinueButton=root.querySelector('#fill-continue'), clearButton=root.querySelector('#clear-map');
  const tally=root.querySelector('#tally');
  const buildTools=root.querySelector('#build-tools'), buildSubButtons=[...root.querySelectorAll('[data-build]')];
  const propertyTools=root.querySelector('#property-tools'), propertyButtons=[...root.querySelectorAll('[data-property]')];
  const modeButtons=[...root.querySelectorAll('[data-mode]')];

  // The number's description lives in a floating info panel on Geometry's
  // window pattern (shared component, ../js/cw-panel.js): movable, closable,
  // fading. Interim, provisional ahead of the controls pass. It reopens on
  // each reveal and keeps wherever the child dragged it.
  const infoPanel=CW.createInfoPanel({width:240,ariaLive:'polite'});
  const panelMessage=document.createElement('div');
  panelMessage.style.cssText='margin:0 0 6px;color:#31322f;';
  const propertyCopy=document.createElement('div');

  // ==== the rail, the panel, the stories ====================================
  // The mode bar across the top is gone. Its replacement is Geometry's rail:

  // A parchment window on Geometry's pattern, with the two things the shared
  // component does not carry and these panels need: a resize grip and a body
  // that scrolls. cw-panel.js is shared with Geometry and is left untouched.
  function createWindow(opts){
    opts=opts||{};
    const el=document.createElement('div');
    el.className='cw-window';
    el.style.width=(opts.width||300)+'px';
    el.style.height=(opts.height||320)+'px';
    el.style.minWidth='200px';el.style.minHeight='110px';
    el.style.maxWidth='min(92vw,640px)';el.style.maxHeight='86vh';
    const bar=document.createElement('div');bar.className='cw-window-bar';
    const title=document.createElement('span');title.className='cw-window-title';
    title.textContent=opts.title||'';
    const close=document.createElement('span');close.className='cw-window-close';
    close.textContent='close';close.setAttribute('role','button');close.tabIndex=0;
    bar.appendChild(title);bar.appendChild(close);
    const body=document.createElement('div');body.className='cw-window-body';
    el.appendChild(bar);el.appendChild(body);
    document.body.appendChild(el);

    let shown=false,placed=false,moved=false;
    let dragging=false,sx=0,sy=0,ox=0,oy=0;
    bar.addEventListener('pointerdown',ev=>{
      if(ev.target===close)return;
      ev.preventDefault();
      dragging=true;sx=ev.clientX;sy=ev.clientY;
      ox=parseInt(el.style.left)||0;oy=parseInt(el.style.top)||0;
      bar.setPointerCapture(ev.pointerId);
    });
    bar.addEventListener('pointermove',ev=>{
      if(!dragging)return;
      moved=true;
      el.style.left=Math.round(ox+ev.clientX-sx)+'px';
      el.style.top=Math.round(oy+ev.clientY-sy)+'px';
    });
    const stopDrag=()=>{dragging=false};
    bar.addEventListener('pointerup',stopDrag);
    bar.addEventListener('pointercancel',stopDrag);

    const api={
      el,body,
      visible:()=>shown,
      moved:()=>moved,
      placed:()=>placed,
      setTitle:t=>{title.textContent=t||''},
      place(x,y){
        const w=parseInt(el.style.width)||300,h=parseInt(el.style.height)||320;
        el.style.left=Math.round(clamp(x,8,Math.max(8,window.innerWidth-w-8)))+'px';
        el.style.top =Math.round(clamp(y,8,Math.max(8,window.innerHeight-h-8)))+'px';
        placed=true;
      },
      show(){shown=true;el.style.display='flex';requestAnimationFrame(()=>{el.style.opacity='1'})},
      hide(){shown=false;el.style.opacity='0';
        setTimeout(()=>{if(el.style.opacity==='0')el.style.display='none'},220);
        if(opts.onClose)opts.onClose();}
    };
    const doClose=()=>api.hide();
    close.addEventListener('click',doClose);
    close.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();doClose()}});
    return api;
  }

  const STORIES={
    multiply:[
      "Pick a spot on the edge and slide. A line follows your finger, and a number goes with it — 5, 6, 7. Stop wherever you like.",
      "Now move out onto the plane. A rectangle grows behind you, as wide as the line you left and as tall as you've gone. Let go.",
      "The rectangle fills in, one row at a time, and counts itself as it goes. That's the number that lives at that spot.",
      "Here's the part worth sitting with. You didn't multiply anything. You drew a shape and then found out how much was inside it. The multiplying was the shape all along.",
      "Every number on this plane got there the same way. 12 is at the spot where a 3-wide, 4-tall rectangle lands. It's also at the spot where a 4-wide, 3-tall one lands, which is a different spot and exactly the same amount of tile. You can watch that if you want — the rectangle will turn over and walk across to its other home.",
      "Some numbers have a lot of homes. 24 has eight. Some have exactly two, and those turn out to be the interesting ones, and there's more to say about them later.",
      "And the ones sitting on the diagonal have only one home, because turning them over doesn't take them anywhere.",
    ],
    divide:[
      "Pick a number. It turns into a rectangle, and then falls apart into square tiles — that many of them, sitting there.",
      "Now slide the bar. It's asking how wide you want to stack them. The number under your finger changes as you go: 3, 4, 5. Pick one.",
      "The tiles march over and stack up. Rows fill in one at a time, and a number counts them as they land. When the tiles run out, however tall the stack got is your answer.",
      "Sometimes it comes out flat and finished. 20 tiles stacked 4 wide makes 5 rows exactly, nothing left over.",
      "Sometimes it doesn't. 20 tiles stacked 3 wide gives you 6 rows and 2 tiles standing there with nowhere to go.",
      "You get to decide what happens to those two.",
      "You can leave them. Six rows and two tiles. That's true, and it's finished.",
      "You can cut them into thirds — three, because there are three stacks waiting — and every stack takes two slices. Now the top is flat. Six and two thirds.",
      "Or you can cut them into tenths, which is what most people mean when they say \"the answer\". The odd thing about tenths is that nothing asked for them. Nothing about three stacks suggests cutting into ten. Sometimes it works out flat anyway. Sometimes you can keep slicing forever and never get a flat top.",
    ],
    square:[
      "Pick a number. Say 18. It comes apart into 18 tiles.",
      "One tile goes to the corner. Then three more wrap around it in an L, and now it's a 2 by 2 square. Then five more wrap around that, and it's 3 by 3.",
      "1, 3, 5, 7. You can probably see where this is going, and you're right. It keeps working, and it keeps working for any number you pick.",
      "Seven more gets you to 4 by 4. That's used up 16 tiles, and you have 2 left.",
      "Stop and look at that. Four is too small. Five is too big — five would need 25. There is no whole number that squares to 18. Not a hard one, not an ugly one. There isn't one.",
      "You can cut the last two tiles up if you want. Each one slices into a hundred smaller ones, and the wrapping starts again: 81, then 83. Still odd numbers. Still going up by two. The rule didn't care that the tiles got smaller.",
      "That gets you to 4.2, with 36 small tiles left over.",
      "Do it again and you're at 4.24. Again and it's 4.242. The tiles get too small to see long before the number decides to stop — and it never does decide to stop.",
      "So the side of that square gets written √18, which means exactly the length you've been chasing. It's about 4.24.",
    ],
  };

  // Just-in-time help. Geometry's competence fade, one pattern and not two:
