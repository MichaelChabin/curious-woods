  // Chip swatches take the workshop's resting colours — the workshop knows
  // what 2 looks like; the child never assigns colours to numbers.
  root.querySelectorAll('[data-swatch]').forEach(el=>{
    el.style.background=WORKSHOP.primes[+el.dataset.swatch].rest;
  });

  // ==== state ================================================================
  const built=new Set([1]);   // numbers on the glass; unity is always there
  let mode='multiply', buildTool='primes', composition=[];
  let fxTimers=[], seqTimers=[], expressionTimer=null;
  let pendingColumn=null, pendingRow=null;
  let audio=null;

  // Transient visual state (the canvas equivalent of the old classes).
  // "One visual language for this-one": everything here renders as the lit
  // palette; the old glow/outline/saturate system is gone.
  const litPanes=new Map();    // 'c,r' -> until (ms epoch; Infinity = until clearFx)
  const litPieces=new Map();   // 'c,r,i' -> until
  const revealedNums=new Map();// n -> until (numeral shows regardless of toggle)
  let rects=[];                // {w,h,until} — origin-anchored, unit coords
  let rebuildAnim=null;        // {t0} — the construction re-draws itself

  // ==== helpers ==============================================================
  const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  const fx=(fn,ms)=>fxTimers.push(setTimeout(fn,ms));
  const seq=(fn,ms)=>seqTimers.push(setTimeout(fn,ms));
  const factorize=value=>{const out=[];let n=value;for(let p=2;p*p<=n;p++){while(n%p===0){out.push(p);n/=p}}if(n>1)out.push(n);return out};
  const superscript=n=>String(n).split('').map(d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[Number(d)]).join('');
  const powerText=factors=>{
    if(!factors.length)return'unity';
    return[...new Set(factors)].sort((a,b)=>a-b)
      .map(p=>{const c=factors.filter(v=>v===p).length;return`${p}${c>1?superscript(c):''}`}).join(' × ');
  };
  const frequency=midi=>440*Math.pow(2,(midi-69)/12);

  // Sound reaches 19 and no further — 11, 13, 17, 19 take C, E, G, B an octave
  // above 2, 3, 5, 7 (the settled octave answer continued once), same pan as
  // their octave partners. Primes beyond 19 are silent: sound has a ceiling.
  const primeInfo={
    2:{midi:48,note:'C',pan:-.32}, 3:{midi:52,note:'E',pan:-.1},
    5:{midi:55,note:'G',pan:.12},  7:{midi:59,note:'B',pan:.34},
    11:{midi:60,note:'C′',pan:-.32},13:{midi:64,note:'E′',pan:-.1},
    17:{midi:67,note:'G′',pan:.12},19:{midi:71,note:'B′',pan:.34}
  };
  const arc=[0,4,7,12,12,7,4,0];  // rise to the octave, hold, fall back to the tonic
  const notesFor=factors=>{const count={};return factors.filter(p=>primeInfo[p]).map(p=>{const k=count[p]||0;count[p]=k+1;return{midi:primeInfo[p].midi+arc[k%arc.length],pan:primeInfo[p].pan}})};

  // ---- the visible window (the plane pans and zooms; these are the panes on screen)
  function visibleBounds(){
    const tl=plane.screenToWorld(0,0), br=plane.screenToWorld(plane.viewportWidth(),plane.viewportHeight());
    const minX=Math.min(tl.x,br.x),maxX=Math.max(tl.x,br.x),minY=Math.min(tl.y,br.y),maxY=Math.max(tl.y,br.y);
    return { cMin:Math.max(1,Math.floor(minX/U)+1), cMax:Math.max(0,Math.ceil(maxX/U)),
             rMin:Math.max(1,Math.floor(minY/U)+1), rMax:Math.max(0,Math.ceil(maxY/U)) };
  }
  function productCells(n){
    const vb=visibleBounds(),out=[];
    for(let c=Math.max(1,vb.cMin);c<=vb.cMax;c++){
      if(n%c)continue;const r=n/c;
      if(r>=vb.rMin&&r<=vb.rMax)out.push([c,r]);
    }
    return out;
  }
  function allProducts(){
    const vb=visibleBounds(),set=new Set();
    for(let c=vb.cMin;c<=vb.cMax;c++)for(let r=vb.rMin;r<=vb.rMax;r++)set.add(c*r);
    return[...set].sort((a,b)=>a-b);
  }
  function visiblePairs(n){
    const vb=visibleBounds(),pairs=[];
    for(let a=1;a*a<=n;a++){
      if(n%a)continue;const b=n/a;
      if((a<=vb.cMax&&b<=vb.rMax)||(b<=vb.cMax&&a<=vb.rMax))pairs.push([a,b]);
    }
    return pairs;
  }

  // ==== sound (unchanged from the DOM build, apart from the lit targets) =====
  // Safari (macOS and iPad) only lets an AudioContext start inside a user
  // gesture, and most of this lab's sounds fire from timers staged after the
  // gesture is over. Geometry's answer, adopted here: unlock on every
  // pointerdown — create, resume (Safari also parks contexts 'interrupted'),
  // and push one silent sample through, all while the gesture is live.
  let audioUnlocked=false;
  function unlockAudio(){
    const e=createAudio();if(!e)return;
    if(e.ctx.state==='suspended'||e.ctx.state==='interrupted')e.ctx.resume();
    if(!audioUnlocked){
      const b=e.ctx.createBuffer(1,1,22050),s=e.ctx.createBufferSource();
      s.buffer=b;s.connect(e.ctx.destination);s.start(0);audioUnlocked=true;
    }
  }
  function createAudio(){
    if(audio)return audio;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC){readout.textContent='This browser does not support interactive audio.';return null}
    const actx=new AC(), compressor=actx.createDynamicsCompressor(), dry=actx.createGain(), wet=actx.createGain(), convolver=actx.createConvolver();
    compressor.threshold.value=-18;compressor.knee.value=18;compressor.ratio.value=3;dry.gain.value=.72;wet.gain.value=.22;
    const length=Math.floor(actx.sampleRate*2.4), impulse=actx.createBuffer(2,length,actx.sampleRate);
    for(let c=0;c<2;c++){const data=impulse.getChannelData(c);for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/length,2.7)}
    convolver.buffer=impulse;dry.connect(compressor);convolver.connect(wet);wet.connect(compressor);compressor.connect(actx.destination);
    return audio={ctx:actx,dry,convolver};
  }
  function pianoNote(note,when,duration=3.5,velocity=.3){
    const e=createAudio();if(!e)return;const voice=e.ctx.createGain(),pan=e.ctx.createStereoPanner();pan.pan.value=note.pan||0;
    voice.gain.setValueAtTime(.0001,when);voice.gain.exponentialRampToValueAtTime(velocity,when+.009);voice.gain.exponentialRampToValueAtTime(velocity*.34,when+.22);voice.gain.exponentialRampToValueAtTime(.0001,when+duration);
    voice.connect(pan);pan.connect(e.dry);pan.connect(e.convolver);
    [[1,1],[2,.23],[3,.11],[4,.045],[5,.018]].forEach(([m,l],i)=>{const o=e.ctx.createOscillator(),g=e.ctx.createGain();o.type='sine';o.frequency.value=frequency(note.midi)*m;o.detune.value=i%2?-.8:.55;g.gain.value=l;o.connect(g);g.connect(voice);o.start(when);o.stop(when+duration+.08)});
  }
  async function softMiss(){
    const e=createAudio();if(!e)return;await e.ctx.resume();const now=e.ctx.currentTime+.02,o=e.ctx.createOscillator(),g=e.ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(170,now);o.frequency.exponentialRampToValueAtTime(92,now+.7);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.08,now+.025);g.gain.exponentialRampToValueAtTime(.0001,now+.85);o.connect(g);g.connect(e.dry);g.connect(e.convolver);o.start(now);o.stop(now+.9);
  }
  // One tone per prime factor. No finale chord — the chord anchor below is a
  // timing marker for the visual highlight only. Do not sound it.
  async function playFactors(factors,targets=[],duration=2000){
    const e=createAudio();if(!e)return;await e.ctx.resume();
    const notes=factors.length?notesFor(factors):[{midi:36,pan:0}],start=e.ctx.currentTime+.04,spacing=.18;
    notes.forEach((note,i)=>{
      pianoNote(note,start+i*spacing,2.6,.24);
      fx(()=>targets.forEach(([c,r])=>litPieces.set(`${c},${r},${i}`,Date.now()+340)),i*spacing*1000);
    });
    const chord=start+notes.length*spacing+.18;
    const delay=(chord-e.ctx.currentTime)*1000;
    fx(()=>targets.forEach(([c,r])=>litPanes.set(`${c},${r}`,Date.now()+1100)),delay);
    fx(()=>targets.forEach(([c,r])=>{const n=viewing.name(c,r);revealedNums.set(n,Date.now()+duration)}),delay);
  }

  // ==== transient visuals ====================================================
  function clearFx(){
    fxTimers.forEach(clearTimeout);fxTimers=[];
    litPanes.clear();litPieces.clear();revealedNums.clear();rects=[];
  }
  function cancelSequence(){seqTimers.forEach(clearTimeout);seqTimers=[]}
  function setProduct(n,factors=[],miss=false){
    clearTimeout(expressionTimer);productBox.classList.toggle('miss',miss);
    if(n==null){productNumber.textContent='';productFactors.textContent='';return}
    productNumber.textContent=n;productFactors.textContent=powerText(factors);
  }
  function frame(width,height,until){
    rects.push({w:width,h:height,until:until||Infinity});
  }
  function showAllRectangles(n){
    const noteCount=Math.max(1,factorize(n).length);
    const until=Date.now()+(noteCount*180)+2200;
    visiblePairs(n).forEach(([a,b])=>{frame(a,b,until);if(a!==b)frame(b,a,until)});
  }

  // ==== Reveal — the atomic action ==========================================
  function revealNumber(n,{rectangles=true,sound=true,message}={}){
    const targets=productCells(n);if(!targets.length)return false;
    clearFx();
    built.add(n);
    setProduct(n,factorize(n));numberProperties(n);
    if(rectangles)showAllRectangles(n);
    if(sound)playFactors(factorize(n),targets);
    showInfo(message!==undefined?message:(targets.length===1?`${n} has found its place.`:`${n} appears in ${targets.length} places.`));
    return true;
  }
  function revealRun(list,label,closing){
    cancelSequence();clearFx();
    const groups=new Map();
    list.forEach(([c,r])=>{const n=viewing.name(c,r);if(!groups.has(n))groups.set(n,[]);groups.get(n).push([c,r])});
    const entries=[...groups.entries()];
    if(!entries.length)return;
    const step=clamp(Math.round(7000/entries.length),140,560);
    entries.forEach(([n,group],i)=>seq(()=>{
      clearFx();
      built.add(n);
      setProduct(n,factorize(n));numberProperties(n);
      playFactors(factorize(n),group);
      showInfo(label);
    },i*step));
    const numbers=entries.map(([n])=>n);
    seq(()=>{showInfo(closing||`${label} — ${numbers.join(', ')}`)},entries.length*step+320);
  }

  // ==== number properties panel =============================================
  function divisorClass(n){
    if(n===1)return'neither abundant nor deficient';
    let sum=1;for(let i=2;i<=Math.sqrt(n);i++)if(n%i===0){sum+=i;if(i!==n/i)sum+=n/i}
    return sum===n?'perfect':sum>n?'abundant':'deficient';
  }
  function numberProperties(n){
    if(n===1){propertyCopy.innerHTML='<p><strong>1</strong> — sets the scale for all other numbers.</p>';return}
    const factors=factorize(n),pairs=visiblePairs(n),sqrt=Math.sqrt(n),square=Number.isInteger(sqrt);
    const pk=Math.floor((Math.sqrt(1+4*n)-1)/2),pronic=pk*(pk+1)===n;
    const tk=Math.floor((Math.sqrt(1+8*n)-1)/2),triangular=tk*(tk+1)/2===n;
    const labels=[];
    if(square)labels.push(`a square: ${sqrt} × ${sqrt}`);
    if(pronic)labels.push(`a pronic: ${pk} × ${pk+1}, two neighboring sides`);
    if(triangular)labels.push(`triangular: 1 + 2 + … + ${tk}`);
    if(factors.length>1&&new Set(factors).size===1)labels.push(`a power of ${factors[0]}`);
    if(factors.length===2)labels.push('semiprime: the product of two primes');
    labels.push(divisorClass(n));
    const below=Math.floor(sqrt)**2,above=Math.ceil(sqrt)**2;
    if(!square&&n-below<=2)labels.push(`${n-below} more than the square ${below}`);
    else if(!square&&above-n<=2)labels.push(`${above-n} short of the square ${above}`);
    const pairText=pairs.length?pairs.map(([a,b])=>`${a} × ${b}`).join(', '):'no complete rectangle in this window';
    propertyCopy.innerHTML=`<p><strong>${n} = ${powerText(factors)}</strong></p><p>Visible rectangles: ${pairText}</p>${labels.map(x=>`<p>${x}</p>`).join('')}`;
  }

  // ==== the whole table =====================================================
  function clearTable(){
    cancelSequence();clearFx();
    built.clear();built.add(1);
    fillCorner=0;updateFillWord();
    composition=[];updateTally();pendingColumn=pendingRow=null;setProduct();clearInfo();
  }
  // Fill has a shape independent of the viewport, which the no-window layout
  // requires: it fills the entire square below-left of a power-of-two corner,
  // pausing at 16² and at every power of two after. The single word Continue?
  // resumes toward the next corner. Still silent — the one reveal that makes
  // no sound.
  let fillCorner=0;                       // last completed corner; 0 = no fill run
  const FILL_FIRST=16, FILL_LAST=1024;    // sanity ceiling on the doubling
  function updateFillWord(){fillContinueButton.hidden=!(fillCorner&&fillCorner<FILL_LAST)}
  function fillSquare(k){
    cancelSequence();clearFx();
    const nums=new Set();
    for(let c=1;c<=k;c++)for(let r=1;r<=k;r++)nums.add(c*r);
    const products=[...nums].filter(n=>!built.has(n)).sort((a,b)=>a-b);
    // Large squares reveal in chunks so the sweep stays ~2.5s and the timer
    // count stays bounded.
    const chunk=Math.max(1,Math.ceil(products.length/140));
    const ticks=Math.ceil(products.length/chunk);
    const step=clamp(Math.round(2500/Math.max(1,ticks)),4,22);
    for(let i=0;i<ticks;i++){
      const slice=products.slice(i*chunk,(i+1)*chunk);
      seq(()=>slice.forEach(n=>built.add(n)),i*step);
    }
    seq(()=>{
      fillCorner=k;updateFillWord();
      setProduct();say(toolPrompt());
    },ticks*step+240);
  }
  function fillTable(){fillSquare(fillCorner?Math.min(fillCorner*2,FILL_LAST):FILL_FIRST)}

  // ==== cell sets ===========================================================
  const columnCells=c=>{const vb=visibleBounds(),out=[];for(let r=vb.rMin;r<=vb.rMax;r++)out.push([c,r]);return out};
  const rowCells=r=>{const vb=visibleBounds(),out=[];for(let c=vb.cMin;c<=vb.cMax;c++)out.push([c,r]);return out};
  function multipleCells(v){
    const out=[];allProducts().filter(n=>n%v===0).forEach(n=>out.push(...productCells(n)));return out;
  }
  function diagonalCells(kind,value){
    const vb=visibleBounds(),out=[];
    for(let c=vb.cMin;c<=vb.cMax;c++)for(let r=vb.rMin;r<=vb.rMax;r++){
      if(kind==='difference'?r-c===value:r+c===value)out.push([c,r]);
    }
    return out;
  }

  // ==== Properties ==========================================================
  const isSquare=n=>{const r=Math.round(Math.sqrt(n));return r*r===n};
  const isPronic=n=>{const k=Math.floor((Math.sqrt(1+4*n)-1)/2);return k>=1&&k*(k+1)===n};
  const isTriangular=n=>{const k=Math.floor((Math.sqrt(8*n+1)-1)/2);return k*(k+1)/2===n};
  const isPowerOf=(n,p)=>{let v=1;while(v<n)v*=p;return v===n};
  const isNearSquare=n=>n>1&&!isSquare(n)&&(isSquare(n-1)||isSquare(n+1));
  const propertyLabels={squares:'Squares',pronics:'Pronics',powers2:'Powers of 2',powers3:'Powers of 3',triangular:'Triangular numbers',nearlysquare:'Nearly square'};
  const propertyTests={squares:isSquare,pronics:isPronic,powers2:n=>isPowerOf(n,2),powers3:n=>isPowerOf(n,3),triangular:isTriangular,nearlysquare:isNearSquare};
  function revealProperty(name){
    propertyButtons.forEach(b=>b.classList.toggle('active',b.dataset.property===name));
    const numbers=allProducts().filter(propertyTests[name]);
    const list=[];numbers.forEach(n=>list.push(...productCells(n)));
    revealRun(list,propertyLabels[name],`${propertyLabels[name]} — ${numbers.join(', ')}`);
  }

  // ==== the tile world ======================================================
  // Multiply, Divide and Make a Square share one vocabulary — rectangle,
  // width, height — and one substance: pieces. Everything here is anchored at
  // the origin and measured in units, so it stands on the same plane as the
  // panes and needs no coordinate system of its own.
  //
  // A piece is one unit wide, always. What changes when she refines is its
  // thickness, so a row of a stack always holds `w` pieces. That is what makes
  // 20/7 come out at 2.85 rather than at some other arrangement of tenths.

  function unitRect(x0,y0,w,h){
    const tl=plane.worldToScreen(x0*U,(y0+h)*U), br=plane.worldToScreen((x0+w)*U,y0*U);
    return {x:tl.x,y:tl.y,w:br.x-tl.x,h:br.y-tl.y};
  }
  // A field of pieces. The glass is unity glass — a piece is a 1, and 1 is
  // what this viewing already draws white and crystalline. No new colour is
  // declared: inside this viewing colour is prime identity and nothing else.
  function drawTileField(x0,y0,w,h,pw,ph,alpha){
    if(!(w>0)||!(h>0))return;
    const R=unitRect(x0,y0,w,h);
    if(R.w<0.5||R.h<0.5)return;
    ctx.save();
    ctx.globalAlpha=alpha===undefined?1:alpha;
    const g=ctx.createRadialGradient(R.x+R.w*0.44,R.y+R.h*0.38,0,R.x+R.w*0.44,R.y+R.h*0.38,Math.max(R.w,R.h)*0.75);
    g.addColorStop(0,'#ffffff');g.addColorStop(0.62,'#e9eef5');g.addColorStop(1,'#cfd6e0');
    ctx.fillStyle=g;ctx.fillRect(R.x,R.y,R.w,R.h);
    // Piece cames, drawn only while a piece is still a piece on screen.
    const z=plane.zoom(), sw=pw*U*z, sh=ph*U*z;
    if(sw>=4&&sh>=4){
      ctx.strokeStyle=INNER_CAME;ctx.lineWidth=1;ctx.beginPath();
      for(let x=pw;x<w-1e-9;x+=pw){const sx=CW.snap(R.x+(x/w)*R.w);ctx.moveTo(sx,R.y);ctx.lineTo(sx,R.y+R.h)}
      for(let y=ph;y<h-1e-9;y+=ph){const sy=CW.snap(R.y+R.h-(y/h)*R.h);ctx.moveTo(R.x,sy);ctx.lineTo(R.x+R.w,sy)}
      ctx.stroke();
    }
    ctx.strokeStyle=FRAME_CAME;ctx.lineWidth=1.5;
    ctx.strokeRect(R.x,R.y,R.w,R.h);
    ctx.restore();
  }
  // Text on the map itself: a label sitting on an object she has built.
  function drawMapLabel(text,ux,uy,align,baseline){
    const s0=plane.worldToScreen(ux*U,uy*U);
    ctx.save();
    ctx.font='13px Georgia, serif';
    ctx.textAlign=align||'left';ctx.textBaseline=baseline||'bottom';
    ctx.fillStyle='rgba(49,50,47,0.9)';
    ctx.shadowColor='rgba(244,241,232,0.9)';ctx.shadowBlur=4;
    ctx.fillText(text,s0.x,s0.y);
    ctx.restore();
  }
  // The measuring bar: a line standing on the axis, with an arrow at its left
  // pointing toward it (Divide spec). Multiply's planted bar is the same
  // instrument, which is the point — width first, in both tools.
  function drawBar(v,axis){
    const W=plane.viewportWidth(),H=plane.viewportHeight();
    const o=plane.worldToScreen(0,0);
    ctx.save();
    ctx.strokeStyle='#546a80';ctx.lineWidth=2;ctx.beginPath();
    if(axis==='y'){
      const y=CW.snap(plane.worldToScreen(0,v*U).y);
      ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
      ctx.fillStyle='#546a80';
      const ax=clamp(o.x+44,16,W-16);
      ctx.beginPath();ctx.moveTo(ax,y+2);ctx.lineTo(ax-5,y+13);ctx.lineTo(ax+5,y+13);ctx.closePath();ctx.fill();
    } else {
      const x=CW.snap(plane.worldToScreen(v*U,0).x);
      ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
      ctx.fillStyle='#546a80';
      const ay=clamp(o.y-44,16,H-16);
      ctx.beginPath();ctx.moveTo(x-2,ay);ctx.lineTo(x-13,ay-5);ctx.lineTo(x-13,ay+5);ctx.closePath();ctx.fill();
    }
    ctx.restore();
  }

  // ==== the readout =========================================================
  // The cross-tool rule (00-DECISIONS, 24 Aug): the live number floats above
  // the finger, on the side the drag came from; a second fixed copy sits in a
  // constant corner, the same corner in every tool. The floating copy is for
  // reading while moving; the fixed copy is the one that still works when her
  // hand is in the way. The corner is the map's bottom right, above the pixel
  // floor line — chosen here; the decision names a constant corner, not which.
  let mapText='', liveText=null;   // liveText: {text, sx, sy, side}
  function setMapText(text){mapText=text||''}
  function setLive(text,sx,sy,side){liveText=text?{text,sx,sy,side}:null}
  function say(text){readout.textContent=text||''}
  function drawReadouts(){
    const W=plane.viewportWidth(),H=plane.viewportHeight();
    if(mapText){
      ctx.save();
      ctx.font='14px Georgia, serif';ctx.fillStyle='#546a80';
      ctx.textAlign='right';ctx.textBaseline='bottom';
      ctx.fillText(mapText,W-10,H-24);
      ctx.restore();
    }
    if(liveText){
      ctx.save();
      ctx.font='16px Georgia, serif';ctx.textBaseline='alphabetic';
      const tw=ctx.measureText(liveText.text).width;
      const onLeft=liveText.side==='left';
      const x=clamp(liveText.sx+(onLeft?-16:16),10+(onLeft?tw:0),W-10-(onLeft?0:tw));
      const y=clamp(liveText.sy-30,26,H-10);
      const bx=onLeft?x-tw-6:x-6;
      ctx.fillStyle='rgba(244,241,232,0.9)';
      ctx.fillRect(bx,y-16,tw+12,22);
      ctx.fillStyle='#31322f';
      ctx.textAlign=onLeft?'right':'left';
      ctx.fillText(liveText.text,x,y);
      ctx.restore();
    }
  }

  // ==== Multiply ============================================================
  // 01-ACTIVE/Multiply-Spec-Aug24.md. One continuous stroke: down on the axis,
  // the bar follows and the display reads the width alone; up into the field
  // and the rectangle grows as an outline behind the finger; release and it
  // fills, row by row, the product counting up as each row lands.
  //
  // Sides are chosen; area is discovered. The fill is a separate event after
  // release so the two never blur into one gesture.
  let multiply=null;          // {x,y,rows,t0,step,done}
  let pending=null;           // {axis:'x'|'y', v} — the planted bar
  let dragBar=null;           // the bar under a live stroke, before release
  const multiplyReps=new Map();

  // (1,1) sits on both axes. With nothing planted it is the x axis — the first
  // number is x. With something planted it closes on the other one.
  function axisOf(c,r){
    if(c===1&&r===1)return pending==null?'x':(pending.axis==='x'?'y':'x');
    return r===1?'x':'y';
  }
  function fillStep(rows,reps){
    const base=clamp(Math.round(2400/Math.max(1,rows)),40,300);
    return Math.max(22,Math.round(base/(1+0.9*reps)));   // per repeated shape, not global
  }
  function tapAxis(axis,v){
    if(pending==null){
      multiply=null;clearFx();
      pending={axis,v};
      litPanes.set(axis==='x'?`${v},1`:`1,${v}`,Infinity);
      setMapText(String(v));say(String(v));
      return;
    }
    let x,y;
    if(pending.axis===axis){x=pending.v;y=v}        // same axis: the first is x
    else if(pending.axis==='x'){x=pending.v;y=v}
    else {x=v;y=pending.v}
    pending=null;
    multiplyBuild(x,y);
  }
  function multiplyBuild(x,y){
    cancelSequence();clearFx();
    const key=x+'x'+y, reps=multiplyReps.get(key)||0;
    multiplyReps.set(key,reps+1);
    multiply={x,y,rows:0,t0:Date.now(),step:fillStep(y,reps),done:false};
    setMapText(`${x} × ${y}`);say(`${x} × ${y}`);
  }
  function multiplyAdvance(){
    const m=multiply;if(!m||m.done)return;
    const rows=Math.min(m.y,Math.floor((Date.now()-m.t0)/m.step));
    if(rows!==m.rows){
      m.rows=rows;
      setMapText(`${m.x} × ${m.y} = ${rows*m.x}`);
    }
    if(rows>=m.y){
      m.done=true;
      const n=m.x*m.y;
      built.add(n);
      litPanes.set(`${m.x},${m.y}`,Infinity);   // its own spot, lit until the next act
      setProduct(n,factorize(n));
      playFactors(factorize(n),[[m.x,m.y]]);
      setMapText(`${m.x} × ${m.y} = ${n}`);say(`${m.x} × ${m.y} = ${n}`);
    }
  }
  function drawMultiply(){
    if(pending)drawBar(pending.v,pending.axis);
    if(dragBar)drawBar(dragBar.v,dragBar.axis);
    const m=multiply;if(!m)return;
    if(m.rows>0)drawTileField(0,0,m.x,m.rows,1,1,1);
    const R=unitRect(0,0,m.x,m.y);
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,0.95)';ctx.lineWidth=3;
    ctx.shadowColor='rgba(255,255,255,0.6)';ctx.shadowBlur=9;
    ctx.strokeRect(R.x,R.y,R.w,R.h);
    ctx.restore();
  }

  // ==== Build ===============================================================
  const compositionTotal=()=>composition.reduce((a,b)=>a*b,1);
  function compositionText(){
    return composition.length?`1 × ${composition.join(' × ')} = ${compositionTotal()}`:'1';
  }
  function updateTally(){
    const on=mode==='build'&&buildTool==='primes';
    tally.hidden=!on;if(on)tally.textContent=compositionText();
  }
  function resetComposition(){clearTimeout(expressionTimer);composition=[];updateTally()}
  function addPrime(prime){
    clearTimeout(expressionTimer);
    const n=compositionTotal()*prime;
    // Refuse a tap that would leave the window; the composition stays as it was.
    // softMiss is a shrug, not an error tone — nothing else marks this.
    if(!productCells(n).length){readout.textContent='That number continues beyond this window.';softMiss();return}
    composition.push(prime);updateTally();
    cancelSequence();revealNumber(n);
  }
  function buildTap(column,row){
    const n=viewing.name(column,row);
    if(buildTool==='primes'){
      if(n===1){resetComposition();setProduct();revealNumber(1,{message:'Back to 1. Every number starts here.'});return}
      readout.textContent='Tap a prime below to multiply it in.';return;
    }
    if(buildTool==='select'){cancelSequence();revealNumber(n);return}
    if(buildTool==='axes'){
      if(row===1)revealRun(columnCells(column),`Column ${column}`);
      else if(column===1)revealRun(rowCells(row),`Row ${row}`);
      else readout.textContent='Tap a pane along the bottom for its column, or up the left side for its row.';
      return;
    }
    if(buildTool==='multiples'){
      if(row===1||column===1){const v=row===1?column:row;revealRun(multipleCells(v),`Multiples of ${v}`)}
      else readout.textContent='Tap a number along the bottom or up the left side.';
      return;
    }
    if(buildTool==='diagup'){revealRun(diagonalCells('difference',row-column),`↗ same difference · ${Math.abs(row-column)}`);return}
    if(buildTool==='diagdown'){revealRun(diagonalCells('sum',row+column),`↘ same sum · ${row+column}`)}
  }

  // ==== the leftover choice =================================================
  // Divide offers three; Make a Square offers two and nothing occupies the
  // gap — no greyed-out word, no explanation, no tooltip. If the two tools
  // look deliberately alike, the missing word is the difference between
  // rational and irrational, sitting where she can find it.
  const leftoverPanel=CW.createChoicePanel();

  // ==== Divide ==============================================================
  // 01-ACTIVE/Divide-Spec-Aug23.md. She picks a number, sweeps a bar to choose
  // a width, and the number restacks into that many stacks. The answer is a
  // height, never a printed result — which is what keeps division and
  // multiplication in one world.
  let divide=null;
  const divideReps=new Map();    // divisor -> times used; acceleration is per
                                 // repeated divisor, not on a global counter
  const divideOpen=new Set();    // divisors seen not to close in decimals

  // The bar snaps to whole units. Every place it can stop produces something
  // legible; continuous has no floor. The spec unlocks tenths by zooming far
  // enough that whole units are wide on screen, and leaves the fractional
  // divisor itself under Open — so the unlock is a hook here, not a feature.
  function barWidthAt(sx){
    const w=plane.screenToWorld(sx,0).x/U;
    return Math.max(0,Math.round(w));
  }
  function rowStep(rows,reps){
    const base=clamp(Math.round(2400/Math.max(1,rows)),40,300);
    return Math.max(22,Math.round(base/(1+0.9*reps)));
  }
  function divideStart(c,r){
    cancelSequence();clearFx();leftoverPanel.close();
    const n=viewing.name(c,r);
    built.add(n);
    setProduct(n,factorize(n));
    divide={n,c,r,srcW:c,srcH:r,w:null,bar:null,phase:'sweep',layers:[],
            baseRows:0,rem:0,ph:1,k:0,t0:0,mode:null,settled:true,srcAlpha:1};
    setMapText(`${n}/`);say(`${n}/`);
  }
  function divideSet(w){
    const d=divide;if(!d||d.phase!=='sweep')return;
    d.w=w;d.bar=w;d.t0=Date.now();
    if(w<=0){
      // The bar has zero width, so there is nowhere to put the tiles. Handled
      // by the geometry, not by a rule anyone wrote: rectangle intact.
      d.phase='stuck';setMapText(`${d.n}/0`);say(`${d.n}/0`);return;
    }
    const reps=divideReps.get(w)||0;divideReps.set(w,reps+1);
    const rows=Math.floor(d.n/w);
    d.baseRows=rows;d.rem=d.n-rows*w;d.ph=1;d.k=0;
    d.layers=[{rows,ph:1,shown:0,t0:Date.now(),step:rowStep(Math.max(1,rows),reps)}];
    d.phase='restack';d.settled=false;
  }
  function divideHeight(d){
    let h=0;d.layers.forEach(L=>{h+=Math.min(L.rows,L.shown)*L.ph});return h;
  }
  function divideAdvance(){
    const d=divide;if(!d)return;
    if(d.phase==='stuck'||!d.layers.length)return;
    const now=Date.now();
    d.srcAlpha=clamp(1-(now-d.t0)/700,0,1);
    let done=true;
    for(const L of d.layers){
      const sh=Math.min(L.rows,Math.floor((now-L.t0)/L.step));
      if(sh!==L.shown)L.shown=sh;
      if(sh<L.rows){done=false;break}
    }
    if(!done){
      if(!d.mode){
        const shown=Math.min(d.layers[0].rows,d.layers[0].shown);
        setMapText(d.rem?`${shown} + ${d.rem}/${d.w}`:`${shown}`);
      }
      return;
    }
    if(d.settled)return;
    d.settled=true;
    if(d.mode==='fraction'){
      setMapText(`${d.n} ÷ ${d.w} = ${d.baseRows} + ${d.fracRem}/${d.w}`);
      say(`${d.n} ÷ ${d.w} = ${d.baseRows} + ${d.fracRem}/${d.w}`);
      d.phase='done';return;
    }
    if(d.mode==='remainder'){
      setMapText(`${d.n} ÷ ${d.w} = ${d.baseRows} remainder ${d.rem}`);
      say(`${d.n} ÷ ${d.w} = ${d.baseRows} remainder ${d.rem}`);
      d.phase='done';return;
    }
    if(d.k>0){
      const h=divideHeight(d).toFixed(d.k);
      if(d.rem===0){
        setMapText(`${d.n} ÷ ${d.w} = ${h}`);say(`${d.n} ÷ ${d.w} = ${h}`);
        d.phase='done';return;
      }
      if(grainVisible(d.ph/10)){
        setMapText(`${d.n} ÷ ${d.w} = ${h}`);say(`${d.n} ÷ ${d.w} = ${h}`);
        d.phase='choose';openDivideChoices();return;
      }
      // It will not close, and the slices have run out of screen. The report
      // arrives after the fact — never as a warning before she chose.
      divideOpen.add(d.w);
      setMapText(`${d.n} ÷ ${d.w} ≈ ${h}…`);
      say(`these slices are too thin to show on your screen, so ${d.n}/${d.w} = ~${h}…`);
      d.phase='done';return;
    }
    // The base stack has finished.
    if(d.rem===0){
      setMapText(`${d.n} ÷ ${d.w} = ${d.baseRows}`);say(`${d.n} ÷ ${d.w} = ${d.baseRows}`);
      // She is standing on a cell of the multiplication map. Highlight it and
      // say nothing.
      if(d.baseRows>=1){built.add(d.n);litPanes.set(`${d.w},${d.baseRows}`,Infinity)}
      d.phase='done';return;
    }
    setMapText(`${d.baseRows} + ${d.rem}/${d.w}`);
    say(`${d.baseRows} + ${d.rem}/${d.w}`);
    d.phase='choose';openDivideChoices();
  }
  function openDivideChoices(){
    const d=divide;if(!d)return;
    leftoverPanel.open({choices:[
      {word:'Remainder',line:'the tiles stay as they are',action:()=>{
        d.mode='remainder';d.settled=false;d.phase='restack';
      }},
      {word:'Fractions',line:'cut each tile by the number of stacks',action:()=>{
        // The divisor is the denominator. The shape she already built dictates
        // the cut: nothing to select, nothing to explain. Exact, and flush.
        const rem=d.rem;
        d.fracRem=rem;d.mode='fraction';
        d.layers.push({rows:rem,ph:1/d.w,shown:0,t0:Date.now(),
                       step:rowStep(Math.max(1,rem),divideReps.get(d.w)-1||0)});
        d.rem=0;d.ph=1/d.w;d.settled=false;d.phase='restack';
      }},
      // The mark arrives only after a divisor has been seen not to close, and
      // only ever afterwards.
      {word:'Decimals'+(divideOpen.has(d.w)?' …':''),line:'cut each tile into tenths',action:()=>{
        const pieces=d.rem*10, ph=d.ph/10;
        const rows=Math.floor(pieces/d.w);
        d.rem=pieces-rows*d.w;d.ph=ph;d.k+=1;d.mode='decimal';
        d.layers.push({rows,ph,shown:0,t0:Date.now(),
                       step:rowStep(Math.max(1,rows),divideReps.get(d.w)-1||0)});
        d.settled=false;d.phase='restack';
      }}
    ]});
  }
  function drawDivide(){
    const d=divide;if(!d)return;
    if(d.srcAlpha>0)drawTileField(0,0,d.srcW,d.srcH,1,1,d.srcAlpha);
    if(d.phase==='sweep'){if(d.bar!=null)drawBar(d.bar,'x');return}
    if(d.phase==='stuck'){drawBar(0,'x');return}
    let y=0;
    d.layers.forEach(L=>{
      const sh=Math.min(L.rows,L.shown);
      if(sh>0)drawTileField(0,y,d.w,sh*L.ph,1,L.ph,1);
      y+=sh*L.ph;
    });
    // The leftovers, sitting on top of the completed rows.
    if(d.rem>0&&d.phase!=='restack')drawTileField(0,y,d.rem,d.ph,1,d.ph,1);
    drawBar(d.w,'x');
    if(y>0){
      const label=d.mode==='fraction'?`${d.baseRows} + ${d.fracRem}/${d.w}`:fmtNum(y,d.k);
      drawMapLabel(label,d.w+0.15,y,'left','middle');
    }
  }

  // ==== Make a Square =======================================================
  // 01-ACTIVE/Make-This-Square-Spec-Aug23.md. The number rebuilds itself into
  // the largest square it can make, one L-ring at a time, and then stops.
  // Four is too small, five is too big, and there is no whole number in
  // between: that pause is the tool, so nothing proceeds automatically.
  let square=null;
  const squareReps=new Map();
  function grainVisible(g){return g*U*plane.zoom()>=0.25}
  function fmtNum(v,k){return k>0?v.toFixed(k):String(Math.round(v))}
  function ringStep(count,reps){
    const base=clamp(Math.round(2800/Math.max(1,count)),150,700);
    return Math.max(60,Math.round(base/(1+0.8*reps)));
  }
  function squareStart(c,r){
    cancelSequence();clearFx();leftoverPanel.close();
    const n=viewing.name(c,r);
    built.add(n);
    setProduct(n,factorize(n));
    const reps=squareReps.get(n)||0;squareReps.set(n,reps+1);
    const target=Math.floor(Math.sqrt(n));
    const rings=[];for(let s=1;s<=target;s++)rings.push(2*s-1);
    square={n,c,r,k:0,baseSide:0,side:target,rings,shown:0,
            t0:Date.now(),step:ringStep(rings.length,reps),
            left:n-target*target,phase:'build',settled:false,reps,
            srcW:c,srcH:r,srcT0:Date.now(),srcAlpha:1};
    setMapText(`${n}`);say(`${n}`);
  }
  function squareRefine(){
    const q=square;if(!q)return;
    q.k+=1;
    const N=Math.round(q.n*Math.pow(100,q.k));
    const base=q.side*10, target=Math.floor(Math.sqrt(N));
    const rings=[];for(let s=base+1;s<=target;s++)rings.push(2*s-1);
    q.baseSide=base;q.side=target;q.rings=rings;q.shown=0;
    q.t0=Date.now();q.step=ringStep(Math.max(1,rings.length),q.reps);
    q.left=N-target*target;q.phase='build';q.settled=false;
  }
  function squareSide(q){return (q.baseSide+Math.min(q.rings.length,q.shown))*Math.pow(10,-q.k)}
  function squareAdvance(){
    const q=square;if(!q||q.phase==='done')return;
    const shown=Math.min(q.rings.length,Math.floor((Date.now()-q.t0)/q.step));
    if(shown!==q.shown){
      q.shown=shown;
      const side=squareSide(q), g=Math.pow(10,-q.k);
      const used=Math.round(side/g)*Math.round(side/g);
      const leftArea=q.n-used*g*g;
      setMapText(leftArea>1e-9
        ? `${q.n} = ${fmtNum(side,q.k)} × ${fmtNum(side,q.k)} + ${fmtNum(leftArea,2*q.k)}`
        : `${q.n} = ${fmtNum(side,q.k)} × ${fmtNum(side,q.k)}`);
    }
    if(shown<q.rings.length||q.settled)return;
    q.settled=true;
    const side=squareSide(q), g=Math.pow(10,-q.k);
    if(q.left===0){
      // Perfect squares announce themselves by finishing. No choice offered.
      setMapText(`√${q.n} = ${fmtNum(side,q.k)}`);say(`√${q.n} = ${fmtNum(side,q.k)}`);
      q.phase='done';return;
    }
    if(!grainVisible(g/10)){
      setMapText(`√${q.n} ≈ ${fmtNum(side,q.k)}…   ·   ${q.n} ≈ ${fmtNum(side,q.k)}²`);
      say('this can go on as long as you like, but the tiles will be too small to see.');
      q.phase='done';return;
    }
    q.phase='choose';
    say(`${q.n} = ${fmtNum(side,q.k)} × ${fmtNum(side,q.k)} + ${fmtNum(q.left*g*g,2*q.k)}`);
    leftoverPanel.open({choices:[
      {word:'Leave it',line:'the square, and what did not fit',action:()=>{
        q.phase='done';
        setMapText(`${q.n} = ${fmtNum(side,q.k)} × ${fmtNum(side,q.k)} + ${fmtNum(q.left*g*g,2*q.k)}`);
      }},
      {word:'Decimals',line:'each leftover tile slices into a hundred smaller ones',
       action:()=>squareRefine()}
      // Nothing occupies the third place. There is no fraction that squares
      // to 18 — not a hard one, not an ugly one. None.
    ]});
  }
  function drawSquare(){
    const q=square;if(!q)return;
    if(q.srcAlpha>0){
      q.srcAlpha=clamp(1-(Date.now()-q.srcT0)/700,0,1);
      drawTileField(0,0,q.srcW,q.srcH,1,1,q.srcAlpha);
    }
    const g=Math.pow(10,-q.k);
    const sidePieces=q.baseSide+Math.min(q.rings.length,q.shown);
    const side=sidePieces*g;
    if(side>0)drawTileField(0,0,side,side,g,g,1);
    // The rings stay visibly L-shaped: the odd count should be something she
    // can see rather than read.
    ctx.save();
    ctx.strokeStyle='rgba(84,106,128,0.75)';ctx.lineWidth=1.5;
    for(let i=0;i<Math.min(q.rings.length,q.shown);i++){
      const sp=(q.baseSide+i+1)*g;
      const a=plane.worldToScreen(sp*U,0), b=plane.worldToScreen(sp*U,sp*U), c2=plane.worldToScreen(0,sp*U);
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c2.x,c2.y);ctx.stroke();
    }
    ctx.restore();
    // The ring labels — 1, 3, 5, 7 — sitting on the rings themselves. Drawn
    // only while a ring is thick enough to carry one; otherwise the last.
    const shown=Math.min(q.rings.length,q.shown);
    if(shown>0){
      const wide=g*U*plane.zoom()>=11;
      const from=wide?0:shown-1;
      for(let i=from;i<shown;i++){
        const sp=(q.baseSide+i+1)*g;
        drawMapLabel(String(q.rings[i]),sp+0.06,sp,'left','middle');
      }
    }
    // What did not fit, sitting beside the square.
    if(q.left>0&&q.shown>=q.rings.length)drawTileField(side,0,q.left*g,g,g,g,1);
  }

  // ==== Explore =============================================================
  // The asking gesture. She reviews what is on the map: the numbers are
  // visible, nothing is filled in for her, and tapping any of them shows it
  // with its prime colours and tones — Build by Selecting, as it behaves in
  // this file today.
  function explore(column,row){
    cancelSequence();
    revealNumber(viewing.name(column,row));
  }

  // ==== the tools ===========================================================
  // Modes are abolished (00-DECISIONS, The shelf). What is left is four tools
  // living in one panel: choosing one makes it active and replaces the prompt.
  // A second choice never opens a second panel.
  const buildPrompts={
    primes:'Tap a prime to multiply it into the number.',
    select:'Tap any pane to reveal that number, everywhere it lives.',
    axes:'Tap along the bottom for a column, up the left side for a row.',
    multiples:'Tap a number along the bottom or the left side to find its multiples.',
    diagup:'Tap any pane to run the ↗ diagonal through it — same difference.',
    diagdown:'Tap any pane to run the ↘ diagonal through it — same sum.'
  };
  function toolPrompt(){
    const t=TOOLS.find(x=>x.id===mode);
    return t?t.prompt:'';
  }
  const selecting=()=>mode==='multiply';
  function setBuildTool(tool){   // Build has no word on the surface yet; kept whole
    buildTool=tool;
    buildSubButtons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.build===tool)));
    cancelSequence();clearFx();composition=[];updateTally();
    readout.textContent=buildPrompts[tool];
  }
  // Switching tools puts down what the last one was holding. It does not clear
  // the glass: she built that, and an asking gesture must not unmake it.
  function clearToolWork(){
    cancelSequence();clearFx();leftoverPanel.close();
    multiply=null;divide=null;square=null;pending=null;
    setMapText('');setLive(null);
    composition=[];updateTally();
    setProduct();clearInfo();
  }
  function syncNumbersWord(){
    numbersButton.setAttribute('aria-pressed',String(showNumerals));
    numbersButton.textContent=showNumerals?'Hide numbers':'Show numbers';
  }
  function setTool(next,opts){
    opts=opts||{};
    mode=next;
    clearToolWork();
    document.querySelectorAll('.bn-tool').forEach(el=>
      el.classList.toggle('active',el.dataset.tool===next));
    // Divide, Make a square and Explore all begin by picking a number off the
    // map, so the numbers have to be there to pick.
    if(next!=='multiply'&&!showNumerals){showNumerals=true;syncNumbersWord()}
    // The prompt line is empty until she chooses a tool in the panel; Multiply
    // is the tool the lab rests in, so the map works before she opens anything.
    if(opts.fromPanel)showPrompt(toolPrompt(),next);
    say(toolPrompt());
  }

  // ==== rendering ============================================================
  const seedOf=(c,r,i,s)=>(c*37+r*19+i*23+s)%100;
  const INNER_CAME='rgb(145,145,145)', FRAME_CAME='rgb(98,98,98)';

  function paneScreenRect(c,r){
    // Pane (c,r) covers world [(c-1)U, cU] × [(r-1)U, rU]; y is up, so the
    // pane's top edge is world y = rU.
    const tl=plane.worldToScreen((c-1)*U,r*U), br=plane.worldToScreen(c*U,(r-1)*U);
    return {x:tl.x,y:tl.y,w:br.x-tl.x,h:br.y-tl.y};
  }

  function drawPiece(x,y,w,h,p,variant,lit,tier,c,r,i){
    ctx.fillStyle=pieceFill(p,variant,lit);
    ctx.fillRect(x,y,w,h);
    // The catch decision is seeded per pane position and piece, not per
    // colour bucket — otherwise every piece of one colour decides together
    // and far fewer than 20% of the glass ever sparkles. (Found on the
    // iPad: taps read barely lit next to the bench.) Highlights also draw
    // on the middle detail tier, not only the largest panes.
    const wantHighlight=lit&&tier>=1&&seedOf(c,r,i,83)<20;
    if(tier<2&&!wantHighlight)return;
    ctx.save();
    ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
    if(tier===2){
      // Striations: directional, chosen per piece — a glazier cuts from a
      // sheet and not every piece comes off it the same way round. 70%
      // across the stack (vertical, crossing the horizontal boundaries).
      const across=seedOf(c,r,i,29)<70;
      for(let k=0;k<2;k++){
        const off=(seedOf(c,r,i*2+k,37)/100);
        ctx.strokeStyle=k?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.07)';
        ctx.lineWidth=1;
        ctx.beginPath();
        if(across){const sx=CW.snap(x+off*w);ctx.moveTo(sx,y);ctx.lineTo(sx,y+h)}
        else{const sy=CW.snap(y+off*h);ctx.moveTo(x,sy);ctx.lineTo(x+w,sy)}
        ctx.stroke();
      }
      // Seeds: tiny bubbles in the glass
      for(let k=0;k<2;k++){
        const bx=x+(seedOf(c,r,i*2+k,53)/100)*w, by=y+(seedOf(c,r,i*2+k,71)/100)*h;
        ctx.fillStyle=k?'rgba(255,255,255,0.16)':'rgba(0,0,0,0.12)';
        ctx.fillRect(bx,by,1.5,1.5);
      }
    }
    // Specular highlight — light reflecting off the glass, only when lit,
    // only on the pieces whose angle happens to be right (20%), elliptical,
    // and smaller burns brighter (intensity scales on area).
    if(wantHighlight){
      const area=w*h, ref=60*60;
      const strength=0.89*clamp(Math.sqrt(ref/Math.max(1,area)),0.55,2.0);
      const hx=x+w*(0.3+0.4*(seedOf(c,r,i,11)/100)), hy=y+h*0.3;
      const rx=Math.min(w,h)*0.42, ry=rx/2.03;   // 203% elongation
      ctx.save();
      ctx.translate(hx,hy);ctx.rotate(-0.35);
      const g=ctx.createRadialGradient(0,0,0,0,0,rx);
      g.addColorStop(0,`rgba(255,252,240,${clamp(strength*0.55,0,0.9)})`);
      g.addColorStop(1,'rgba(255,252,240,0)');
      ctx.scale(1,ry/rx);
      ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(0,0,rx,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawUnityPane(rect){
    // Whole and white — quietly crystalline, a slight bluish tint. No prime
    // pieces: the empty product. The tint separates it from clear leaded
    // glass, which means "prime beyond this workshop".
    const g=ctx.createRadialGradient(rect.x+rect.w*0.44,rect.y+rect.h*0.38,0,rect.x+rect.w*0.44,rect.y+rect.h*0.38,rect.w*0.75);
    g.addColorStop(0,'#ffffff');g.addColorStop(0.62,'#e9eef5');g.addColorStop(1,'#cfd6e0');
    ctx.fillStyle=g;ctx.fillRect(rect.x,rect.y,rect.w,rect.h);
  }

  function drawPane(c,r,n){
    const rect=paneScreenRect(c,r);
    const size=Math.min(rect.w,rect.h);
    const now=Date.now();
    const paneLit=(litPanes.get(`${c},${r}`)||0)>now;
    const tier=size>=48?2:size>=18?1:0;
    if(n===1){drawUnityPane(rect)}
    else{
      const factors=factorize(n);   // ascending: smallest prime first, at the top,
                                    // identically everywhere — no mirrored panes
      const k=factors.length;
      if(tier===0){
        drawPiece(rect.x,rect.y,rect.w,rect.h,factors[0],seedOf(c,r,0,7)%VARIANTS,paneLit,0,c,r,0);
      } else {
        for(let i=0;i<k;i++){
          const py=rect.y+(rect.h*i/k), ph=rect.h/k;
          const lit=paneLit||((litPieces.get(`${c},${r},${i}`)||0)>now);
          drawPiece(rect.x,py,rect.w,ph,factors[i],seedOf(c,r,i,7)%VARIANTS,lit,tier,c,r,i);
        }
        // Inner cames: every piece is leaded, not just every pane — without
        // them, adjacent pieces of the same prime merge into a solid block.
        if(k>1){
          ctx.strokeStyle=INNER_CAME;ctx.lineWidth=1;ctx.beginPath();
          for(let i=1;i<k;i++){
            const sy=CW.snap(rect.y+rect.h*i/k);
            ctx.moveTo(rect.x,sy);ctx.lineTo(rect.x+rect.w,sy);
          }
          ctx.stroke();
        }
      }
    }
    // The pane frame sits over the inner cames, as real leaded glass does.
    ctx.strokeStyle=FRAME_CAME;ctx.lineWidth=1.5;
    ctx.strokeRect(rect.x,rect.y,rect.w,rect.h);
  }

  function drawNumeral(c,r,n){
    const rect=paneScreenRect(c,r);
    if(Math.min(rect.w,rect.h)<22)return;
    const size=clamp(rect.w*0.22,10,18);
    ctx.font=size+'px Georgia, serif';
    ctx.textAlign='right';ctx.textBaseline='top';
    if(built.has(n)){
      ctx.fillStyle='rgba(255,252,229,0.96)';
      ctx.shadowColor='rgba(0,0,0,0.9)';ctx.shadowBlur=3;ctx.shadowOffsetY=1;
    } else {
      ctx.fillStyle='rgba(77,78,74,0.84)';
    }
    ctx.fillText(String(n),rect.x+rect.w*0.93,rect.y+rect.h*0.05);
    ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  }

  function drawRects(){
    const now=Date.now();
    rects=rects.filter(rc=>rc.until>now);
    rects.forEach(rc=>{
      const tl=plane.worldToScreen(0,rc.h*U), br=plane.worldToScreen(rc.w*U,0);
      ctx.save();
      ctx.strokeStyle='rgba(255,255,255,0.95)';
      ctx.lineWidth=3;
      ctx.shadowColor='rgba(255,255,255,0.6)';ctx.shadowBlur=9;
      ctx.strokeRect(tl.x,tl.y,br.x-tl.x,br.y-tl.y);
      ctx.restore();
    });
  }

  // The viewing's axis furniture: origin dot and compass letters. The map has
  // directions even with one quadrant drawn — W and S point into territory
  // that exists and is not drawn; that is the point. Clamped to the viewport
  // edge like the lattice labels: the window is small, the map is not.
  function drawAxes(){
    const o=plane.worldToScreen(0,0);
    const W=plane.viewportWidth(),H=plane.viewportHeight();
    if(numbersMode!=='map'){
      // With the lattice off the axes still need their lines to anchor to.
      ctx.save();
      ctx.strokeStyle='#546A80';ctx.globalAlpha=0.3;ctx.lineWidth=1;
      ctx.beginPath();
      const ax=CW.snap(o.x),ay=CW.snap(o.y);
      ctx.moveTo(ax,0);ctx.lineTo(ax,H);ctx.moveTo(0,ay);ctx.lineTo(W,ay);
      ctx.stroke();ctx.restore();
    }
    ctx.save();
    ctx.fillStyle='#434b50';
    ctx.beginPath();ctx.arc(o.x,o.y,2.6,0,Math.PI*2);ctx.fill();
    ctx.font='italic 11px Georgia, serif';
    ctx.fillStyle='rgba(104,106,98,0.6)';
    const ry=clamp(o.y-9,12,H-6), cx=clamp(o.x+12,12,W-12);
    ctx.textAlign='right';ctx.fillText('E',W-6,ry);
    ctx.textAlign='left'; ctx.fillText('W',6,ry);
    ctx.fillText('N',cx,12);
    ctx.fillText('S',cx,H-6);
    ctx.restore();
  }

  // The rebuild animation: the numbering circles step off each integer along
  // both axes, then the glass returns — the construction the map is the
  // residue of, drawn from the plane's frame rather than DOM rectangles.
  const reduceMotion=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  const REBUILD_CIRCLES=(()=>{const a=[];for(let k=1;k<=10;k++)a.push([k*U,0]);for(let k=1;k<=10;k++)a.push([0,k*U]);return a})();
  function rebuildTiming(){const step=0.09,sweep=0.5;return{step,sweep,total:0.26+REBUILD_CIRCLES.length*step+sweep}}
  function drawRebuild(){
    if(!rebuildAnim)return 1;
    const t=(Date.now()-rebuildAnim.t0)/1000;
    const {step,sweep,total}=rebuildTiming();
    if(t>total+1.4){rebuildAnim=null;return 1}
    ctx.save();
    ctx.strokeStyle='rgba(84,106,128,0.55)';ctx.lineWidth=1;
    const fade=t>total+0.32?clamp(1-(t-total-0.32)/1,0,1):1;
    ctx.globalAlpha=fade;
    REBUILD_CIRCLES.forEach(([wx,wy],i)=>{
      const frac=clamp((t-0.26-i*step)/sweep,0,1);
      if(frac<=0)return;
      const s=plane.worldToScreen(wx,wy);
      ctx.beginPath();ctx.arc(s.x,s.y,U*plane.zoom(),-Math.PI/2,-Math.PI/2+frac*2*Math.PI);ctx.stroke();
    });
    ctx.restore();
    return t>total?clamp((t-total)/0.9,0,1):0;   // pane alpha
  }

  function drawPixelFloorReadout(){
    const v=1/(plane.zoom()*plane.unitLength());
    const sig=x=>parseFloat(x.toPrecision(1));
    let n,txt;
    if(v>=1){n=sig(v);txt='about '+n+(n===1?' unit':' units')}
    else if(v>=0.1){n=sig(v*10);txt='about '+n+(n===1?' tenth':' tenths')+' of a unit'}
    else if(v>=0.01){n=sig(v*100);txt='about '+n+(n===1?' hundredth':' hundredths')+' of a unit'}
    else if(v>=0.001){n=sig(v*1000);txt='about '+n+(n===1?' thousandth':' thousandths')+' of a unit'}
    else{n=sig(v*1e6);txt='about '+n+(n===1?' millionth':' millionths')+' of a unit'}
    ctx.save();
    ctx.font='10px Georgia, serif';ctx.fillStyle='#546A80';ctx.globalAlpha=0.45;
    ctx.textAlign='right';ctx.textBaseline='bottom';
    ctx.fillText('one pixel is '+txt,plane.viewportWidth()-10,plane.viewportHeight()-8);
    ctx.restore();
  }

  function render(){
    const W=plane.viewportWidth(),H=plane.viewportHeight();
    ctx.fillStyle='#f4f1e8';ctx.fillRect(0,0,W,H);
    if(numbersMode==='map')plane.drawLattice(ctx);
    if(axesVisible)drawAxes();

    const paneAlpha=drawRebuild();
    if(paneAlpha>0){
      ctx.save();
      ctx.globalAlpha=paneAlpha;
      const vb=visibleBounds();
      const sel=selecting();
      // In Multiply the axis numbers stand unshaded on the drawn lattice —
      // no table-style backgrounds behind the edge panes; first paint is the
      // lattice used everywhere else. The Build tools that ask for a row or
      // column keep their shaded hint.
      const shade=sel&&mode!=='multiply';
      const cellCount=(vb.cMax-vb.cMin+1)*(vb.rMax-vb.rMin+1);
      if(cellCount<25000){
        for(let c=vb.cMin;c<=vb.cMax;c++)for(let r=vb.rMin;r<=vb.rMax;r++){
          const n=viewing.name(c,r);
          if(built.has(n)){drawPane(c,r,n);continue}
          if(shade&&(c===1||r===1)){
            const rect=paneScreenRect(c,r);
            ctx.fillStyle='rgba(141,122,84,0.13)';
            ctx.fillRect(rect.x,rect.y,rect.w,rect.h);
            ctx.strokeStyle=FRAME_CAME;ctx.lineWidth=1;ctx.globalAlpha=paneAlpha*0.35;
            ctx.strokeRect(rect.x,rect.y,rect.w,rect.h);
            ctx.globalAlpha=paneAlpha;
          }
        }
        const now=Date.now();
        for(let c=vb.cMin;c<=vb.cMax;c++)for(let r=vb.rMin;r<=vb.rMax;r++){
          const n=viewing.name(c,r);
          const show=showNumerals||(revealedNums.get(n)||0)>now||(sel&&(c===1||r===1));
          if(show)drawNumeral(c,r,n);
        }
      }
      ctx.restore();
    }

    // The tile world sits over the panes: pieces are what the number is made
    // of, and the panes are still underneath, untouched.
    drawMultiply();drawDivide();drawSquare();
    drawRects();
    drawCursor();
    drawReadouts();
    if(numbersMode==='map')drawPixelFloorReadout();
  }
  function animate(){
    multiplyAdvance();divideAdvance();squareAdvance();
    render();syncSaveWord();requestAnimationFrame(animate);
  }

  // ==== virtual cursor (keyboard access) =====================================
  // The panes were buttons with aria-labels; on canvas that disappears, so the
  // canvas is the one tabbable element and a pane cursor takes over: arrows
  // move, Enter reveals, the aria-live readout announces. The cursor pans the
  // view when it walks off the visible window.
  let cursor=null;   // {c,r} or null
  // The outline is the keyboard affordance only. A tap still moves the
  // cursor's position (so the arrows resume from the tapped pane) but must
  // not leave a heavy outline behind — the lit palette is the one visual
  // language for "this one" (the port's rule; Review Lane 1).
  let cursorFromKeys=false;
  function drawCursor(){
    if(cursor===null||!cursorFromKeys||document.activeElement!==canvas)return;
    const rect=paneScreenRect(cursor.c,cursor.r);
    ctx.save();
    ctx.strokeStyle='#546a80';ctx.lineWidth=3;
    ctx.strokeRect(rect.x+1.5,rect.y+1.5,rect.w-3,rect.h-3);
    ctx.restore();
  }
  function announceCursor(){
    const n=viewing.name(cursor.c,cursor.r);
    readout.textContent=`${cursor.r} times ${cursor.c} equals ${n}`+(built.has(n)?'':' — not yet on the glass');
  }
  function keepCursorInView(){
    const vb=visibleBounds();
    let dx=0,dy=0;
    if(cursor.c<vb.cMin)dx=(cursor.c-vb.cMin)*U;
    if(cursor.c>vb.cMax-1)dx=(cursor.c-(vb.cMax-1))*U;
    if(cursor.r<vb.rMin)dy=(cursor.r-vb.rMin)*U;
    if(cursor.r>vb.rMax-1)dy=(cursor.r-(vb.rMax-1))*U;
    if(dx||dy){const p=plane.pan();plane.setPan(p.x+dx,p.y+dy)}
  }
  // One dispatch for a tap on a pane, whether it came from a finger or from
  // the arrow keys. The gesture and the place it starts decide what happens.
  function tapPane(c,r){
    toolBegun(mode);
    if(mode==='multiply'){
      if(c===1||r===1)tapAxis(axisOf(c,r),axisOf(c,r)==='x'?c:r);
      // The tap-a-number branch is undesigned (Multiply spec, Open). Nothing
      // is invented here: the making gesture starts on the axis.
      else say('Start from a pane along the bottom or up the left side.');
      return;
    }
    if(mode==='divide'){
      if(divide&&divide.phase==='sweep')divideSet(c);
      else divideStart(c,r);
      return;
    }
    if(mode==='square'){squareStart(c,r);return}
    if(mode==='explore'){explore(c,r);return}
    if(mode==='build'){buildTap(c,r);return}
    cancelSequence();revealNumber(viewing.name(c,r));
  }
  function activateCursor(){tapPane(cursor.c,cursor.r)}
  canvas.addEventListener('keydown',ev=>{
    const moves={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,1],ArrowDown:[0,-1]};
    if(moves[ev.key]){
      ev.preventDefault();
      cursorFromKeys=true;viewSettled=true;
      if(cursor===null)cursor={c:1,r:1};
      else{cursor.c=Math.max(1,cursor.c+moves[ev.key][0]);cursor.r=Math.max(1,cursor.r+moves[ev.key][1])}
      keepCursorInView();announceCursor();
    } else if(ev.key==='Enter'||ev.key===' '){
      ev.preventDefault();
      cursorFromKeys=true;
      unlockAudio();
      if(cursor===null)cursor={c:1,r:1};
      activateCursor();
    }
  });
  canvas.addEventListener('focus',()=>{if(cursor===null)cursor={c:1,r:1}});

  // ==== pointer gestures =====================================================
  // A drag from an edge pane is the rectangle gesture, exactly as before; a
  // drag from anywhere else pans; wheel and pinch zoom through the plane's one
  // clamp. Taps dispatch per mode.
  let pointer=null;   // {sx, sy, pan, kind:'pan'|'rect', c, r, moved, col, rw}
  const activeTouches=new Map();
  let pinchBaseDist=null,pinchBaseZoom=null;
  function paneAt(sx,sy){
    const w=plane.screenToWorld(sx,sy);
    if(w.x<0||w.y<0)return null;
    return {c:Math.floor(w.x/U)+1,r:Math.floor(w.y/U)+1};
  }
  canvas.addEventListener('pointerdown',ev=>{
    ev.preventDefault();
    cursorFromKeys=false;viewSettled=true;
    unlockAudio();
    canvas.focus({preventScroll:true});   // preventDefault suppresses click-to-focus; restore it
    canvas.setPointerCapture(ev.pointerId);
    activeTouches.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
    if(activeTouches.size===2){
      const pts=[...activeTouches.values()];
      pinchBaseDist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
      pinchBaseZoom=plane.zoom();
      pointer=null;return;
    }
    if(activeTouches.size>2)return;
    const box=canvas.getBoundingClientRect();
    const sx=ev.clientX-box.left,sy=ev.clientY-box.top;
    const pane=paneAt(sx,sy);
    const isEdge=pane&&(pane.c===1||pane.r===1);
    let kind='pan';
    if(mode==='multiply'&&isEdge)kind='rect';
    else if(mode==='divide'&&divide&&divide.phase==='sweep')kind='bar';
    pointer={sx,sy,pan:plane.pan(),moved:false,kind,
             c:pane?pane.c:null,r:pane?pane.r:null,
             axis:pane?axisOf(pane.c,pane.r):'x',col:null,rw:null};
    if(kind==='rect')pointer.bar=pointer.axis==='x'?pointer.c:pointer.r;
    if(kind==='bar'){divide.bar=barWidthAt(sx);setLive(`${divide.n}/${divide.bar}`,sx,sy,'left')}
  });
  canvas.addEventListener('pointermove',ev=>{
    if(activeTouches.has(ev.pointerId))activeTouches.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
    if(activeTouches.size===2&&pinchBaseDist){
      const pts=[...activeTouches.values()];
      plane.setZoom(pinchBaseZoom*(Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)/pinchBaseDist));
      return;
    }
    const box0=canvas.getBoundingClientRect();
    // On a mouse the bar follows the cursor; on touch the drag is the hover,
    // and this branch never fires because a finger is always down.
    if(!pointer&&mode==='divide'&&divide&&divide.phase==='sweep'){
      const hx=ev.clientX-box0.left,hy=ev.clientY-box0.top;
      divide.bar=barWidthAt(hx);
      setMapText(`${divide.n}/${divide.bar}`);
      setLive(`${divide.n}/${divide.bar}`,hx,hy,'left');
      return;
    }
    if(!pointer)return;
    const box=box0;
    const sx=ev.clientX-box.left,sy=ev.clientY-box.top;
    if(pointer.kind==='bar'){
      divide.bar=barWidthAt(sx);
      setMapText(`${divide.n}/${divide.bar}`);
      setLive(`${divide.n}/${divide.bar}`,sx,sy,sx>=pointer.sx?'left':'right');
      pointer.moved=true;
      return;
    }
    if(!pointer.moved&&Math.hypot(sx-pointer.sx,sy-pointer.sy)<9)return;
    if(!pointer.moved){pointer.moved=true;if(pointer.kind==='rect'){cancelSequence();clearFx();toolBegun(mode)}}
    if(pointer.kind==='rect'){
      // One continuous stroke. While the finger is still on the axis it
      // started from, the bar follows it and the display reads the width
      // alone — there is nothing to multiply by yet. Once she moves into the
      // field, that number stands and the second one is live.
      const w=plane.screenToWorld(sx,sy),vb=visibleBounds();
      const col=clamp(Math.ceil(w.x/U),1,vb.cMax), rw=clamp(Math.ceil(w.y/U),1,vb.rMax);
      const onAxis=pointer.axis==='x'?(rw<=1):(col<=1);
      const side=sx>=pointer.sx?'left':'right';
      if(onAxis){
        pointer.bar=pointer.axis==='x'?col:rw;
        pointer.col=pointer.rw=null;
        rects=[];multiply=null;
        dragBar={axis:pointer.axis,v:pointer.bar};
        setMapText(String(pointer.bar));setLive(String(pointer.bar),sx,sy,side);
      } else {
        if(pointer.bar==null)pointer.bar=pointer.axis==='x'?pointer.c:pointer.r;
        pointer.col=pointer.axis==='x'?pointer.bar:col;
        pointer.rw =pointer.axis==='x'?rw:pointer.bar;
        dragBar=null;
        rects=[];frame(pointer.col,pointer.rw,Infinity);   // anchored at the origin — area is the product
        const label=`${pointer.col} × ${pointer.rw}`;
        setProduct(pointer.col*pointer.rw,factorize(pointer.col*pointer.rw));
        setMapText(label);setLive(label,sx,sy,side);
      }
    } else {
      // y is up: dragging down carries the pan point up in world terms
      plane.setPan(pointer.pan.x-(sx-pointer.sx)/plane.zoom(),
                   pointer.pan.y+(sy-pointer.sy)/plane.zoom());
    }
  });
  function pointerEnd(ev){
    activeTouches.delete(ev.pointerId);
    if(pinchBaseDist&&activeTouches.size<2){pinchBaseDist=null;pinchBaseZoom=null;return}
    const p=pointer;pointer=null;if(!p)return;
    setLive(null);dragBar=null;
    if(p.kind==='bar'){
      toolBegun(mode);
      divideSet(divide?divide.bar:0);
      return;
    }
    if(p.kind==='rect'){
      rects=[];
      // A stray release snaps to the nearest legal spot rather than
      // cancelling: fluent users make fewer mistakes, so cancelling would put
      // the cost on beginners.
      if(p.col&&p.rw){pending=null;multiplyBuild(p.col,p.rw)}
      else if(p.bar!=null&&p.moved){pending=null;tapAxis(p.axis,p.bar)}
      else if(p.c!=null){cursor={c:p.c,r:p.r};tapPane(p.c,p.r)}
      return;
    }
    if(!p.moved&&p.c!=null&&p.c>=1&&p.r>=1){
      cursor={c:p.c,r:p.r};
      tapPane(p.c,p.r);
    }
  }
  canvas.addEventListener('pointerup',pointerEnd);
  canvas.addEventListener('pointercancel',pointerEnd);
  canvas.addEventListener('wheel',ev=>{
    ev.preventDefault();
    viewSettled=true;
    plane.setZoom(plane.zoom()*(ev.deltaY>0?0.9:1.1));
  },{passive:false});
  canvas.addEventListener('contextmenu',ev=>ev.preventDefault());

  // ==== controls =============================================================
  root.querySelectorAll('[data-prime]').forEach(button=>button.addEventListener('click',async()=>{
    unlockAudio();
    const p=+button.dataset.prime,e=createAudio();if(!e)return;await e.ctx.resume();
    cancelSequence();clearFx();
    // The unity chip is where every build starts, and the way back to it.
    if(p===1){resetComposition();setProduct();revealNumber(1,{message:'Back to 1. Every number starts here.'});return}
    if(mode==='build'&&buildTool==='primes'){addPrime(p);return}
    // The prime lights wherever it appears — set membership is a reason to be
    // lit, the same language as selection.
    const vb=visibleBounds();
    let count=0;
    for(let c=vb.cMin;c<=vb.cMax;c++)for(let r=vb.rMin;r<=vb.rMax;r++){
      const n=viewing.name(c,r);
      if(!built.has(n))continue;
      factorize(n).forEach((q,i)=>{if(q===p){litPieces.set(`${c},${r},${i}`,Date.now()+1800);count++}});
    }
    pianoNote(notesFor([p])[0],e.ctx.currentTime+.03,4,.36);
    readout.textContent=`Prime ${p} · ${primeInfo[p].note} · lit wherever it appears.`;
  }));
  buildSubButtons.forEach(b=>b.addEventListener('click',()=>setBuildTool(b.dataset.build)));
  propertyButtons.forEach(b=>b.addEventListener('click',()=>revealProperty(b.dataset.property)));
  numbersButton.addEventListener('click',()=>{showNumerals=!showNumerals;syncNumbersWord()});
  fillButton.addEventListener('click',()=>fillTable());
  fillContinueButton.addEventListener('click',()=>fillTable());
  clearButton.addEventListener('click',()=>{clearToolWork();clearTable();say(toolPrompt())});

  // The viewing strip — the Numbers control's permanent home.
  const numbersWord=document.getElementById('numbers-cycle');
  const tieWord=document.getElementById('lattice-tie');
  const axesWord=document.getElementById('axes-toggle');
  function updateViewingStrip(){
    // One destination-named pair, the same grammar as Geometry (controls
    // build, 13 Aug — ledger §10). The tie stays: here it is honest,
    // resolution is the subject (§11).
    numbersWord.textContent=numbersMode==='map'?'Hide map':'Show map';
    tieWord.hidden=numbersMode!=='map';
    tieWord.textContent=plane.latticeTied()?'grid follows zoom':'grid keeps its step';
    axesWord.innerHTML='axes &middot; '+(axesVisible?'shown':'hidden');
  }
  numbersWord.addEventListener('click',()=>{numbersMode=viewing.numbersCycle[numbersMode]||viewing.numbersDefault;updateViewingStrip()});
  tieWord.addEventListener('click',()=>{plane.setLatticeTied(!plane.latticeTied());updateViewingStrip()});
  axesWord.addEventListener('click',()=>{axesVisible=!axesVisible;updateViewingStrip()});
  updateViewingStrip();

  // ==== Save (controls build, 13 Aug) ========================================
  // The Save word opens the choice panel (ledger §§2, 12, 14): Postcard is
  // the sent picture and IS the share action; Full sheet is the kept picture,
  // the 300dpi print render. There is no Share word. "Save construction" —
  // the record — is NOT here: this lab keeps no operation log and has no
  // open path (Phase 4's explicit no-persistence choice), so the record has
  // nothing to record yet; reported at review rather than faked.
  const savePanel=CW.createChoicePanel();
  const saveWord=root.querySelector('#save-map');

  // PNG pHYs patcher and its CRC, as in Geometry — single-file pages carry
  // their own copies by design; only plane.js and cw-panel.js are shared.
  let _crc32Table=null;
  function crc32(data){
    if(!_crc32Table){
      _crc32Table=new Uint32Array(256);
      for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);_crc32Table[n]=c}
    }
    let crc=0xFFFFFFFF;
    for(let i=0;i<data.length;i++)crc=_crc32Table[(crc^data[i])&0xFF]^(crc>>>8);
    return (crc^0xFFFFFFFF)>>>0;
  }
  function patchPngDpi(blob,dpi,callback){
    const ppm=Math.round(dpi/0.0254);
    const reader=new FileReader();
    reader.onload=function(){
      const buf=new Uint8Array(reader.result);
      let pos=8;
      while(pos<buf.length){
        const len=(buf[pos]<<24)|(buf[pos+1]<<16)|(buf[pos+2]<<8)|buf[pos+3];
        const type=String.fromCharCode(buf[pos+4],buf[pos+5],buf[pos+6],buf[pos+7]);
        if(type==='IDAT'){
          const phys=new Uint8Array(21);
          phys[0]=0;phys[1]=0;phys[2]=0;phys[3]=9;
          phys[4]=0x70;phys[5]=0x48;phys[6]=0x59;phys[7]=0x73;
          phys[8]=(ppm>>24)&0xff;phys[9]=(ppm>>16)&0xff;phys[10]=(ppm>>8)&0xff;phys[11]=ppm&0xff;
          phys[12]=(ppm>>24)&0xff;phys[13]=(ppm>>16)&0xff;phys[14]=(ppm>>8)&0xff;phys[15]=ppm&0xff;
          phys[16]=1;
          const crc=crc32(phys.subarray(4,17));
          phys[17]=(crc>>24)&0xff;phys[18]=(crc>>16)&0xff;phys[19]=(crc>>8)&0xff;phys[20]=crc&0xff;
          const result=new Uint8Array(buf.length+21);
          result.set(buf.subarray(0,pos),0);result.set(phys,pos);result.set(buf.subarray(pos),pos+21);
          callback(new Blob([result],{type:'image/png'}));return;
        }
        pos+=12+len;
      }
      callback(blob);
    };
    reader.readAsArrayBuffer(blob);
  }

  // The export is a picture of the window: the live canvas (the map as she
  // sees it, membrane region cropped) matted like Geometry's postcard.
  function composeMapExport(spec){
    const dpr=window.devicePixelRatio||1;
    const cropX=membraneWide.matches?Math.round(MEMBRANE_W*dpr):0;
    const sw=canvas.width-cropX, sh=canvas.height;
    const off=document.createElement('canvas');off.width=spec.w;off.height=spec.h;
    const c2=off.getContext('2d');
    c2.fillStyle='#2a2620';c2.fillRect(0,0,spec.w,spec.h);
    c2.strokeStyle='#c8b89a';c2.lineWidth=2;
    c2.strokeRect(spec.mat-1,spec.mat-1,spec.w-2*spec.mat+2,spec.h-2*spec.mat+2);
    c2.fillStyle='#f4f1e8';c2.fillRect(spec.mat,spec.mat,spec.w-2*spec.mat,spec.h-2*spec.mat);
    const artW=spec.w-2*spec.mat,artH=spec.h-2*spec.mat;
    const s=Math.min(artW/Math.max(1,sw),artH/Math.max(1,sh)),dw=sw*s,dh=sh*s;
    c2.imageSmoothingEnabled=true;c2.imageSmoothingQuality='high';
    c2.drawImage(canvas,cropX,0,sw,sh,spec.mat+(artW-dw)/2,spec.mat+(artH-dh)/2,dw,dh);
    return off;
  }
  function exportMap(kind){
    const spec=kind==='postcard'
      ?{w:1200,h:800,mat:40,dpi:null}      // the sent version: screen-sized, retina-doubled
      :{w:3000,h:2400,mat:60,dpi:300};     // the kept version: the 300dpi print render
    const off=composeMapExport(spec);
    const filename='glass-multiplication-'+new Date().toISOString().slice(0,10)+'.png';
    const download=blob=>{
      const u=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=u;a.download=filename;a.click();
      URL.revokeObjectURL(u);
    };
    if(kind==='postcard'){
      // Synchronous render and blob so the share sheet opens inside the
      // child's tap (Safari requires the gesture to still be live).
      const bin=atob(off.toDataURL('image/png').split(',')[1]);
      const bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      const blob=new Blob([bytes],{type:'image/png'});
      let file=null;try{file=new File([blob],filename,{type:'image/png'})}catch(e){}
      if(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({title:'Glass Multiplication',files:[file]}).catch(err=>{
          if(!err||err.name!=='AbortError')download(blob);  // declined ≠ cancelled
        });
      }else{
        download(blob);
        readout.textContent='Sharing not available on this browser — image downloaded instead';
      }
    }else{
      off.toBlob(blob=>patchPngDpi(blob,spec.dpi,download),'image/png');
    }
  }
  saveWord.addEventListener('click',()=>{
    savePanel.open({choices:[
      {word:'Postcard',line:'a picture to send',action:()=>exportMap('postcard')},
      {word:'Full sheet',line:'a picture to keep',action:()=>exportMap('fullsheet')}
    ]});
  });
  // Present only when there is something on the glass beyond 1; fades in
  // and out, and once faded releases its place in the row.
  let saveWordPresent=false;
  function syncSaveWord(){
    const on=built.size>1;
    if(on===saveWordPresent)return;
    saveWordPresent=on;
    if(on){
      if(saveWord.style.display==='none'){saveWord.style.display='';requestAnimationFrame(()=>saveWord.classList.remove('absent'))}
      else saveWord.classList.remove('absent');
    }else{
      saveWord.classList.add('absent');
      setTimeout(()=>{if(saveWord.classList.contains('absent'))saveWord.style.display='none'},420);
    }
  }

  document.getElementById('rebuild').addEventListener('click',()=>{
    if(reduceMotion)return;
    rebuildAnim={t0:Date.now()};
  });

  setTool('multiply');
  syncNumbersWord();
  animate();
})();
</script>
</body>
