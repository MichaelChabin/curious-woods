<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="art/star-icon-256.png">
<link rel="apple-touch-icon" href="art/star-icon-256.png">
<title>The Curious Woods</title>
<style>
  /* The gallery (20 Sept 2026; Spec-Gallery.md; built from experiments/gallery/home-mock-salon.html).
     Works hang as paintings in a show: a coloured frame that suits each picture, a thin mat,
     the title centred below in one type. Sizes vary as paintings do. The wall is rehung every
     visit. Below a hairline: Practice centred; Saved Stories, Labs and Experiments at the right. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #f4f1e8; font-family: Georgia, serif; color: #3D3D3A; }
  body { min-height: 100vh; padding: 40px 48px 56px; }

  h1 { font-size: 22px; font-weight: normal; letter-spacing: 0.04em; color: #546A80; text-align: center; margin-bottom: 36px; }

  /* The wall: four columns on a wide screen, two on a phone; works flow down each like
     pictures on a salon wall. The script deals the works into the columns in hang order
     (CSS multi-column balancing left a column empty when the pool was small), and the wall
     narrows to the columns it has, so a small pool still hangs centred. Each work has its own
     width, so sizes vary; nothing overlaps. */
  .wall { display: flex; justify-content: center; gap: 34px; max-width: 1180px; margin: 0 auto; }
  .wall .col { flex: 1 1 0; min-width: 0; max-width: 270px; }
  .work { display: block; width: 100%; margin: 0 0 40px; text-decoration: none; color: inherit; }
  .work.medium { width: 80%; margin-left: 10%; }
  .work.small  { width: 56%; margin-left: 22%; }
  .work:hover .frame { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(60,50,30,0.22); }

  /* Frame: a coloured border that suits the picture; then a mat; then the picture. */
  .frame {
    --f: #6b5a45;            /* frame colour, per work */
    --mat: #f9f6ee;          /* mat colour: off-white, or the wall for a drawn mark */
    --fw: 10px;              /* frame width, per work; varies for looks, not meaning */
    border: var(--fw) solid var(--f);
    padding: 8px;            /* the mat */
    background: var(--mat);
    box-shadow: 0 6px 14px rgba(60,50,30,0.16), inset 0 0 0 1px rgba(0,0,0,0.08);
    transition: transform 120ms ease, box-shadow 120ms ease;
    line-height: 0;
  }
  .frame img, .frame svg { display: block; width: 100%; height: auto; }
  .frame.small { padding: 6px; }

  .title { margin-top: 10px; font-size: 15px; line-height: 1.3; text-align: center; color: #3D3D3A; }

  /* Below the wall: Practice centred; Saved Stories, Labs, Experiments at the right. */
  .fixed {
    max-width: 1180px; margin: 8px auto 0;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: end;
    padding-top: 12px; border-top: 1px solid #e6dfcf;
  }
  .fixed .centre { grid-column: 2; }
  .fixed .right { grid-column: 3; display: flex; justify-content: flex-end; gap: 36px; }
  .plaque { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: inherit; padding-top: 22px; }
  .plaque .label { font-size: 14px; color: #546A80; letter-spacing: 0.03em; margin-top: 8px; }
  .plaque:hover .label { color: #3D3D3A; }
  .plaque .card {
    width: 86px; height: 58px; border: 1px solid #c8b89a; background: #faf7f0;
    display: flex; align-items: center; justify-content: center; font-size: 13px; color: #a09880; letter-spacing: 0.06em;
  }
  .practice .frame { width: 140px; --f: #b87333; --mat: #f4f1e8; --fw: 12px; }
  .practice .label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  footer { text-align: center; margin-top: 40px; font-size: 11px; color: #c8b89a; letter-spacing: 0.06em; }

  @media (max-width: 900px) {
    body { padding: 28px 20px 40px; }
    .wall { gap: 24px; }
    .fixed { grid-template-columns: 1fr; } .fixed .centre, .fixed .right { grid-column: 1; justify-content: center; }
  }
</style>
</head>
<body>

<h1>The Curious Woods</h1>

<div class="wall" id="wall"></div>

<div class="fixed">
  <a class="plaque practice centre" href="experiments/trace.html">
    <div class="frame">
      <!-- ensō: one brushed circle, open at the end, in copper. The mark is the name. -->
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <rect width="100" height="100" fill="#f4f1e8"/>
        <path d="M 62 18 A 34 34 0 1 0 74 32" fill="none" stroke="#b87333" stroke-width="7" stroke-linecap="round" opacity="0.92"/>
        <path d="M 62 18 A 34 34 0 1 0 74 32" fill="none" stroke="#b87333" stroke-width="3" stroke-linecap="round" opacity="0.5" transform="translate(1,1)"/>
      </svg>
    </div>
    <div class="label">Practice</div>
  </a>
  <div class="right">
    <a class="plaque" href="saved.html"><div class="card">&#9633;</div><div class="label">Saved Stories</div></a>
    <a class="plaque" href="labs.html"><div class="card">LABS</div><div class="label">Labs</div></a>
    <a class="plaque" href="experiments/index.html"><div class="card">· · ·</div><div class="label">Experiments</div></a>
  </div>
</div>

<footer>curious woods</footer>

<script>
var CW_VERSION = '2026-09-20 1bfbea6'; try { console.log('Curious Woods · ' + document.title + ' · ' + CW_VERSION); } catch (e) {}

// The wall reads stories/gallery.json — one line per work: slug, title, href, icon, frame,
// frameWidth, size. Adding a story to the gallery is adding its line there (Publishing-a-Story,
// stage 4). Nothing here knows the works by name.
(function () {
  var WALL_SIZE = 9;                        // about nine works at a time on a wide screen
  var FINISHED = 'cw.gallery.finished';     // slugs whose story text she reached the end of (the story page writes it)
  var KEPT = 'cw.gallery.kept';             // slugs she chose "keep this" for (a later step; nothing writes it yet)

  function readList(key) {
    try { var v = JSON.parse(localStorage.getItem(key) || '[]'); return Array.isArray(v) ? v : []; }
    catch (e) { return []; }
  }
  function shuffle(a) {                     // Fisher–Yates; a new hang every visit
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  // A finished story comes down unless she kept it. Everything else is the pool; the wall
  // takes up to WALL_SIZE of it, shuffled. Nothing is written back: the gallery keeps no record.
  function choose(works) {
    var finished = readList(FINISHED), kept = readList(KEPT);
    var pool = works.filter(function (w) { return kept.indexOf(w.slug) >= 0 || finished.indexOf(w.slug) < 0; });
    return shuffle(pool).slice(0, WALL_SIZE);
  }

  function columnCount(n) {
    var wide = window.matchMedia('(min-width: 901px)').matches;
    return Math.max(1, Math.min(wide ? 4 : 2, n));
  }

  var hung = [];                            // this visit's hang, in order; re-dealt on resize
  function hang(works) {
    hung = works;
    var wall = document.getElementById('wall');
    while (wall.firstChild) wall.removeChild(wall.firstChild);
    var cols = [], n = columnCount(works.length);
    for (var i = 0; i < n; i++) { var c = document.createElement('div'); c.className = 'col'; cols.push(c); wall.appendChild(c); }
    works.forEach(function (w, i) {
      var size = (w.size === 'small' || w.size === 'medium') ? w.size : 'large';
      var a = document.createElement('a');
      a.className = 'work ' + size;
      a.href = w.href;
      var frame = document.createElement('div');
      frame.className = 'frame' + (size === 'small' ? ' small' : '');
      frame.style.setProperty('--f', w.frame || '#6b5a45');
      if (w.frameWidth) frame.style.setProperty('--fw', w.frameWidth + 'px');
      if (/\.svg$/i.test(w.icon || '')) frame.style.setProperty('--mat', '#f4f1e8');   // a drawn mark sits on the wall colour
      var img = document.createElement('img');
      img.src = w.icon; img.alt = '';
      frame.appendChild(img);
      var title = document.createElement('div');
      title.className = 'title'; title.textContent = w.title;
      a.appendChild(frame); a.appendChild(title);
      cols[i % n].appendChild(a);
    });
  }
  var lastCols = 0;
  window.addEventListener('resize', function () {
    if (!hung.length) return;
    var n = columnCount(hung.length);
    if (n !== lastCols) { lastCols = n; hang(hung); }
  });

  fetch('stories/gallery.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (works) { var h = choose(works); lastCols = columnCount(h.length); hang(h); })
    .catch(function (e) { try { console.warn('gallery.json did not load', e); } catch (x) {} });
})();
</script>
</body>
</html>
