<style>
  :root { color-scheme: light; }
  html, body { margin: 0; }
  body {
    background: var(--cw-parchment, #f4f1e8); color: var(--cw-ink, #2a241c);
    font-family: var(--cw-font, Georgia, serif); font-size: 17px; line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: 28px; padding-bottom: 48px;
  }
  .wide { max-width: 1180px; margin: 0 auto; }
  h1 { font-weight: normal; font-size: 1.5rem; line-height: 1.2; margin: 0 0 10px; letter-spacing: 0.01em; text-wrap: balance; }
  /* the left column, the house convention: How this works, bulleted words in normal type, italic commands under them */
  .bench { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 18px 24px; align-items: start; position: relative; }
  /* Select years (step 5): out of the column's top, to the left of the mosaic, centred on its height (the script sets top);
     the credit, the column's foot, comes down with it (on the short mosaics a Select years centred there met the credit
     where it stood, under Information) */

  .select-years { margin: 0; }
  .left { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .word {
    background: none; border: 0; padding: 2px 0; color: var(--cw-payne, #546A80); font: inherit; cursor: pointer;
    border-bottom: 1px solid transparent; text-align: left; transition: opacity 300ms ease-in-out;
  }
  .word:hover { color: var(--cw-payne-hover, #3D3D3A); }
  .word:focus-visible { outline: 2px solid var(--cw-copper, #b5652b); outline-offset: 3px; }
  .word.absent { opacity: 0; pointer-events: none; }
  .word[aria-pressed="true"] { color: var(--cw-ink, #2a241c); border-bottom-color: var(--cw-copper, #b5652b); }
  .items { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .items li { position: relative; padding-left: 14px; font-size: 15px; }
  .items li::before { content: '\2022'; position: absolute; left: 0; color: var(--cw-payne, #546A80); }
  .items .head { display: block; color: var(--cw-ink, #2a241c); }
  .items .subs { display: flex; flex-direction: column; gap: 1px; align-items: flex-start; padding-left: 12px; margin-top: 3px; }
  .items .word { font-size: 15px; border-bottom: 0; }
  .cmd { font-style: italic; }
  .cmd[aria-pressed="true"] { color: var(--cw-copper, #b5652b); border-bottom-color: transparent; }   /* the scale in use, the Earth in use: copper */
  /* the credit at the column's foot (step 3), small, as a story page's references are set */
  .credit { margin: 10px 0 0; font-size: 12px; line-height: 1.4; min-height: 7em; color: var(--cw-ink-soft, #6b655a); max-width: 160px; }   /* room for the longer credit, so the column's foot keeps its height as the credit changes */
  /* the main column, one column: the Earth, the text block, the reminder line, the mosaic centred on the same axis (its
     years hanging outside it to the right), the timeline. Every row has its place from the start; nothing moves */
  .main { display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; min-width: 0; }
  /* the Earth (step 1 of the lab): the stage as wide as the column, about a third of the screen tall (the script sets it),
     the ball centred and filling the height; under it nothing but the text block */
  .earth { grid-row: 1; margin: 0 0 10px; }
  .stage { position: relative; width: 100%; height: 256px; overflow: hidden; touch-action: none; background: var(--cw-parchment, #f4f1e8); }
  .stage.placing { cursor: crosshair; }   /* Place markers: a tap sets one */
  /* the text block (step 4): one block of fixed height directly under the Earth. Line one the thing she touched last —
     a period's name, span and length; an event's label and date; at rest the scale in use (the year is on the handle).
     Under it two columns of the house text, six lines each, of fixed height, each cut with an ellipsis and never growing:
     the period's box words on the left, the event's summary ending in More on the right; empty, not collapsed, until
     there is something to show; stacked at iPad width (under 800 px) */
  .knowing { margin: 6px auto 0; max-width: 680px; }
  .line-one { margin: 0; font-size: 17px; line-height: 1.5; height: 1.5em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; color: var(--cw-ink, #2a241c); font-variant-numeric: tabular-nums; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; margin-top: 2px; }
  .col { margin: 0; font-size: 15px; line-height: 1.45; height: 8.7em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; color: var(--cw-ink, #2a241c); }
  .col.ph { color: var(--cw-grey-word, #7d7a72); }   /* placeholder words (the last million's periods), in grey */
  .col b { font-weight: bold; }
  .col.tap { cursor: pointer; }   /* an event's summary: the whole of it opens the More, so a summary cut short still can */
  .col .more-word { font-style: italic; color: var(--cw-payne, #546A80); cursor: pointer; user-select: none; -webkit-user-select: none; }
  .col .more-word:hover { color: var(--cw-payne-hover, #3D3D3A); }
  @media (max-width: 799px) { .cols { grid-template-columns: 1fr; } }
  #still { display: none; margin: 0 auto; }
  #still img { display: block; height: 100%; width: auto; margin: 0 auto; }
  #still .under { margin: 6px 0 0; font-size: 13px; font-style: italic; color: var(--cw-ink-soft, #6b655a); text-align: center; }
  /* the reminder line above each mosaic (step 3): the labels' size, tight to the mosaic */
  .explain { grid-row: 2; margin: 0 0 3px; font-size: 11px; line-height: 1.3; color: var(--cw-ink-soft, #6b655a); text-align: center; box-sizing: border-box; }
  /* nothing on the mosaic selects as text: a drag that starts in the came or runs past the glass must never start a
     selection, whose highlight would wash over the canvas and hide the colours (Michael, 1 Nov) */
  .glass-box { grid-row: 3; position: relative; min-width: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas.glass { display: block; width: 100%; cursor: crosshair; touch-action: none; }
  .cursor-label { position: absolute; z-index: 7; pointer-events: none; font-size: 12px; line-height: 1.3; color: var(--cw-ink, #2a241c);
                  background: rgba(244,241,232,0.94); border: 0.5px solid #c8b89a; border-radius: 4px; padding: 2px 7px; white-space: nowrap; display: none; }
  /* the timeline: the mosaic page's line (the Earth bench's age row, 6c, 6d, as 7c has it), its words to the right; there
     from the start (step 4), spanning the whole mosaic in use */
  .track-col { grid-row: 4; margin: 0; position: relative; }   /* tight under the mosaic: the flags' labels need 18 px and get no more */
  /* focus and back: to the right of the line, in the gutter the years hang in, placed from the timeline's own box (the
     script sets left), so a change of mosaic moves nothing else */
  .stretch-words { position: absolute; top: -2px; display: flex; flex-direction: row; gap: 12px; align-items: baseline; white-space: nowrap; }   /* step 5: side by side at the top right of the line, on the handle's row, clear of every event below the line */
  .stretch-words .word { font-size: 15px; line-height: 14px; font-style: italic; padding: 0; }
  .stretch-track { position: relative; height: 62px; touch-action: none; cursor: default; user-select: none; -webkit-user-select: none; }
  .stretch-line { position: absolute; left: 0; right: 0; top: 45px; height: 2px; background: var(--cw-grey, #9a958b); border-radius: 1px; }
  .span-line { position: absolute; top: 44.5px; height: 3px; background: var(--cw-copper, #b5652b); pointer-events: none; display: none; }
  .span-word { position: absolute; top: 15px; line-height: 14px; font-size: 12px; color: var(--cw-ink, #2a241c);
               white-space: nowrap; font-variant-numeric: tabular-nums; pointer-events: none; display: none; }   /* step 5: at the flags' labels' level, centred between the pennants; the line under it unbroken */
  .span-word.up { top: 1px; }   /* flags too close for it between the pennants: the handle's row, where the handle's year leaves room */
  .flag { position: absolute; top: 18px; width: 2px; height: 30px; margin-left: -1px; background: var(--cw-copper, #b5652b); cursor: ew-resize; }
  .flag::before { content: ""; position: absolute; top: 0; width: 13px; height: 9px; background: var(--cw-copper, #b5652b); opacity: .9; }
  .flag::after { content: ""; position: absolute; top: -8px; bottom: -8px; left: -11px; right: -11px; }   /* room for a finger */
  .flag.a::before { left: 2px; border-radius: 0 3px 3px 0; }
  .flag.b::before { right: 2px; border-radius: 3px 0 0 3px; }
  .flag-label { position: absolute; top: 15px; line-height: 14px; font-size: 12px; color: var(--cw-grey-word, #7d7a72); font-variant-numeric: tabular-nums; white-space: nowrap; pointer-events: none; display: none; }
  .flag-label.up { top: 1px; }   /* a pulled flag's year with no room outside it in the column: the row above */
  /* the handle's year (step 4), set as the flags' labels are, with the word of knowing after it in copper italic; it follows
     the handle live. Step 5: on the row above the flags' labels, so it never meets a flag, a pennant or the span */
  .handle-label { top: 1px; z-index: 2; }
  .handle-label .know { color: var(--cw-copper, #b5652b); font-style: italic; }
  /* the year handle: the Time Machine's marker (a copper dot, 6.5 px in radius, ringed in parchment) on the line, the
     lab's year; above the flags, so it can be taken hold of where a flag stands */
  .handle { position: absolute; top: 39.5px; width: 13px; height: 13px; margin-left: -6.5px; border-radius: 50%; background: var(--cw-copper, #b5652b);
            box-shadow: 0 0 0 2px var(--cw-parchment, #f4f1e8); z-index: 3; cursor: grab; }
  .handle::after { content: ""; position: absolute; left: -9px; right: -9px; top: -9px; bottom: -9px; }   /* room for a finger */
  /* the events under the line (the Time Machine's deep timeline, drawn here): a fixed box, four rows of labels at most */
  svg.events { display: block; width: 100%; height: 70px; margin-top: -15px; overflow: visible; position: relative; pointer-events: none; }   /* above the track, so a mark's stem takes the tap (found in step 4's check: the positioned track painted over the top 15 px, where every stem is); the empty glass lets taps through to the line */
  svg.events .mark { pointer-events: auto; }

  .stretch-under { display: flex; justify-content: center; gap: 12px; font-size: 12px; line-height: 18px; height: 18px; color: var(--cw-grey-word, #7d7a72); margin-top: 0; font-variant-numeric: tabular-nums; }   /* its height fixed, so the box under the line is the same size before and after the line appears */
  /* the More window's contents (the window itself is map.js's cwWindow), as the Time Machine styles them */

  .tm-more h3 { font-weight: normal; font-size: 21px; margin: 0 0 10px; line-height: 1.2; }

  .tm-more blockquote p { margin: 0 0 .35em; }
  .tm-more .known { font-size: 14px; color: var(--cw-ink-soft, #6b655a); }
  .tm-more .refs { font-size: 12px; line-height: 1.45; color: var(--cw-ink-soft, #6b655a); border-top: .5px solid var(--cw-rule, #c8b89a); margin-top: 16px; padding-top: 8px; }
  .tm-more .refs div { margin: 0 0 5px; }
  /* a picture in a More: deep-time.js's own rules, which it writes to a page only when a deep bar is built; this page

  .cw-pic img { display: block; width: 100%; height: auto; cursor: zoom-in; }

<script>

  const Q = new URLSearchParams(location.search);
  const THIS_YEAR = CW.THIS_YEAR, ICE_YEAR = -10000;   // the ice let go: year 0 after the ice is the store's −10000; this year is 12,026 after the ice
  const LINE_END = 4600;   // million years: the line's far end and the left flag's wall, the mosaic's first tile (the Sun lights at 4,567, where the Earth's own age stops)

  // ======== THE TABLE: sizes, colours, lines and words. A change is one line. (The mosaic page's, 7c, with the lab's rows added.) ========
  const LOOK = {
    came: '#949ca0',          // the silver came between blocks and round each row (the mockup's; the first build's was #b9c0c4)

    gapLine: 4,               // px between the lines of a row when a narrow layout wraps its blocks (18 where labels sit under the blocks)
    line: '#141416',          // the near-black lines between the small squares
    lineW: 1, lineWSmall: 0.6, smallBelow: 6,   // the lines' width; the thinner one under squares of fewer px than smallBelow
    gold: '#e2b33a',          // the square that holds now, filled
    gutter: 64, gutter12: 88,   // px the tiles are inset on each side, so the row is centred on the column (step 3); the years hang in the right one; the 12,000's holds the year and Electricity
    labelFont: '11px',        // the years on the right and under the blocks, and the reminder line above the mosaic (step 3: the labels' size)
    yearFont: '17px',         // the 12,000 row's year, to the right of the row, in the house text
    shadeL: 0.07, shadeS: 0.06,   // handmade glass: each square's lightness and saturation wander by this much
    gradient: 0.10,           // a gentle run of lightness along each period, darker at its old end

    warm: '#7fa86a',          // the last million: a warm spell
    iceDeep: '#7a9cad', icePale: '#e6eef1',   // the ice, graded: at the threshold, and the palest at the lowest sea (B, ruled 5 Nov)
    threshold: -20, seaLow: -130,   // metres: the sea at or above the threshold is a warm spell (−20 m shows all eleven interglacials; see the 7 report)
    glideMs: 380,

    pullRate: 60, pullRamp: 1,   // a flag held past the end: adds years at pullRate px a second of the line's scale, the rate growing by another pullRate every pullRamp seconds
    tapSlop: 3, tapSlopTouch: 8,  // px a press may wander and still be a tap, which selects the whole period; by finger, more
    labelEvents: 3,           // events named in the label under the cursor; a tile with more says how many
    // the lab's rows (step 1):
    earthSmall: 1 / 3, earthLarge: 1 / 2,   // the Earth's stage, as a share of the screen's height: small (the rule) and large (bench only)
    evLine: 12, evRow: 13, evRows: 4, evTick: 7, evThin: 3,   // the events under the line, as the deep timeline draws them: the line to the first label row, a row's height, rows at most, a short line's length, marks closer than this thinned
    handleReach: 14, flagReach: 16,        // px from the handle, and from a flag, a press still takes hold of it
    // step 5:
    calYears: 12000,          // years ago: inside this, a year is written as the calendar year (200 BCE, 1720); older, ka, Ma, Ba
    markerR: 4.5, markerRing: 1.5, markerTap: 12,   // a marker: the copper dot's radius, its parchment ring, px from it a tap deletes it
    coastW: 1.5, coastA: 0.6, markerFade: 20        // today's coastlines as the Earth draws them (its COAST_PX, COAST_A); the million years a marker or a coast fades over before its ground was born (the cities')
  };
  const WORDS = {
    scales: ['4.6 billion', 'Last million', 'Last 12,000'],
    explain: [
      'Each tile is a million years. Each large square is 100 million. Each row is a billion.',
      'Each tile is 1,000 years. Each large square is 100,000.',

    ],
    focus: 'focus', back: 'back',
    cities: ['Show cities', 'Hide cities'], coasts: ['Show coastlines', 'Hide coastlines'], markers: ['Place markers', 'Hide markers'],
    earth: ['Large Earth', 'Small Earth', 'Map'], reset: 'Reset',
    now: 'now', nowLabel: 'Now', notYet: 'not yet', more: 'More',
    scaleLines: ['The Solar System · 4,600 million years', 'The last million years', 'The last 12,000 years'],   // line one at rest: the scale in use (step 4)
    iceTile: 'ice age', warmTile: 'warm spell'   // the last million: what the tile under the cursor is, after its period's name
  };
  // The fourteen periods of the 4.6 billion mosaic (Worknote-Deep-Time-Window-03's thirteen, and Before the Sun from

  // the cursor shows (revision 4's first try, Michael's to change), the colour (revision 1's twelve as the mockup has

  // that can hold several texts per period, shown shuffled.
  const PERIODS = [
    { from: 0, to: 33, n: 'Before the Sun', c: '#3b3a40', t: ['A cloud of gas and dust, slowly gathering. The Sun has not yet lit up.'] },
    { from: 33, to: 200, n: 'Formation', c: '#b75027', t: ['The solar system comes together. Something the size of Mars hits the young Earth, and the Moon forms from the splash.'] },
    { from: 200, to: 700, n: 'First seas', c: '#1e3b47', t: ['Small, dark, volcanic continents under constant rain that fills the seas.'] },
    { from: 700, to: 2150, n: 'Early life', c: '#c39444', t: ['Microscopic life, perhaps under a hazy orange sky. The air has no oxygen.'] },
    { from: 2150, to: 2400, n: 'Early oxygen', c: '#8daec1', t: ['Bacteria begin to release oxygen. It probably destroyed the methane that kept the Earth warm, and ice spread almost to the equator.'] },
    { from: 2400, to: 2800, n: 'Rust', c: '#8f3321', t: ['Oxygen builds up and turns an ocean full of iron to rust.'] },
    { from: 2800, to: 3880, n: 'Two parents', c: '#2a5c8c', t: ['Some cells need two parents, others form colonies, while continents grow larger.'] },
    { from: 3880, to: 3965, n: 'Ice to the equator', c: '#c2dae5', t: ['Ice reaches the equator, twice. The first animals may date from these frozen years.'] },
    { from: 3965, to: 4061, n: 'Visible life', c: '#21848c', t: ['The first living things big enough to see.'] },
    { from: 4061, to: 4130, n: 'Eyes and shells', c: '#163d87', t: ['Animals with eyes and shells fill the seas.'] },
    { from: 4130, to: 4348, n: 'Life on land', c: '#2b763f', t: ['Plants and animals come to land.'] },
    { from: 4348, to: 4534, n: 'Dinosaurs', c: '#a6c24a', t: ['Dinosaurs rule the land, and one great continent slowly breaks apart.'] },
    { from: 4534, to: 4597, n: 'Mammals', c: '#cb7d22', t: ['After the asteroid, mammals spread everywhere, and grass covers the plains.'] },
    { from: 4597, to: 4600, n: 'Ice ages', c: '#dbe6ec', t: ['Ice sheets come and go. Everyone who has ever lived is in the last tile.'] }
  ];
  // The eight periods of the 12,000 row (Michael's rule, 4 Nov 2026): a period's name says what was common in that span,
  // not what was invented at its start, so the edges are round. The span in years ago (the first takes the row's start,
  // the last reaches now), the colour the sketch's, the plaque's words his. The row's first 2.6 tiles, older than 12,000,
  // are Farms too: the row starts at the ice.
  const PERIODS_12 = [
    { from: 12000, to: 6000, n: 'Farms',       c: '#b8923e', t: ['The ice is gone and the world is warming. People who have always followed the herds begin to keep plants and animals instead, and villages grow up around the fields.'] },
    { from: 6000,  to: 5200, n: 'Cities',      c: '#a3472b', t: ['In the river valleys, villages grow into cities: walls, temples, streets, and thousands of people who have never met one another.'] },
    { from: 5200,  to: 3200, n: 'Writing',     c: '#1f6b73', t: ['Marks pressed into clay keep count of grain and sheep. Then they keep names, then laws, then stories. Bronze is the metal of the age, and the pyramids go up.'] },
    { from: 3200,  to: 2000, n: 'Iron',        c: '#3b4f7a', t: ['Iron ore is common everywhere, so tools and weapons are cheap for the first time. Empires grow large, and in Greece, India and China people begin writing down how to think.'] },
    { from: 2000,  to: 600,  n: 'Paper',       c: '#9fb98a', t: ['Paper, first made in China, slowly carries words across the whole world. Empires rise and fall; cathedrals and mosques go up; the plague crosses continents.'] },
    { from: 600,   to: 250,  n: 'Printing',    c: '#6b3a66', t: ['A press makes the same page a thousand times, so books become cheap and ideas travel fast. Ships cross the oceans, and telescopes are pointed at the sky.'] },
    { from: 250,   to: 150,  n: 'Machines',    c: '#4a5a66', t: ['Steam engines do the work of horses. Railways, factories, photographs, and more people living in cities than ever before.'] },
    { from: 150,   to: 0,    n: 'Electricity', c: '#e2bd55', t: ['Light, voices and pictures travel along wires, then without them. Cars, aeroplanes, rockets, computers, and you.'] }
  ];
  // The last million's periods (step 3): names under the row over the ice and warm spells, which stay the tiles' colour.
  // Placeholder names and spans, Michael's to change; a placeholder sentence each, shown in grey; the box words say
  // "about", every edge being rough. The last 12,000 years have no period here: the 12,000 row has them.
  const PERIODS_M = [
    { from: 1000000, to: 600000, n: 'Hand axes',     ph: true, t: ['Stone tools shaped on both faces, made the same way, by the same kind of hands, for hundreds of thousands of years.'] },
    { from: 600000,  to: 300000, n: 'Fire',          ph: true, t: ['Hearths, charred bone and burnt flint: fire kept and used, not only found after a lightning strike.'] },
    { from: 300000,  to: 50000,  n: 'Neanderthals',  ph: true, t: ['Neanderthals across Europe and western Asia, and in Africa the first people of our own kind.'] },
    { from: 50000,   to: 12000,  n: 'Painted caves', ph: true, t: ['Paintings on cave walls, carved figures, needles, boats. People reach Australia and the Americas; the last ice age ends.'] }
  ];
  // ======== end of the table ========

  // ---------- years written short (step 5): Ba, Ma, ka; the calendar year inside the last 12,000; now ----------
  // A year that counts back from now is written in the unit it wants: a billion years ago and older in Ba (4.6 Ba), a
  // million to a billion in Ma (720 Ma), 12,000 years to a million in ka (474 ka), inside the last 12,000 years the
  // calendar year (200 BCE, 1720), and the present now. A length is not a date and stays in words (719 million years);
  // nothing here writes one. step: a year that came from a pixel (a dragged flag, the handle under her finger) is rounded
  // to the pixel's step and its figures show that step and no more (96.2 Ma); a year from a thing (a period's edge, an
  // event, a line's end) is exact, three figures past the point under 10, one under 100, none above (4.567 Ba, 2.58 Ma,
  // 67.8 ka, 252 Ma). The 12,000 row's period edges are round numbers of years ago (6,000, 600, 250), so their calendar
  // years are rounded to the same place (4000 BCE, 1400, 1780) wherever they are written — line one, the flags and the
  // handle alike — unless the year is an event's own (exact). The store's years: 200 BCE is −200; there is no year 0.
  function placeOf(y) { let k = 1; while (k < 1000 && y % (k * 10) === 0) k *= 10; return k; }   // 6000 → 1000, 5200 → 100, 250 → 10
  const ROUND_EDGES = new Map();
  PERIODS_12.forEach(p => [p.from, p.to].forEach(y => { if (y > 0 && y < LOOK.calYears) ROUND_EDGES.set(y, placeOf(y)); }));
  function calendarWord(y) {
    y = Math.round(y);
    if (y >= 1) return String(y);
    if (y === 0) return '1 CE';
    const b = -y; return (b >= 10000 ? fmt(b) : String(b)) + ' BCE';   // 10,000 BCE, 3200 BCE, as the store writes them
  }
  const AGO_UNITS = [[1e9, 'Ba'], [1e6, 'Ma'], [1e3, 'ka']];
  function agoWord(ma, step, exact) {
    let y = ma * 1e6;
    if (step) y = Math.round(y / step) * step;
    if (y < 0.5) return WORDS.now;
    if (y < LOOK.calYears - 1e-6) {
      let yr = THIS_YEAR - y;
      if (step > 1) yr = Math.round(yr / step) * step;
      else if (!step && !exact) { for (const [e, k] of ROUND_EDGES) if (Math.abs(e - y) < 0.01) { yr = Math.round(yr / k) * k; break; } }
      yr = Math.round(yr);
      return yr >= THIS_YEAR ? WORDS.now : calendarWord(yr);
    }
    let k = AGO_UNITS.findIndex(a => y >= a[0] - 1e-6);
    for (;;) {
      const [u, w] = AGO_UNITS[k], v = y / u;
      const d = step ? Math.max(0, Math.ceil(Math.log10(u / step) - 1e-9)) : v < 10 ? 3 : v < 100 ? 1 : 0;
      if (k > 0 && Math.round(v * Math.pow(10, d)) >= 1000 * Math.pow(10, d)) { k--; continue; }   // 999.97 Ma rounds to 1,000: written 1 Ba
      return v.toLocaleString('en', { maximumFractionDigits: d }) + ' ' + w;

  }
  // two years as a span, the unit once where both share it: 252 to 66 Ma, 1.8 Ba to 720 Ma, 4000 to 3200 BCE, 1400 to 1780, 1880 to now
  function agoSpan(a, b) {
    const m = a.match(/^(.*) (Ba|Ma|ka|BCE)$/), n = b.match(/^(.*) (Ba|Ma|ka|BCE)$/);
    return m && n && m[2] === n[2] ? m[1] + ' to ' + b : a + ' to ' + b;
  }
  // an event's date as its summary's first sentence has it, written short: about 149 million years ago → about 149 Ma,
  // about 26,500 to 19,000 years ago → about 26.5 to 19 ka (one rule, here; the store's prose is not touched)
  const AGO_WORDS = /(\d[\d,.]*)(?: to (\d[\d,.]*))? (billion |million )?years ago/;
  function shortDate(d) {
    return d.replace(AGO_WORDS, (all, a, b, u) => {
      const k = u === 'billion ' ? 1000 : u === 'million ' ? 1 : 1e-6, ma = t => parseFloat(t.replace(/,/g, '')) * k;
      return b ? agoSpan(agoWord(ma(a)), agoWord(ma(b))) : agoWord(ma(a));
    });
  }

  // ---------- colours ----------
  const hex2rgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const rgbStr = c => 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  function rgb2hsl(c) {
    const r = c[0] / 255, g = c[1] / 255, b = c[2] / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
    if (mx === mn) return [0, 0, l];
    const d = mx - mn, s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    let h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [h / 6, s, l];
  }
  function hsl2rgb(c) {
    const [h, s, l] = c; if (s === 0) return [l * 255, l * 255, l * 255];
    const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
    const f = t => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 1 / 2 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };

  }

  const backlit = c => { const l = rgb2hsl(c)[2]; return l > 0.68 ? mix(c, hex2rgb('#f0c84a'), LOOK.goldMix) : shade(c, LOOK.backlitL, LOOK.backlitS); };

  const CAME = hex2rgb(LOOK.came), CLEAR = hex2rgb(LOOK.clear), PARCH = hex2rgb(S.parchment || '#f4f1e8'), PLAIN = hex2rgb(LOOK.plain);
  const ICE_DEEP = hex2rgb(LOOK.iceDeep), ICE_PALE = hex2rgb(LOOK.icePale);
  const WARM_THRESHOLD_M = Q.get('thr') ? +Q.get('thr') : LOOK.threshold;

  // ---------- the lab's state: the year, the Earth, the timeline ----------
  // One year, the handle's (Lab-Time: "one year is the lab's shared state"); the Earth reads it and nothing else sets the
  // Earth. The timeline is there from the start (step 4). The Earth attaches when its module has stood it up. rough: the
  // year came from a pixel on the line (a tap, a drag), so the handle's label rounds it as the flags' labels round theirs.
  const lab = { ma: 0, rough: false, size: Q.get('size') === 'large' ? 'large' : 'small', earth: null, flat: false };

  // ---------- the three mosaics ----------
  // Each: the tiles (100 a block, 10 columns of 10; time down each column and then right), the blocks in a row, the
  // rows, the gutter the tiles are inset by on each side (its years hang in the right one), and the time of tile i as its
  // older and newer edges in million years ago (ma, the line's unit). nameOf: what the tile under the cursor is, after
  // its period's name (the 12,000: its decade; the last million: ice age or warm spell).
  const DECADES_BEGUN = Math.floor((THIS_YEAR - 2000) / 10) + 1;   // the thirteenth block of the 12,000 mosaic: the 2000s, 2010s, 2020s in 2026 — from today's date, so the row fills itself a tile a decade
  const WINDOWS = [
    { id: 'w0', blocks: 10, rows: 5, unitMa: 1, startMa: 4600, squares: 4600, gutter: LOOK.gutter,
      rowLabel: k => k < 4 ? (k + 1) + ' billion' : WORDS.nowLabel },   // the years count forward; the last label, where 4.6 billion sat, is Now
    { id: 'w1', blocks: 10, rows: 1, unitMa: 0.001, startMa: 1, squares: 1000, gutter: LOOK.gutter, names: true, endLabel: WORDS.now,   // no numbers under the row (step 4): the blocks are the ruler, the names the labels; now at the right end, as the 12,000 keeps its year there
      nameOf: i => (WINDOWS[1].warmOf && WINDOWS[1].warmOf[i]) ? WORDS.warmTile : WORDS.iceTile },
    { id: 'w2', blocks: 13, rows: 1, unitMa: 0.00001, startMa: (THIS_YEAR - ICE_YEAR) / 1e6, squares: 1300, real: 1200 + DECADES_BEGUN, gutter: LOOK.gutter12, names: true, yearEnd: true,
      nameOf: i => decadeWord(i) }   // no numbers under the row: the blocks are the ruler, the names the labels; the year stands at the row's right end
  ];
  function decadeWord(i) {   // the 12,000 mosaic: the tile's decade, the nearest thing it has to a period's name
    const start = ICE_YEAR + 10 * i;   // astronomer's years: 0 is 1 BCE
    return start >= 10 ? 'the ' + start + 's' : start >= 0 ? 'the first years CE' : 'about ' + calendarWord(start);   // about 9000 BCE (step 5: as the store writes its years)
  }
  WINDOWS.forEach(w => { w.olderMa = i => w.startMa - i * w.unitMa; w.newerMa = i => w.startMa - (i + 1) * w.unitMa; w.real = w.real || w.squares; w.spanMa = Math.min(w.startMa, LINE_END); w.nowSq = w.real - 1; });

  let events = [], sea = null;   // loaded below: the store's events, each with its record kept (rec) for the summary and the More
  const seaAt = year => sea ? CW.curveAt(sea.points, year) : null;

  // ---------- building a window's glass ----------
  // For each square: its kind (a period, an ice or warm run, plain), its colour (the period's, graded along it; the ice by
  // the sea; handmade shading by a hash), its events. Built once per window and glass mode, drawn many times.
  function build(w) {
    const n = w.squares, col = new Array(n), kind = new Array(n), ev = new Array(n);
    const plaques = [];   // one per period or run, by kind index: { key, n, c, t[], fromMa, toMa }
    const addPlaque = p => { plaques.push(p); return plaques.length - 1; };
    if (w.id === 'w0') {

  if (Q.get('log') === '1') {   // bench only: every console error and warning also written under the page, for a browser whose console cannot be reached
    const show = (kind, args) => { const f = $('fail'); f.style.display = 'block'; f.textContent += '\n' + kind + ': ' + [...args].map(a => a && a.message ? a.message : String(a)).join(' ').slice(0, 1500); };
    ['error', 'warn'].forEach(k => { const orig = console[k].bind(console); console[k] = (...a) => { orig(...a); show(k, a); }; });
    window.addEventListener('error', e => show('uncaught', [e.message])); window.addEventListener('unhandledrejection', e => show('rejection', [e.reason]));
  }
  const EARTH_AGE = 4567;
  const SHORT_CREDIT = 'The land: satellite pictures from July 2004, a month of them stitched together without clouds. NASA Earth Observatory';
  const HOME = { lon: 20, lat: 15 }, HOME_DISTANCE = 4.9;   // the camera's distance at which the whole ball fills the window's height
  // the seed: this visit's, made as globe.js makes one (?seed= fixes it for a check)
  const seed0 = Q.get('seed') ? +Q.get('seed') : ((Date.now() % 1000003) + Math.floor(Math.random() * 1000));
  // the opening view (the bench's seven, one at random; ?view= picks); the whole ball, at today
  const VIEWS = {
    alps: { name: 'the Alps', lon: 10.4, lat: 46.2 }, nile: { name: 'the Nile', lon: 32.8, lat: 15.3 }, tibet: { name: 'the Tibetan Plateau', lon: 89, lat: 33.5 },
    australia: { name: 'Australia', lon: 134, lat: -27.5 }, mexico: { name: 'Mexico City', lon: -99.13, lat: 19.43 }, amazon: { name: 'the Amazon', lon: -63, lat: -5 }, victoria: { name: 'Lake Victoria', lon: 33.2, lat: -1.3 }
  };
  let view = null, earth = null, ma = 0, marking = false;
  try {
    if (Q.get('no3d') === '1') throw new Error('bench: no 3D (?no3d=1)');
    view = await cwScene($('stage3d'), {
      ground: S.parchment, key: 'time-lab', phone: 'run',
      gesture: 'globe', home: HOME,
      camera: { fov: 24, position: [0, 0, HOME_DISTANCE], near: 0.1, far: 50, min: 1.4, max: 12 },
      words: $('cmds'),   // Reset view goes under How this works, with the page's other commands (step 3)
      onTier: async (tier) => { if (earth) await earth.setTier(tier); },
      onTap: (x, y) => (marking && earth ? markerTap(x, y) : !!(earth && earth.tap(x, y)))   // placing markers (step 5): a tap sets or deletes one; else a place on the globe glides to the centre, and on the flat world a tap goes back to the globe centred there
    });
    if (view.resetWord) { view.resetWord.classList.add('cmd'); view.resetWord.textContent = window.cwLab.WORDS.reset; $('cmds').appendChild(view.resetWord); }   // the Earth's words (step 5): Full screen, Large Earth, Small Earth, Map, Reset
    earth = await cwEarth(view, { marksHost: $('stage3d'), seed: seed0, onFlat: (on) => window.cwLab.flatWord(on) });
    await earth.setTier(view.tier);
    const keys = Object.keys(VIEWS), v = VIEWS[Q.get('view')] || VIEWS[keys[Math.floor(Math.random() * keys.length)]];
    view.turnTo(v.lon, v.lat); view.zoomTo(HOME_DISTANCE); view.setHome({ lon: v.lon, lat: v.lat, distance: HOME_DISTANCE });
    earth.step(); earth.resetFill(); earth.settle(); view.redraw();
  } catch (e) {
    console.warn('time-lab: no 3D view;', e && e.message ? e.message : e);
    $('stage3d').style.display = 'none'; $('still').style.display = 'block';
    if (Q.get('no3d') !== '1') { $('fail').style.display = 'block'; $('fail').textContent = 'This page could not start its 3D view: ' + (e && e.message ? e.message : e); }
  }
  // ---------- step 5: today's coastlines and her markers, riding their plates ----------
  // Both are points of today's ground, carried by a plate to where they were at the lab's year and projected, as the
  // Earth carries its cities (earth.project and projectFlat place a point by the plate it names, on the ball or the flat
  // world). A point's plate is the one whose piece holds it today (the Earth's plateAt, copied, on the same file, with a
  // box round each ring to make it quick); a point no piece holds (an island like Iceland, the open sea) rides nothing,
  // and like the Earth's own ground under the pieces it stays to the seam, where the plates start to move, and is gone
  // past it. A point shows while its piece lives, fading over the twenty million years before the piece was born (the
  // cities' rule), and nowhere at an age the Earth has no map for. Drawn on two canvases over the stage: the coastlines
  // under the Earth's places, the markers over them. A marker set at an age long ago is put on the piece under the tap at
  // that age, carried back by its plate to where that ground is today, and rides from there like any other.
  const LK = window.cwLab.LOOK, D2R = Math.PI / 180;
  let pieces = null, coastPts = null, coastOn = false, markers = [], markerHits = [], overlayKey = '';
  const coastCv = document.createElement('canvas'), markCv = document.createElement('canvas');
  [coastCv, markCv].forEach(c => { c.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;'; });
  async function loadPieces() {
    if (pieces) return pieces;
    const data = await fetch('../stories/plates/continents.json').then(r => r.json());
    pieces = data.pieces.map(p => ({ plate: String(p.plate), from: p.from, to: p.to, ll: p.rings, box: p.rings.map(ring => {
      let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
      for (let i = 0; i < ring.length; i += 2) { x0 = Math.min(x0, ring[i]); x1 = Math.max(x1, ring[i]); y0 = Math.min(y0, ring[i + 1]); y1 = Math.max(y1, ring[i + 1]); }
      return [x0, x1, y0, y1];
    }) }));
    return pieces;
  }
  function inRing(ring, lon, lat) {   // the Earth's plateAt's test, as it is
    const n = ring.length / 2; let c = false, j = n - 1;
    for (let m = 0; m < n; m++) { const xi = ring[2 * m], yi = ring[2 * m + 1], xj = ring[2 * j], yj = ring[2 * j + 1]; if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / ((yj - yi) || 1e-9) + xi) c = !c; j = m; }
    return c;
  }
  function pieceAt(lon, lat, plate, age) {   // the piece holding a point of today's ground: one living today, or of `plate` living at `age`
    for (const p of pieces) {
      if (plate != null ? p.plate !== plate || age > p.from || age < p.to : p.to > 0) continue;
      for (let k = 0; k < p.ll.length; k++) { const b = p.box[k]; if (lon >= b[0] && lon <= b[1] && lat >= b[2] && lat <= b[3] && inRing(p.ll[k], lon, lat)) return p; }
    }
    return null;
  }
  const ride = p => p ? { plate: p.plate, from: p.from, to: p.to } : { plate: null, from: Infinity, to: -Infinity };
  function alpha(pt, age) {   // how much of a point shows at an age
    const g = earth.grade().grade; if (g === 'none' || g === 'invented') return 0;
    if (pt.plate == null) return age < earth.seam ? 1 : 0;
    if (age < pt.to) return 0;
    return Math.max(0, Math.min(1, (pt.from - age) / LK.markerFade));
  }
  const at = (pt, flat) => flat ? earth.projectFlat(pt.lon, pt.lat, pt.plate) : earth.project(pt.lon, pt.lat, pt.plate);
  async function loadCoasts() {
    if (coastPts) return;
    const [file] = await Promise.all([fetch('../art/maps/world-tiles/contours-0.json').then(r => r.json()), loadPieces()]);
    coastPts = (file['0'] || []).map(ring => ring.map(([lon, lat]) => Object.assign({ lon, lat }, ride(pieceAt(lon, lat)))));
    overlayKey = '';
  }
  function sizeCanvas(c, w, h, dpr) { if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); } const x = c.getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, c.width, c.height); x.setTransform(dpr, 0, 0, dpr, 0, 0); return x; }
  function drawOverlay(force) {
    if (!earth) return;
    const w = view.host.clientWidth, h = view.host.clientHeight; if (!w || !h) return;
    const cam = view.camera.position, bq = view.ball.quaternion, age = earth.time(), flat = earth.flat();
    const key = [cam.x, cam.y, cam.z, bq.x, bq.y, bq.z, bq.w, w, h, age, flat, coastOn, marking, markers.length, !!coastPts].join();
    if (!force && key === overlayKey) return;
    overlayKey = key;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    view.scene.updateMatrixWorld();
    // the coastlines: a segment where both ends show, face the camera, ride one plate (or the plates have not moved yet),
    // and on the flat world do not run round the back across the edge
    const cx = sizeCanvas(coastCv, w, h, dpr);
    if (coastOn && coastPts) {
      cx.strokeStyle = S.coast || '#4a4336'; cx.lineWidth = LK.coastW; cx.lineJoin = 'round'; cx.lineCap = 'round';
      const still = age < earth.seam;
      for (const ring of coastPts) {
        let prev = null, pa = 0, pp = null;
        for (let k = 0; k <= ring.length; k++) {
          const pt = ring[k % ring.length], a = alpha(pt, age), q = a > 0 ? at(pt, flat) : null;
          if (prev && q && pp && pp.front && q.front && (still || prev.plate === pt.plate) && (!flat || Math.abs(q.x - pp.x) < w / 3)) {
            cx.globalAlpha = LK.coastA * Math.min(a, pa); cx.beginPath(); cx.moveTo(pp.x, pp.y); cx.lineTo(q.x, q.y); cx.stroke();
          }
          prev = pt; pa = a; pp = q;
        }
      }
      cx.globalAlpha = 1;
    }
    // the markers: a copper dot ringed in parchment, as the year's handle is drawn
    const mx = sizeCanvas(markCv, w, h, dpr);
    markerHits = [];
    if (marking) {
      for (const m of markers) {
        const a = alpha(m, age); if (a <= 0) continue;
        const q = at(m, flat); if (!q.front) continue;
        mx.globalAlpha = a; mx.beginPath(); mx.arc(q.x, q.y, LK.markerR + LK.markerRing, 0, 2 * Math.PI); mx.fillStyle = S.parchment; mx.fill();
        mx.beginPath(); mx.arc(q.x, q.y, LK.markerR, 0, 2 * Math.PI); mx.fillStyle = S.copper || '#b5652b'; mx.fill();
        markerHits.push({ m, x: q.x, y: q.y });
      }
      mx.globalAlpha = 1;
    }
  }
  // a tap while placing: on a marker, it goes; elsewhere on the Earth, one is set on the piece under the tap at this age
  function markerTap(x, y) {
    let best = null, bd = LK.markerTap;
    for (const hm of markerHits) { const d = Math.hypot(x - hm.x, y - hm.y); if (d <= bd) { bd = d; best = hm.m; } }
    if (best) { markers.splice(markers.indexOf(best), 1); drawOverlay(true); return true; }
    if (!pieces) { loadPieces().then(() => markerTap(x, y)); return true; }
    const age = earth.time(), g = earth.grade().grade; if (g === 'none' || g === 'invented') return true;
    const here = earth.flat() ? earth.flatLonLatAt(x, y) : view.lonLatAt(x, y); if (!here) return true;
    const m = markAt(here.lon, here.lat, age); if (m) { markers.push(m); drawOverlay(true); }
    return true;
  }
  function markAt(lon, lat, age) {   // the ground under a point at an age, as today's point and its plate; null on the sea past the seam
    const la = lat * D2R, lo = lon * D2R, v = new THREE.Vector3(Math.cos(la) * Math.cos(lo), Math.cos(la) * Math.sin(lo), Math.sin(la)), q = new THREE.Quaternion(), u = new THREE.Vector3();
    const plates = [...new Set(pieces.filter(p => age <= p.from && age >= p.to).map(p => p.plate))];
    for (const pid of plates) {
      const Q = earth.bodyQuat(pid, age);
      if (Q) q.set(Q[1], Q[2], Q[3], Q[0]).invert(); else q.identity();
      u.copy(v).applyQuaternion(q);
      const tl = Math.atan2(u.y, u.x) / D2R, tb = Math.asin(Math.max(-1, Math.min(1, u.z))) / D2R, p = pieceAt(tl, tb, pid, age);
      if (p) return Object.assign({ lon: tl, lat: tb, set: age }, ride(p));
    }
    return age < earth.seam ? { lon, lat, set: age, plate: null, from: Infinity, to: -Infinity } : null;   // the sea, this side of the seam: it rides nothing and is gone past the seam
  }
  if (earth) {
    const host = $('stage3d'), marks = host.querySelector('.cw-earth-marks');
    host.insertBefore(coastCv, marks || null); host.appendChild(markCv);
    // stacked by number, not by order alone: in the pane a canvas laid just over the WebGPU one did not show on the flat
    // world until it had a z-index (found in step 5's check); the coastlines under the Earth's places, the markers over them
    coastCv.style.zIndex = '1'; if (marks) marks.style.zIndex = '2'; markCv.style.zIndex = '3';
    view.onFrame(() => drawOverlay(false));
  }
  window.cwOverlay = { markers: () => markers.slice(), hits: () => markerHits.slice(), tap: x => markerTap(x[0], x[1]), markAt: (lon, lat) => markAt(lon, lat, earth.time()), loadPieces, loadCoasts, coasts: () => coastPts, draw: () => drawOverlay(true),
    coastStats: () => coastPts ? { rings: coastPts.length, points: coastPts.reduce((n, r) => n + r.length, 0), unheld: coastPts.reduce((n, r) => n + r.filter(p => p.plate == null).length, 0) } : null };

  // what the Earth knows at its year, for the text block and the credit (the classic script writes both): the grade
  // (the molten phase's sentence while there is no grade, as gradeFor gives it) and the credit — the photograph's this
  // side of the seam, the plate model's past it
  if (earth) {
    window.cwLab.attachEarth({
      view, earth,
      setTime: m => { ma = Math.max(0, Math.min(EARTH_AGE, m)); earth.setTime(ma); },
      grade: () => { const g = earth.grade(); return { grade: g.grade, why: g.why, credit: ma < earth.seam ? SHORT_CREDIT : 'The continents: Merdith et al. 2021 (EarthByte)' }; },
      setPlaces: on => earth.setPlaces(on),
      setCoasts: on => { coastOn = !!on; if (coastOn) loadCoasts().then(() => drawOverlay(true)); drawOverlay(true); },   // step 5: today's coastlines, riding their plates
      setMarkers: on => { marking = !!on; if (marking) loadPieces(); drawOverlay(true); },   // step 5: Place markers / Hide markers
      setFlat: on => earth.setFlat(on), flat: () => earth.flat(),
      resized: () => { view.setFrame(null); earth.settle(); view.redraw(); }   // the renderer and the camera take the stage's new size at once, not at the next observed frame
    });
  }
  // bench only: the Earth's frame measured off-screen with a readback (the bench's cwBench), since the pane presents a
  // WebGPU canvas at a few frames a second and the on-screen rate says nothing there
  window.cwBench = async function (tier, frames = 30, step = 1) {
    if (!view) return null;
    const live = view.tier, ma0 = ma; await view.setTier(tier, { quiet: true });
    const w = view.renderer.domElement.width, h = view.renderer.domElement.height;
    const rt = new THREE.RenderTarget(w, h, { depthBuffer: true });
    const done = () => view.renderer.readRenderTargetPixelsAsync(rt, 0, 0, 1, 1);
    view.renderer.setRenderTarget(rt);
    view.renderer.render(view.stage().scene, view.stage().camera); await done();
    const t0 = performance.now(), stg = view.stage();
    for (let i = 0; i < frames; i++) { earth.setTime(ma0 + i * step); view.renderer.render(stg.scene, stg.camera); await done(); }
    const ms = (performance.now() - t0) / frames;
    view.renderer.setRenderTarget(null); rt.dispose();
    earth.setTime(ma0);
    await view.setTier(live, { quiet: true });
    return { backend: view.backend, tier, pixels: w + 'x' + h, msPerFrame: +ms.toFixed(2), fpsIfAlone: +(1000 / ms).toFixed(1) };
  };
  window.cwView = view; window.cwEarth = earth;
</script>
</body>
