<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="../art/icons/map-icon-256.png">
<link rel="apple-touch-icon" href="../art/icons/map-icon-256.png">
<!--
  after-the-ice.html — bench: After the Ice on the moving world. Twelve thousand years and the
  whole earth, three lines and the map, nothing to read. Spec: CWVault/claude/Spec-Maps.md,
  "After the Ice, on the moving world" (27 Sep 2026); the run, the odometer and the road are
  the September bench's (experiments/timeline-bench.html, Spec-Timeline-Intro.md).

  The top line is the whole span and never rescales; the window on it (the pale band: drag it,
  or drag either end) is the only thing on it that answers a finger. The odometer reads the
  window's left edge. The road is the September road redrawn to the window's span, a picture
  and not a control. The World line is js/timeline.js and the map under it js/map.js, the
  same code as every story's world section; its span is the window's, and it and the map are
  the only places anything is selectable. The line takes taps only; pan and pinch are the map's.

  Data, read and never written: ../stories/after-the-ice-events.json (this bench's own events
  and places), ../stories/world-events.json and ../stories/places.json (the shared list),
  merged at load. Her line: the ids the September bench keeps in localStorage under
  cw-after-the-ice, plus every event she taps here.
-->
<title>After the Ice — bench</title>
<style>
  :root {
    --ground: #f4f1e8; --road: #e3dccb; --road-edge: #cfc6b1;
    --ink: #2a2620; --ink-soft: #6b625a; --line: #3C5C83; --line-faint: #b9c3d0;
    --copper: #b87333; --copper-glow: rgba(184,115,51,.35);
    --window: rgba(60,92,131,.13); --window-edge: #3C5C83;
    --word: #546A80; --word-hot: #3C5C83; --rule: #c8b89a;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--ground); color: var(--ink); }
  body { margin: 0; font-family: Georgia, "Times New Roman", Times, serif; font-size: 16px; line-height: 1.4; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible { outline: 1.5px solid var(--word); outline-offset: 3px; border-radius: 2px; }

  .stage { max-width: 1180px; margin: 0 auto; padding: 24px 40px 60px; }
  .masthead { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .masthead .eyebrow { color: var(--ink-soft); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
  .masthead h1 { margin: 6px 0 0; font-size: 34px; font-weight: normal; line-height: 1.1; }
  .masthead .hint { color: var(--ink-soft); font-style: italic; font-size: 13px; transition: opacity .3s ease; }

  /* ---------- the top line: the whole span, and the window ---------- */
  .top { position: relative; margin-top: 104px; height: 66px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .odo { position: absolute; top: -104px; left: 0; transform: translateX(-50%); text-align: center; pointer-events: none; white-space: nowrap; }
  .odo .digits { display: inline-flex; align-items: flex-end; height: 60px; overflow: hidden; font-size: 52px; font-weight: bold; line-height: 1; font-variant-numeric: tabular-nums; }
  .odo .digits .comma { align-self: flex-end; padding-bottom: 6px; width: .3em; text-align: center; }
  .odo .col { position: relative; width: .62em; height: 60px; overflow: hidden; }
  .odo .col .strip { position: absolute; left: 0; top: 0; width: 100%; will-change: transform; }
  .odo .col .strip span { display: block; height: 60px; line-height: 60px; text-align: center; }
  .odo .unit { font-size: 14px; color: var(--ink-soft); font-style: italic; margin-top: 2px; }
  .odo .plain { color: var(--ink-soft); font-style: normal; margin-left: 6px; opacity: 0; transition: opacity .3s ease; }
  .odo .plain.on { opacity: 1; }

  .rail { position: absolute; left: 0; right: 0; top: 30px; height: 2px; background: var(--line); pointer-events: none; }
  .tick { position: absolute; top: 24px; width: 1px; height: 14px; background: var(--line-faint); transform: translateX(-.5px); pointer-events: none; }
  .tick.k { height: 8px; top: 27px; }
  .tick-label { position: absolute; top: 44px; transform: translateX(-50%); font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; pointer-events: none; }
  .endcap { position: absolute; top: 44px; font-size: 13px; color: var(--ink-soft); white-space: nowrap; pointer-events: none; }
  .endcap.left { left: 0; } .endcap.right { right: 0; font-style: italic; }
  .diamond { position: absolute; top: 31px; width: 7px; height: 7px; background: var(--line); transform: translate(-50%,-50%) rotate(45deg); opacity: 0; transition: opacity .6s ease; pointer-events: none; }
  .diamond.on { opacity: .55; }
  .dot { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--copper); transform: translate(-50%,-50%); box-shadow: 0 0 0 6px var(--copper-glow), 0 0 22px 4px var(--copper-glow); z-index: 3; pointer-events: none; transition: opacity .5s ease; }
  .top .dot { top: 31px; left: 0; }
  .dot.gone { opacity: 0; }

  .window { position: absolute; top: 14px; height: 34px; background: var(--window); border-left: 2px solid var(--window-edge); border-right: 2px solid var(--window-edge); border-radius: 2px; opacity: 0; transition: opacity .5s ease; pointer-events: none; cursor: grab; }
  .window.on { opacity: 1; }
  .top.live { cursor: default; }
  .top.dragging, .top.dragging * { cursor: grabbing !important; }

  /* ---------- the road: a picture of the window, not a control ---------- */
  .road { position: relative; height: 300px; margin-top: 6px; pointer-events: none; user-select: none; -webkit-user-select: none; }
  .road > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .road .band { fill: var(--road); stroke: var(--road-edge); stroke-width: .75; }
  .road .centre { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 5; opacity: .5; }
  .ev { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 1px; white-space: nowrap; opacity: 0; transition: opacity .35s ease-in; }
  .ev.on { opacity: 1; }
  .ev .glyph { color: var(--line); display: block; }
  .ev .glyph svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .ev .short { color: var(--ink); line-height: 1.15; text-align: center; white-space: normal; max-width: 118px; text-wrap: balance; }
  .ev .yr { color: var(--ink-soft); font-style: italic; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .ev .stem { width: 1px; background: var(--line-faint); margin-top: 2px; }
  .road .dot { top: 0; left: 0; }

  /* ---------- her word, and the World line with its map ---------- */
  .words { display: flex; justify-content: flex-end; min-height: 26px; margin-top: 8px; font-size: 14px; }
  .words button { color: var(--word); opacity: 0; pointer-events: none; transition: opacity .2s ease-in, color .15s ease; padding: 4px 0; }
  .words button.on { opacity: 1; pointer-events: auto; }
  .words button:hover { color: var(--word-hot); }
  .words button.active { color: var(--copper); }
  .world { transition: opacity .6s ease; }
  .world.waiting { opacity: .25; pointer-events: none; }

  @media (max-width: 640px) {
    .stage { padding: 20px 16px 40px; }
    .odo .digits { font-size: 40px; height: 48px; } .odo .col { height: 48px; } .odo .col .strip span { height: 48px; line-height: 48px; }
    .top { margin-top: 92px; } .odo { top: -90px; }
    .road { height: 240px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ev, .diamond, .window, .dot, .world, .odo .plain { transition: none; }
  }
</style>
</head>
<body>

<main class="stage">
  <header class="masthead">
    <div><div class="eyebrow">Curious Woods · a bench</div><h1>After the Ice</h1></div>
    <span class="hint" id="hint">tap to stop</span>
  </header>

  <section class="top" id="top" aria-label="Twelve thousand years, to scale">
    <div class="odo" id="odo"><div class="digits" id="digits"></div><div class="unit">years after the ice<span class="plain" id="plain"></span></div></div>
    <div class="rail"></div>
    <div id="ticks"></div>
    <div id="diamonds"></div>
    <div class="window" id="window"></div>
    <div class="dot" id="dot"></div>
    <span class="endcap left">the ice lets go</span>
    <span class="endcap right">now</span>
  </section>

  <section class="road" id="road" aria-hidden="true">
    <svg id="roadSvg"></svg>
    <div id="roadEvents"></div>
    <div class="dot" id="roadDot"></div>
  </section>

  <nav class="words"><button type="button" id="seenWord">what I’ve seen</button></nav>
  <div class="world waiting" id="world"></div>
</main>

<script src="../js/map.js?v=2026-09-27i"></script>
<script src="../js/timeline.js?v=2026-09-27-ati"></script>
<script>
(function () {
  'use strict';
  const CW_VERSION = '2026-09-27 42f532b';   // date + short commit hash; bump in the same commit as any change
  try { console.log('Curious Woods · ' + document.title + ' · ' + CW_VERSION); } catch (e) {}

  // This timeline's zero. The store writes the astronomer's year (negative for BC); this line
  // counts after the ice, so it adds ICE to every year it reads. The next timeline (fire, the
  // mammals) has its own zero and its own name, and changes only these two lines.
  const ICE = 10000;
  const NAME = 'after the ice';
  const NOW = new Date().getFullYear() + ICE;     // the right end of the line: now

  // How the page opens. The run is the one in use; the other two are held here as words, for
  // later (Spec-Maps, After the Ice, "The introduction").
  const OPENINGS = {
    run: 'The copper dot leaves year 0 and rolls up the years in about ten seconds, leaving events behind it. Tap to stop it. When it reaches now, the window appears over the whole span and the lines are hers.',
    zero: 'When it comes to counting years, you can put 0 anywhere you like.',   // Michael's paragraph; only its opening is written
    tap: 'tap anything'
  };
  const OPENING = 'run';

  // The last-glacial-maximum ice, when it is rendered, is a layer of this name in the pyramid.
  // It is shown when the window lies entirely before year 1 000 after the ice.
  const PAST_ICE = 'ice-lgm', PAST_ICE_BEFORE = 1000;
  const PYRAMID = '../art/maps/world-pyramid.json';
  const KEY = 'cw-after-the-ice';                  // her line, shared with timeline-bench.html
  const RUN_MS = 10000;
  const MIN_SPAN = 5;                              // the narrowest window, in years

  const G = {
    ice:'<svg viewBox="0 0 24 24"><path d="M3 15h18M6 15l2-4 3 3 3-6 2 4 2-2 1 5"/></svg>',
    seed:'<svg viewBox="0 0 24 24"><path d="M12 21V9M12 9c-5 0-7-4-7-6 4 0 7 2 7 6zM12 12c0-4 3-6 7-6 0 2-2 6-7 6z"/></svg>',
    wall:'<svg viewBox="0 0 24 24"><path d="M3 20h18M4 20V9l8-5 8 5v11M9 20v-5h6v5M4 13h16"/></svg>',
    stone:'<svg viewBox="0 0 24 24"><path d="M8 21V6l4-3 4 3v15M8 21h8M8 11h8M8 16h8"/></svg>',
    pot:'<svg viewBox="0 0 24 24"><path d="M8 4h8M9 4c0 3-4 4-4 9s3 8 7 8 7-3 7-8-4-6-4-9M6 12h12"/></svg>',
    metal:'<svg viewBox="0 0 24 24"><path d="M4 18l6-6M10 12l2-2 4 4-2 2zM14 8l3-3 2 2-3 3M3 21l2-2"/></svg>',
    tablet:'<svg viewBox="0 0 24 24"><path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4"/></svg>',
    boat:'<svg viewBox="0 0 24 24"><path d="M3 15l2 4h14l2-4zM12 4v11M12 4c4 1 6 4 7 9M4 20c2 1 4 1 6 0s4-1 6 0 2 1 4 0"/></svg>',
    star:'<svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18M12 12h.01"/></svg>',
    fire:'<svg viewBox="0 0 24 24"><path d="M4 21h16M6 21l5-11 2 4 1-2 4 9M11 6c0-2 2-3 2-5 1 2 3 3 3 5"/></svg>',
    wheel:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="1.5"/><path d="M12 4v16M4 12h16M6.3 6.3l11.4 11.4M17.7 6.3L6.3 17.7"/></svg>',
    book:'<svg viewBox="0 0 24 24"><path d="M12 6c-2-2-5-2-8-1v14c3-1 6-1 8 1M12 6c2-2 5-2 8-1v14c-3-1-6-1-8 1M12 6v14"/></svg>',
    lens:'<svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M14.5 14.5L21 21M8 10h4M10 8v4"/></svg>',
    leaf:'<svg viewBox="0 0 24 24"><path d="M4 20C6 10 12 5 20 4c-1 8-6 14-16 16zM4 20l10-10"/></svg>',
    cloth:'<svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 5v14M12 5v14M16 5v14M4 9h16M4 13h16"/></svg>',
    number:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 5v14M5 12h14"/></svg>',
    music:'<svg viewBox="0 0 24 24"><path d="M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM9 18V6l12-3v13"/></svg>',
    animal:'<svg viewBox="0 0 24 24"><path d="M4 18v-6c0-3 2-5 5-5h6c3 0 5 2 5 5v6M8 18v-4M16 18v-4M15 7V4l3 1M9 7V4L6 5"/></svg>',
    city:'<svg viewBox="0 0 24 24"><path d="M2 21h20M4 21V10h5v11M9 21V5h6v16M15 21v-8h5v8M11 8h2M11 12h2M11 16h2"/></svg>',
    eye:'<svg viewBox="0 0 24 24"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    train:'<svg viewBox="0 0 24 24"><path d="M5 4h14v12H5zM5 10h14M8 4v6M16 4v6M7 16l-2 4M17 16l2 4M8 20h8"/><circle cx="8.5" cy="13" r="1"/><circle cx="15.5" cy="13" r="1"/></svg>',
    moon:'<svg viewBox="0 0 24 24"><path d="M20 15A8 8 0 1 1 9 4a6.5 6.5 0 0 0 11 11z"/></svg>',
    spark:'<svg viewBox="0 0 24 24"><path d="M13 2L6 13h5l-1 9 8-12h-5z"/></svg>',
    frog:'<svg viewBox="0 0 24 24"><path d="M4 14c0-4 3-6 8-6s8 2 8 6-3 6-8 6-8-2-8-6zM3 20l4-3M21 20l-4-3"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/></svg>',
    kite:'<svg viewBox="0 0 24 24"><path d="M12 2l7 8-7 8-7-8zM12 2v16M5 10h14M12 18c-1 2-3 3-5 4"/></svg>',
    tower:'<svg viewBox="0 0 24 24"><path d="M12 2l5 20H7zM9 12h6M8 17h8M12 2v6"/></svg>',
    brush:'<svg viewBox="0 0 24 24"><path d="M20 4L9 15M9 15c-3 0-5 2-5 5 3 0 5-2 5-5z"/></svg>',
    horse:'<svg viewBox="0 0 24 24"><path d="M4 20V11l4-4h6l5 3v10M8 20v-5M14 20v-5M14 7l3-4"/></svg>',
    film:'<svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zM3 9h18M3 15h18M7 5v4M12 5v4M17 5v4M7 15v4M12 15v4M17 15v4"/></svg>',
    vote:'<svg viewBox="0 0 24 24"><path d="M4 10h16v11H4zM12 3v7M9 6l3-3 3 3"/></svg>',
    mask:'<svg viewBox="0 0 24 24"><path d="M4 5c3 2 13 2 16 0v8c0 5-4 8-8 8s-8-3-8-8zM8 11h3M13 11h3M9 16c2 1 4 1 6 0"/></svg>',
    water:'<svg viewBox="0 0 24 24"><path d="M3 8c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 13c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 18c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg>',
  };
  // a shared record has no glyph; its kind picks one, and a record with neither gets the eye
  const KIND_GLYPH = { sky: 'star', earth: 'fire', crop: 'seed', craft: 'wheel', object: 'pot', place: 'city', person: 'eye', text: 'book' };
  const glyphOf = e => G[e.glyph] || G[KIND_GLYPH[e.kind]] || G.eye;

  // ---------- numbers and years ----------
  const fmt = y => Math.round(y).toLocaleString('en-US');
  // The plain year for a line year. The store's BC years came from the September file, which
  // wrote 10 000 minus the BC year, so a BC year is minus the store's year (Thales: -585, 585 BC).
  // See the file's _about; the true astronomer's year would be one later.
  function plain(lineYear) {
    const y = Math.floor(lineYear - ICE);
    return y >= 1 ? (y < 1000 ? 'AD ' : '') + y : (-y) + ' BC';
  }
  const ABOUT = { decade: true, century: true, millennium: true };
  function when(e, placeName) {
    return (ABOUT[e.precision] ? 'about ' : '') + fmt(e.year) + ' ' + NAME + ' (' + plain(e.year) + ')' + (placeName ? ' · ' + placeName : '');
  }
  const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

  // ---------- the store: both lists, merged at load ----------
  let LINE = [], byId = {}, alias = {}, PLACES = {};
  function merge(own, sharedEvents, sharedPlaces) {
    PLACES = {};
    Object.keys(sharedPlaces).forEach(k => { PLACES[k] = Object.assign({}, sharedPlaces[k], { side: 'world' }); });
    Object.keys(own.places || {}).forEach(k => { if (!PLACES[k]) PLACES[k] = Object.assign({}, own.places[k], { side: 'world' }); });
    const out = [];
    // the shared list: a record whose year has no precision counts as `year`
    Object.keys(sharedEvents).forEach(id => {
      const w = sharedEvents[id];
      const e = { id, year: w.year + ICE, precision: w.precision || 'year', kind: w.kind, weight: w.weight || 1,
                  place: w.place, label: w.label, side: 'world' };
      e.when = when(e, PLACES[w.place] && PLACES[w.place].name);
      e.title = w.title || w.label; e.text = w.text || '';
      out.push(e);
    });
    // this bench's own: a record that is the `same` happening as another stands aside for it
    (own.events || []).forEach(r => { if (r.same) alias[r.id] = r.same; });
    (own.events || []).forEach(r => {
      if (r.same) return;
      const e = { id: r.id, year: r.year + ICE, precision: r.precision || 'year', kind: r.kind, weight: r.weight || 1,
                  place: r.place, label: r.label, glyph: r.glyph, side: 'world' };
      e.when = when(e, r.place && PLACES[r.place] && PLACES[r.place].name);
      e.title = cap(r.label);
      e.text = r.blurb + ' <i>' + (r.story ? 'There is a story about this.' : 'Nobody has written this story yet.') + '</i>';
      out.push(e);
    });
    LINE = out.filter(e => e.year >= 0 && e.year <= NOW).sort((a, b) => a.year - b.year);
    byId = Object.fromEntries(LINE.map(e => [e.id, e]));
  }
  function resolve(id) { let n = 0; while (alias[id] && n++ < 8) id = alias[id]; return byId[id] ? id : null; }

  // ---------- her line ----------
  function loadSeen() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } }
  function saveSeen(ids) { try { localStorage.setItem(KEY, JSON.stringify(ids)); } catch (e) {} }
  function seenOnLine() { const s = new Set(); loadSeen().forEach(id => { const r = resolve(id); if (r) s.add(r); }); return [...s]; }
  function addSeen(id) { const s = loadSeen(); if (s.indexOf(id) < 0) { s.push(id); saveSeen(s); } }

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const top = $('top'), odo = $('odo'), digitsEl = $('digits'), plainEl = $('plain'), dot = $('dot'), win = $('window');
  const ticksEl = $('ticks'), diamondsEl = $('diamonds'), hint = $('hint');
  const roadEl = $('road'), roadSvg = $('roadSvg'), roadEvents = $('roadEvents'), roadDot = $('roadDot');
  const seenWord = $('seenWord'), worldHost = $('world');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let lineW = 0;
  const xOf = y => (y / NOW) * lineW;
  const yOf = x => (x / lineW) * NOW;

  function layoutTicks() {
    ticksEl.innerHTML = '';
    for (let y = 0; y <= NOW; y += 1000) {
      const t = document.createElement('div'); t.className = 'tick' + (y % 5000 ? ' k' : ''); t.style.left = xOf(y) + 'px'; ticksEl.appendChild(t);
      if (y === 5000 || y === 10000) { const l = document.createElement('div'); l.className = 'tick-label'; l.textContent = fmt(y); l.style.left = xOf(y) + 'px'; ticksEl.appendChild(l); }
    }
  }
  function layoutDiamonds(shownTo) {
    diamondsEl.innerHTML = '';
    LINE.forEach(e => {
      const d = document.createElement('div'); d.className = 'diamond' + (e.year <= shownTo ? ' on' : '');
      d.style.left = xOf(e.year) + 'px'; d.dataset.y = e.year; diamondsEl.appendChild(d);
    });
  }

  // ---------- the odometer (the September bench's) ----------
  const cols = [];
  function buildOdometer() {
    digitsEl.innerHTML = ''; cols.length = 0;
    [4, 3, 2, 1, 0].forEach(p => {
      const col = document.createElement('div'); col.className = 'col';
      const strip = document.createElement('div'); strip.className = 'strip';
      for (let d = 0; d <= 10; d++) { const s = document.createElement('span'); s.textContent = d % 10; strip.appendChild(s); }
      col.appendChild(strip); digitsEl.appendChild(col); cols.push({ p, col, strip });
      if (p === 3) { const c = document.createElement('div'); c.className = 'comma'; c.textContent = ','; digitsEl.appendChild(c); }
    });
  }
  function setOdometer(v, x) {
    v = Math.max(0, v);
    const h = cols[0].col.offsetHeight || 60;
    let leading = true;
    for (const c of cols) {
      const unit = Math.pow(10, c.p);
      const digit = Math.floor(v / unit) % 10;
      const lower = (v % unit) / unit;
      const carry = lower > 0.9 ? (lower - 0.9) * 10 : 0;
      c.strip.style.transform = 'translateY(' + (-(digit + carry) * h) + 'px)';
      const hide = leading && c.p > 0 && Math.floor(v / unit) === 0;
      c.col.style.opacity = hide ? '0' : '1'; c.col.style.width = hide ? '0' : '';
      if (!hide) leading = false;
    }
    const comma = digitsEl.querySelector('.comma'); if (comma) comma.style.display = v >= 1000 ? '' : 'none';
    const half = odo.offsetWidth / 2;
    odo.style.left = Math.min(Math.max(x, half), lineW - half) + 'px';
  }

  // ---------- the road, redrawn to a span (the September bench's, from a to b) ----------
  const ROWS = 4, SCALES = [0.36, 0.56, 0.78, 1.0], SHARES = [8, 4, 2, 1];
  let W = 0, H = 0, road = null;
  function buildRoad(a, b) {
    const span = b - a, ssum = SHARES.reduce((p, q) => p + q, 0), bend = span * 0.012;
    const horizon = 24, h0 = H - 58, cx = W / 2, margin = 40;
    const rows = []; let yr = a;
    for (let k = 0; k < ROWS; k++) {
      const s = SCALES[k], half = (W / 2 - margin) * s, dir = k % 2 === 0 ? 1 : -1;
      const ra = yr + (k === 0 ? 0 : bend);
      yr += span * SHARES[k] / ssum;
      const rb = yr - (k === ROWS - 1 ? 0 : bend);
      rows.push({ k, a: ra, b: rb, s, dir, y: horizon + h0 * s, x0: cx - dir * half, x1: cx + dir * half });
    }
    const pts = [];
    for (let k = 0; k < ROWS; k++) {
      const r = rows[k];
      for (let i = 0; i <= 40; i++) { const t = i / 40; pts.push({ x: r.x0 + (r.x1 - r.x0) * t, y: r.y, yr: r.a + (r.b - r.a) * t, s: r.s }); }
      if (k < ROWS - 1) {
        const q = rows[k + 1], R0 = 90 * r.s, R1 = 90 * q.s;
        const p0 = { x: r.x1, y: r.y }, c0 = { x: r.x1 + r.dir * R0, y: r.y }, c1 = { x: q.x0 - q.dir * R1, y: q.y }, p1 = { x: q.x0, y: q.y };
        for (let i = 1; i < 24; i++) {
          const t = i / 24, u = 1 - t;
          pts.push({ x: u*u*u*p0.x + 3*u*u*t*c0.x + 3*u*t*t*c1.x + t*t*t*p1.x, y: u*u*u*p0.y + 3*u*u*t*c0.y + 3*u*t*t*c1.y + t*t*t*p1.y,
                     yr: r.b + (q.a - r.b) * t, s: r.s + (q.s - r.s) * t });
        }
      }
    }
    road = { pts, rows };
  }
  function posAt(yr) {
    const p = road.pts;
    if (yr <= p[0].yr) return p[0];
    if (yr >= p[p.length - 1].yr) return p[p.length - 1];
    let lo = 0, hi = p.length - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (p[mid].yr <= yr) lo = mid; else hi = mid; }
    const A = p[lo], B = p[hi], t = (yr - A.yr) / ((B.yr - A.yr) || 1);
    return { x: A.x + (B.x - A.x) * t, y: A.y + (B.y - A.y) * t, s: A.s + (B.s - A.s) * t };
  }
  function drawRoad() {
    const p = road.pts, L = [], R = [];
    for (let i = 0; i < p.length; i++) {
      const A = p[Math.max(0, i - 1)], B = p[Math.min(p.length - 1, i + 1)];
      let nx = -(B.y - A.y), ny = (B.x - A.x); const len = Math.hypot(nx, ny) || 1; nx /= len; ny /= len;
      const w = (6 + 20 * p[i].s) / 2;
      L.push([p[i].x + nx * w, p[i].y + ny * w]); R.push([p[i].x - nx * w, p[i].y - ny * w]);
    }
    const poly = L.concat(R.reverse()).map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ');
    const centre = p.map((q, i) => (i ? 'L' : 'M') + q.x.toFixed(1) + ',' + q.y.toFixed(1)).join(' ');
    roadSvg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    roadSvg.innerHTML = '<polygon class="band" points="' + poly + '"/><path class="centre" d="' + centre + '"/>';
  }
  // Each pass takes as many events as it has room for, as in September; which ones is no longer
  // a random draw but the World line's rule: heavier first, then the kind scarcest so far.
  function pickRoad() {
    const chosen = [], kinds = {};
    for (const r of road.rows) {
      const px = Math.abs(r.x1 - r.x0), gapPx = 118 * (0.8 + 0.2 * r.s), gapYears = (r.b - r.a) * gapPx / px;
      const capacity = Math.max(1, Math.floor(px / gapPx) - 1);
      const left = LINE.filter(e => e.year >= r.a && e.year <= r.b).sort((p, q) => (q.weight - p.weight) || (p.year - q.year));
      let got = 0;
      while (left.length && got < capacity) {
        let best = 0;
        for (let i = 1; i < left.length && left[i].weight === left[0].weight; i++)
          if ((kinds[left[i].kind] || 0) < (kinds[left[best].kind] || 0)) best = i;
        const e = left.splice(best, 1)[0];
        if (chosen.some(c => Math.abs(c.year - e.year) < gapYears)) continue;
        chosen.push(e); got++; kinds[e.kind] = (kinds[e.kind] || 0) + 1;
      }
    }
    return chosen.sort((p, q) => p.year - q.year);
  }
  function makeRoadEvent(e) {
    const p = posAt(e.year);
    const el = document.createElement('div'); el.className = 'ev';
    const g = 13 + 11 * p.s, f = 9.5 + 3.5 * p.s, stem = 4 + 7 * p.s;
    el.innerHTML = '<span class="glyph" style="width:' + g + 'px;height:' + g + 'px">' + glyphOf(e) + '</span>' +
                   '<span class="short" style="font-size:' + f.toFixed(1) + 'px"></span>' +
                   '<span class="yr" style="font-size:' + (f - 2).toFixed(1) + 'px"></span>' +
                   '<span class="stem" style="height:' + stem + 'px"></span>';
    el.querySelector('.short').textContent = e.label;
    el.querySelector('.yr').textContent = (ABOUT[e.precision] ? 'about ' : '') + fmt(e.year) + ' (' + plain(e.year) + ')';
    el.style.left = Math.min(Math.max(p.x, 62), W - 62) + 'px'; el.style.top = (p.y - (3 + 10 * p.s)) + 'px';
    roadEvents.appendChild(el); return el;
  }
  function roadFor(a, b) {
    buildRoad(a, b); drawRoad();
    roadEvents.innerHTML = '';
    pickRoad().forEach(e => makeRoadEvent(e).classList.add('on'));
  }

  // ---------- the window ----------
  const view = { from: 0, to: NOW };
  let live = false, world = null, pending = 0, pastIce = false, pastIceSaid = false;
  function drawWindow() {
    const a = xOf(view.from), b = xOf(view.to);
    win.style.left = a + 'px'; win.style.width = Math.max(2, b - a) + 'px';
  }
  function apply() {
    pending = 0;
    drawWindow();
    plainEl.textContent = '(' + plain(view.from) + ')';           // before the odometer measures itself
    plainEl.classList.toggle('on', view.to - view.from <= 1000);
    setOdometer(view.from, xOf(view.from));
    roadFor(view.from, view.to);
    if (world && world.span) world.span(view.from, view.to);
    layersFor(view.from, view.to);
  }
  function schedule() { if (!pending) pending = requestAnimationFrame(apply); }

  // Layers by year. When the window lies entirely before year 1 000 the map should show the ice
  // at its last-glacial-maximum outline. No such layer is rendered yet (the pyramid has today's
  // ice and vegetation only), so the map keeps today's ground and says nothing. When the layer
  // exists, map.js will also need a way to swap layers on a live map; it has none today.
  function layersFor(from, to) {
    if (to >= PAST_ICE_BEFORE) return;
    if (!pastIce && !pastIceSaid) { pastIceSaid = true; console.info('After the Ice: no "' + PAST_ICE + '" layer in ' + PYRAMID + '; showing today’s ground.'); }
  }

  // The window's gesture: a pointer on the top line only. Press inside the band to move it;
  // press at either end to move that end. Nothing else on the line answers.
  let drag = null;
  function hitWindow(x, ev) {
    const T = ev.pointerType === 'mouse' ? 8 : 18;
    const a = xOf(view.from), b = xOf(view.to), w = b - a, c = (a + b) / 2;
    const mid = Math.max(w - 2 * Math.min(T, w / 3), 12);
    const m0 = c - mid / 2, m1 = c + mid / 2;
    if (x >= m0 && x <= m1) return 'move';
    if (x < m0 && x >= Math.min(a, m0) - T) return 'from';
    if (x > m1 && x <= Math.max(b, m1) + T) return 'to';
    return null;
  }
  top.addEventListener('pointerdown', ev => {
    if (!live) return;
    const r = top.getBoundingClientRect(), x = ev.clientX - r.left;
    const what = hitWindow(x, ev);
    if (!what) return;
    ev.preventDefault();
    try { top.setPointerCapture(ev.pointerId); } catch (e) {}
    drag = { id: ev.pointerId, what, x0: x, from0: view.from, to0: view.to };
    top.classList.add('dragging');
  });
  top.addEventListener('pointermove', ev => {
    if (!drag || ev.pointerId !== drag.id) return;
    const r = top.getBoundingClientRect(), dy = yOf(ev.clientX - r.left - drag.x0);
    if (drag.what === 'move') {
      const span = drag.to0 - drag.from0;
      view.from = Math.max(0, Math.min(NOW - span, drag.from0 + dy)); view.to = view.from + span;
    } else if (drag.what === 'from') {
      view.from = Math.max(0, Math.min(drag.to0 - MIN_SPAN, drag.from0 + dy));
    } else {
      view.to = Math.min(NOW, Math.max(drag.from0 + MIN_SPAN, drag.to0 + dy));
    }
    schedule();
  });
  function release(ev) { if (drag && ev.pointerId === drag.id) { drag = null; top.classList.remove('dragging'); } }
  top.addEventListener('pointerup', release);
  top.addEventListener('pointercancel', release);

  // ---------- her word ----------
  let onlySeen = false;
  function showWord() { seenWord.classList.toggle('on', live && seenOnLine().length > 0); }
  seenWord.addEventListener('click', ev => {
    ev.stopPropagation();
    onlySeen = !onlySeen;
    seenWord.classList.toggle('active', onlySeen);
    if (world && world.only) world.only(onlySeen ? seenOnLine() : null);
  });

  // ---------- the run ----------
  let run = null, raf = 0;
  function yearAt(t) {
    const knee = 0.86, linearPart = 0.93;
    if (t <= knee) return NOW * linearPart * (t / knee);
    const u = (t - knee) / (1 - knee);
    return NOW * (linearPart + (1 - linearPart) * (1 - Math.pow(1 - u, 2.2)));
  }
  function startRun() {
    measure(); buildRoad(0, NOW); drawRoad(); roadEvents.innerHTML = '';
    run = { start: performance.now(), events: pickRoad(), shown: new Set() };
    layoutDiamonds(-1);
    hint.textContent = 'tap to stop';
    if (reduced) { finishRun(); return; }
    document.addEventListener('pointerdown', stopRun, true);
    raf = requestAnimationFrame(frame);
  }
  function frame(now) {
    if (!run) return;
    const t = Math.min(1, (now - run.start) / RUN_MS), y = yearAt(t);
    placeRunDots(y); setOdometer(y, xOf(y));
    diamondsEl.querySelectorAll('.diamond:not(.on)').forEach(d => { if (+d.dataset.y <= y) d.classList.add('on'); });
    run.events.forEach(e => { if (e.year <= y && !run.shown.has(e.id)) { run.shown.add(e.id); const el = makeRoadEvent(e); requestAnimationFrame(() => el.classList.add('on')); } });
    if (t < 1) raf = requestAnimationFrame(frame); else finishRun();
  }
  function placeRunDots(y) {
    dot.style.left = xOf(y) + 'px';
    const p = posAt(y);
    roadDot.style.left = p.x + 'px'; roadDot.style.top = p.y + 'px';
    roadDot.style.transform = 'translate(-50%,-50%) scale(' + (0.55 + 0.45 * p.s).toFixed(2) + ')';
  }
  function stopRun(ev) { if (ev) { ev.stopPropagation(); ev.preventDefault(); } finishRun(); }
  function finishRun() {
    if (live) return;
    cancelAnimationFrame(raf);
    document.removeEventListener('pointerdown', stopRun, true);
    run = null;
    layoutDiamonds(NOW);
    dot.classList.add('gone'); roadDot.classList.add('gone');
    // the window appears over the whole span, and the lines are hers
    view.from = 0; view.to = NOW; live = true;
    top.classList.add('live'); win.classList.add('on');
    worldHost.classList.remove('waiting');
    hint.textContent = 'drag the band, or either end of it';
    apply(); showWord();
  }

  // ---------- sizing ----------
  function measure() { lineW = top.clientWidth; W = roadEl.clientWidth; H = roadEl.clientHeight; }
  function relayout() {
    measure(); layoutTicks();
    if (!LINE.length) return;
    if (run) { buildRoad(0, NOW); drawRoad(); return; }
    layoutDiamonds(live ? NOW : -1);
    if (live) apply();
  }
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(relayout, 120); });

  // ---------- load ----------
  buildOdometer(); measure(); layoutTicks(); setOdometer(0, 0);
  const get = u => fetch(u, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(u + ' ' + r.status); return r.json(); });
  Promise.all([get('../stories/after-the-ice-events.json'), get('../stories/world-events.json'), get('../stories/places.json')])
    .then(([own, shared, book]) => {
      merge(own, shared.events || {}, book.places || {});
      world = cwWorld(worldHost, {
        from: 0, to: NOW,
        region: PYRAMID, moving: true, reset: 'reset',
        fit: { west: -180, south: -58, east: 180, north: 78 },          // the whole world
        windowed: true,
        line: { rows: 3, ladder: true, stretch: true, yearText: fmt },
        places: PLACES, events: LINE,
        hint: 'Tap a date or a place.',
        onPick: id => { addSeen(id); showWord(); }
      });
      get(PYRAMID).then(j => { pastIce = (j.layers || []).some(L => L.name === PAST_ICE); }).catch(() => {});
      if (OPENING === 'run') startRun(); else finishRun();
    })
    .catch(err => { hint.textContent = 'could not load the events (' + err.message + ')'; console.error(err); });
})();
</script>
</body>
</html>
