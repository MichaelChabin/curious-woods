<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>The Earth in squares — Curious Woods</title>
<!-- The window (step 7 of the Earth bench, rebuilt 2 Nov 2026 to Michael's prompt Prompt-Build-Earth-Bench-07b.md and
     the design Worknote-Deep-Time-Window-03.md; the first build of 1 Nov followed 07 and revision 2): a page in front
     of the Earth bench that introduces a way of picking a time or a range. A stained-glass window where each square
     is a stretch of time, centred over the bench's own timeline; Next at the bottom right opens
     experiments/earth-3d.html as it is. Three windows, one shown at a time, chosen under Select years in the left
     column, the one in use in copper: 4.6 billion (a square a million years, 100 a block, a row a billion, four full
     rows and a fifth of 600; the thirteen periods of revision 3, revision 1's twelve colours as the mockup
     mock-window-dark-03.png has them and a pale ice colour for the last three squares), Last million (a square 1,000
     years; ice age against warm spell from stories/curves/sea-level-ice-ages.json, the curve the globe's sea follows,
     two ways for the bench, A two colours and B graded by the sea), Last 12,000 (a square ten years, twelve blocks to
     the year 2000 and a thirteenth with a square for each decade that has begun, worked out from the date; plain
     glass). Past at the top left, time down each column of ten and then right; near-black lines between the squares,
     the silver came between blocks, a gap between rows, a gold square at now, no squares for time that hasn't
     happened; the years on the right in small type (each row's end on the 4.6 billion window, each block's end on
     the others, the 12,000 counting years after the ice); one line of explanation above. Events from
     stories/deep-time-events.json as single squares backlit in a brighter version of their own colour; the label
     under the cursor says ago (the ordinary decade too on the 12,000). With Periods on, rolling over a period lights
     it, the rest dims gently, and a white box with a pointer line appears below it with its words, one at a time,
     kept inside the window (by finger, while it is down); with Periods off the lighting stays and no box. The chosen
     span is lit as an event is lit, its events in their own colour, nothing greyed at rest (Michael, 1 Nov). The
     timeline below is the Earth bench's stretching line with its two copper flags, copied from
     experiments/earth-3d.html (not moved into js/: see the report), drawn past-left; the flags show their years on
     the outside (at an end with no room: tucked inside, or a margin at each end, a bench switch), a narrow copper
     line between them with the span written on it; stretch, shrink and back to its right; shrink fills in on both
     sides, now a wall, the window stepping up a scale when the span outgrows it. Dragging across squares sets the
     line; the flags, stretch, shrink and back move the lit squares. Every size, colour, line and word is in the
     tables LOOK, WORDS and PERIODS at the top of the script, so a change is one line. -->
<script src="../js/cw-style.js?v=2026-10-27b"></script>
<script src="../js/cw-time.js?v=2026-10-19"></script>
<script src="../js/cw-panel.js?v=2026-10-01b"></script>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; }
  body {
    background: var(--cw-parchment, #f4f1e8); color: var(--cw-ink, #2a241c);
    font-family: var(--cw-font, Georgia, serif); font-size: 17px; line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: 28px; padding-bottom: 48px;
  }
  .wide { max-width: 1180px; margin: 0 auto; }
  h1 { font-weight: normal; font-size: 1.5rem; line-height: 1.2; margin: 0 0 10px; letter-spacing: 0.01em; text-wrap: balance; }
  /* the left column, the house convention: How this works, bulleted words in normal type, italic commands under them */
  .bench { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 18px 24px; align-items: start; }
  .left { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .word {
    background: none; border: 0; padding: 2px 0; color: var(--cw-payne, #546A80); font: inherit; cursor: pointer;
    border-bottom: 1px solid transparent; text-align: left; transition: opacity 300ms ease-in-out;
  }
  .word:hover { color: var(--cw-payne-hover, #3D3D3A); }
  .word:focus-visible { outline: 2px solid var(--cw-copper, #b5652b); outline-offset: 3px; }
  .word.absent { opacity: 0; pointer-events: none; }
  .word[aria-pressed="true"] { color: var(--cw-ink, #2a241c); border-bottom-color: var(--cw-copper, #b5652b); }
  .items { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .items li { position: relative; padding-left: 14px; font-size: 15px; }
  .items li::before { content: '\2022'; position: absolute; left: 0; color: var(--cw-payne, #546A80); }
  .items .head { display: block; color: var(--cw-ink, #2a241c); }
  .items .subs { display: flex; flex-direction: column; gap: 1px; align-items: flex-start; padding-left: 12px; margin-top: 3px; }
  .items .word { font-size: 15px; border-bottom: 0; }
  .cmd { font-style: italic; }
  .cmd[aria-pressed="true"] { color: var(--cw-copper, #b5652b); border-bottom-color: transparent; }   /* the scale in use: copper */
  /* the window, centred over the timeline: the explanation, the glass, the line, the words to the right of the line */
  .main { display: grid; grid-template-columns: minmax(0, 1fr) 118px; column-gap: 14px; align-items: start; min-width: 0; }
  .explain { grid-column: 1; grid-row: 1; margin: 0 0 8px; font-size: 15px; line-height: 1.4; color: var(--cw-ink-soft, #6b655a); }
  /* nothing on the window selects as text: a drag that starts in the came or runs past the glass must never start a
     selection, whose highlight would wash over the canvas and hide the colours (Michael, 1 Nov) */
  .glass-box { grid-column: 1; grid-row: 2; position: relative; min-width: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas.glass { display: block; width: 100%; cursor: crosshair; touch-action: none; }
  .cursor-label { position: absolute; z-index: 7; pointer-events: none; font-size: 12px; line-height: 1.3; color: var(--cw-ink, #2a241c);
                  background: rgba(244,241,232,0.94); border: 0.5px solid #c8b89a; border-radius: 4px; padding: 2px 7px; white-space: nowrap; display: none; }
  /* the period box: white, legible, below the period, a pointer line up to it; one at a time, inside the window */
  .pbox { position: absolute; z-index: 6; display: none; background: #fff; color: var(--cw-ink, #2a241c); border: 0.5px solid #b9b2a3; border-radius: 3px;
          padding: 7px 11px 8px; font-size: 14px; line-height: 1.45; box-shadow: 0 2px 10px rgba(42,38,32,0.16); pointer-events: none; box-sizing: border-box; }
  .pbox.up { display: block; }
  .pbox .head { display: block; font-size: 12px; color: var(--cw-grey-word, #7d7a72); margin-bottom: 1px; }
  .pline { position: absolute; z-index: 6; display: none; width: 0; border-left: 1px solid #3a3530; pointer-events: none; }
  .pline.up { display: block; }
  /* the timeline: the Earth bench's age row (6c, 6d), its words stacked to the right */
  .track-col { grid-column: 1; grid-row: 3; margin: 14px 0 0; }
  .stretch-words { grid-column: 2; grid-row: 3; padding-top: 36px; display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
  .stretch-words .word { font-size: 15px; font-style: italic; }
  .stretch-track { position: relative; height: 62px; touch-action: none; cursor: default; user-select: none; -webkit-user-select: none; }
  .stretch-line { position: absolute; left: 0; right: 0; top: 45px; height: 2px; background: var(--cw-grey, #9a958b); border-radius: 1px; }
  .span-line { position: absolute; top: 44.5px; height: 3px; background: var(--cw-copper, #b5652b); pointer-events: none; display: none; }
  .span-word { position: absolute; top: 39px; line-height: 14px; font-size: 12px; color: var(--cw-ink, #2a241c); background: var(--cw-parchment, #f4f1e8); padding: 0 4px;
               white-space: nowrap; font-variant-numeric: tabular-nums; pointer-events: none; display: none; }
  .span-word.above { top: 1px; background: none; padding: 0; }
  .flag { position: absolute; top: 18px; width: 2px; height: 30px; margin-left: -1px; background: var(--cw-copper, #b5652b); cursor: ew-resize; }
  .flag::before { content: ""; position: absolute; top: 0; width: 13px; height: 9px; background: var(--cw-copper, #b5652b); opacity: .9; }
  .flag::after { content: ""; position: absolute; top: -8px; bottom: -8px; left: -11px; right: -11px; }   /* room for a finger */
  .flag.a::before { left: 2px; border-radius: 0 3px 3px 0; }
  .flag.b::before { right: 2px; border-radius: 3px 0 0 3px; }
  .flag-label { position: absolute; top: 15px; line-height: 14px; font-size: 12px; color: var(--cw-grey-word, #7d7a72); font-variant-numeric: tabular-nums; white-space: nowrap; pointer-events: none; display: none; }
  .stretch-under { display: flex; justify-content: center; gap: 12px; font-size: 12px; color: var(--cw-grey-word, #7d7a72); margin-top: 0; font-variant-numeric: tabular-nums; }
  .next-row { display: flex; justify-content: flex-end; margin: 36px 0 0; }
  .next-row .word { font-style: italic; text-decoration: none; }
  .cw-info-panel .panel-text { font-size: 13px; line-height: 1.5; color: var(--cw-ink, #2a241c); }
  .cw-info-panel .panel-text p { margin: 0 0 8px; }
  .cw-info-panel .panel-text i { color: var(--cw-copper, #b5652b); }
  .cw-info-panel .panel-text .ph { color: var(--cw-grey-word, #7d7a72); }
  .cw-info-panel .bench-words { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; margin-top: 10px; padding-top: 8px; border-top: 1px solid #e0d8c6; }
  .cw-info-panel .bench-words .label { font-size: 11px; color: var(--cw-grey-word, #7d7a72); font-style: italic; }
  .cw-info-panel .bench-words .pair { display: flex; gap: 10px; align-items: baseline; font-size: 13px; }
  .cw-info-panel .bench-words .pair .what { font-size: 12px; color: #7d7a72; }
  .cw-info-panel .bench-words .word { font-size: 13px; }
  .cw-info-panel .bench-words .slash { color: var(--cw-grey, #9a958b); }
  .cw-info-panel .bench-words .readout { font-size: 11px; color: var(--cw-grey-word, #7d7a72); margin: 4px 0 0; line-height: 1.4; white-space: pre-line; }
  #fail { color: var(--cw-vermilion, #c84830); display: none; margin: 12px 0 0; white-space: pre-wrap; font-size: 13px; }
  @media (max-width: 760px) {
    .bench { grid-template-columns: 1fr; gap: 12px; }
    .left { flex-direction: row; flex-wrap: wrap; gap: 6px 22px; align-items: baseline; }
    .left h1 { width: 100%; margin-bottom: 2px; }
    .items { flex-direction: row; gap: 4px 24px; }
    .items .subs { flex-direction: row; flex-wrap: wrap; gap: 1px 14px; }
    .main { grid-template-columns: minmax(0, 1fr) 86px; column-gap: 10px; }
  }
</style>

<body>
<div class="wide">
  <div class="bench">
    <div class="left" id="words">
      <h1 id="title">The Earth in squares</h1>
      <button class="word" id="wHtw" type="button" aria-pressed="false">How this works</button>
      <ul class="items">
        <li><span class="head" id="hSelect">Select years</span><div class="subs" id="scales"></div></li>
        <li><span class="head" id="hInfo">Information</span><div class="subs"><button class="word cmd" id="wPeriods" type="button">Hide periods</button><button class="word cmd" id="wCities" type="button">Cities</button></div></li>
      </ul>
    </div>
    <div class="main">
      <p class="explain" id="explain"></p>
      <div class="glass-box" id="glassBox"><canvas class="glass" id="glass" aria-label="A stained-glass window of time: each square a stretch of time, the past at the top left"></canvas><div class="cursor-label" id="cursorLabel"></div><div class="pline" id="pline"></div><div class="pbox" id="pbox"></div></div>
      <div class="track-col">
        <div class="stretch-track" id="stretchTrack" aria-label="The timeline: a line from the Earth’s birth to today, which she can stretch and shrink"><div class="stretch-line" id="stretchLine"></div><div class="span-line" id="spanLine"></div><div class="flag a" id="flagA" title="drag in"></div><div class="flag b" id="flagB" title="drag in"></div><span class="flag-label" id="labelA"></span><span class="flag-label" id="labelB"></span><span class="span-word" id="spanWord"></span></div>
        <div class="stretch-under"><span class="pixel" id="pixelLine"></span></div>
      </div>
      <div class="stretch-words"><button class="word absent" id="wStretch" type="button">stretch</button><button class="word absent" id="wShrink" type="button">shrink</button><button class="word absent" id="wBack" type="button">back</button></div>
    </div>

<!-- the bench's own words (moved into the How this works panel by the script) -->
<div id="benchWords" class="bench-words" style="display:none">
  <span class="label">for the bench</span>
  <div class="pair"><span class="what">the last million:</span><button class="word" id="wGlassA" type="button" aria-pressed="true">A two colours</button><span class="slash">/</span><button class="word" id="wGlassB" type="button" aria-pressed="false">B graded</button></div>
  <div class="pair"><span class="what">a flag at the end:</span><button class="word" id="wEndsInside" type="button" aria-pressed="true">year inside</button><span class="slash">/</span><button class="word" id="wEndsMargin" type="button" aria-pressed="false">a margin</button></div>
  <p class="readout" id="readout"></p>
</div>

<script>
  const CW_VERSION = '2026-11-02 f184e34 · earth-3d-window step 7b';   // date + short commit hash; bump in the same commit as any change
  console.log('earth-3d-window', CW_VERSION);
  const $ = id => document.getElementById(id);
  const S = window.CW && window.CW.STYLE;
  if (!S) { $('fail').style.display = 'block'; $('fail').textContent = 'cw-style.js did not load: this page has no colours.'; throw new Error('cw-style.js missing'); }
  const Q = new URLSearchParams(location.search);
  const THIS_YEAR = CW.THIS_YEAR, ICE_YEAR = -10000;   // the ice let go: year 0 after the ice is the store's −10000; this year is 12,026 after the ice
  const EARTH_AGE = 4567;   // million years: the line's far end, as the bench's
  const fmt = n => n.toLocaleString('en');

  // ======== THE TABLE: sizes, colours, lines and words. A change is one line. ========
  const LOOK = {
    came: '#949ca0',          // the silver came between blocks and round each row (the mockup's; the first build's was #b9c0c4)
    gapBlock: 4,              // px of came between blocks
    frame: 3,                 // px of came round a row
    gapRow: 10,               // px between rows (the sketch's was 15)
    rowGapCame: false,        // true: the gap between rows is came too; false: parchment, each row framed
    gapLine: 4,               // px between the lines of a row when a narrow layout wraps its blocks (18 where labels sit under the blocks)
    line: '#141416',          // the near-black lines between the small squares
    lineW: 1, lineWSmall: 0.6, smallBelow: 6,   // the lines' width; the thinner one under squares of fewer px than smallBelow
    gold: '#e2b33a',          // the square that holds now, filled
    gutter: 78,               // px on the right for the years
    labelFont: '12px',        // the years on the right, and under the blocks
    shadeL: 0.07, shadeS: 0.06,   // handmade glass: each square's lightness and saturation wander by this much
    gradient: 0.10,           // a gentle run of lightness along each period, darker at its old end
    backlitL: 0.22, backlitS: 0.18, goldMix: 0.75,   // an event: brighter than its own colour; a pale square goes toward gold instead
    lift: 0.06,               // the period under the cursor is lifted by this much lightness
    dimRest: 0.12,            // with Periods, the rest of the window dims gently by this much toward the parchment (0: nothing dims — Michael's rule of 1 Nov)
    boxWidth: 420, boxPointer: 14,   // the period box: its widest, and the pointer line's length
    plain: '#c4bfae', clear: '#e6e8e4',   // plain glass (the 12,000 window: a pale stone, so the gold square at now shows; the first build's tan #c8b48c hid it); clear glass is unused now that no window has a future
    ice: '#93adb9', warm: '#7fa86a',      // the last million, A: two colours
    iceDeep: '#7a9cad', icePale: '#e6eef1',   // B: the ice at the threshold, the palest at the lowest sea
    threshold: -20, seaLow: -130,   // metres: the sea at or above the threshold is a warm spell (−20 m shows all eleven interglacials; see the report)
    endMargin: 136,           // px at each end of the line when a flag's year sits in a margin (the bench switch)
    glideMs: 380
  };
  const WORDS = {
    scales: ['4.6 billion', 'Last million', 'Last 12,000'],
    explain: [
      '4.6 billion years. Each small square is a million years. Each large square is 100 million. Each row is a billion.',
      'The last million years. Each small square is 1,000 years. Each large square is 100,000.',
      'The last 12,000 years. Each small square is ten years. Each large square is 1,000.'
    ],
    periods: ['Periods', 'Hide periods'], cities: ['Cities', 'Hide cities'],
    now: 'now', notYet: 'not yet'
  };
  // The thirteen periods of the 4.6 billion window (Worknote-Deep-Time-Window-03, its table): the span counted forward
  // from the Earth's start in million years, the colour (revision 1's twelve as the mockup has them, and a pale ice for
  // the last three squares), and the box's words — a table that can hold several texts per period, shown shuffled.
  const PERIODS = [
    { from: 0, to: 200, c: '#b75027', t: ['The solar system comes together. Something the size of Mars hits the young Earth, and the Moon forms from the splash.'] },
    { from: 200, to: 700, c: '#1e3b47', t: ['Small, dark, volcanic continents under constant rain that fills the seas.'] },
    { from: 700, to: 2150, c: '#c39444', t: ['Microscopic life, perhaps under a hazy orange sky. The air has no oxygen.'] },
    { from: 2150, to: 2400, c: '#8daec1', t: ['Bacteria begin to release oxygen. It probably destroyed the methane that kept the Earth warm, and ice spread almost to the equator.'] },
    { from: 2400, to: 2800, c: '#8f3321', t: ['Oxygen builds up and turns an ocean full of iron to rust.'] },
    { from: 2800, to: 3880, c: '#2a5c8c', t: ['Some cells need two parents, others form colonies, while continents grow larger.'] },
    { from: 3880, to: 3965, c: '#c2dae5', t: ['Ice reaches the equator, twice. The first animals may date from these frozen years.'] },
    { from: 3965, to: 4061, c: '#21848c', t: ['The first living things big enough to see.'] },
    { from: 4061, to: 4130, c: '#163d87', t: ['Animals with eyes and shells fill the seas.'] },
    { from: 4130, to: 4348, c: '#2b763f', t: ['Plants and animals come to land.'] },
    { from: 4348, to: 4534, c: '#a6c24a', t: ['Dinosaurs rule the land, and one great continent slowly breaks apart.'] },
    { from: 4534, to: 4597, c: '#cb7d22', t: ['After the asteroid, mammals spread everywhere, and grass covers the plains.'] },
    { from: 4597, to: 4600, c: '#dbe6ec', t: ['Ice sheets come and go. Everyone who has ever lived is in the last square.'] }
  ];
  // the two kinds of glass of the last million window (placeholder words for Michael)
  const ICE = { n: 'Ice age', c: LOOK.ice, t: ['Sheets of ice cover much of the north, and the sea is low enough to walk to some islands.'] };
  const WARM = { n: 'Warm spell', c: LOOK.warm, t: ['Warm, like now. Forests grow where the ice was.'] };
  // ======== end of the table ========

  // ---------- colours ----------
  const hex2rgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const rgbStr = c => 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  function rgb2hsl(c) {
    const r = c[0] / 255, g = c[1] / 255, b = c[2] / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
    if (mx === mn) return [0, 0, l];
    const d = mx - mn, s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    let h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [h / 6, s, l];
  }
  function hsl2rgb(c) {
    const [h, s, l] = c; if (s === 0) return [l * 255, l * 255, l * 255];
    const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
    const f = t => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 1 / 2 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
    return [f(h + 1 / 3) * 255, f(h) * 255, f(h - 1 / 3) * 255];
  }
  const shade = (c, dl, ds) => { const h = rgb2hsl(c); h[2] = Math.max(0, Math.min(1, h[2] + dl)); h[1] = Math.max(0, Math.min(1, h[1] + (ds || 0))); return hsl2rgb(h); };
  const backlit = c => { const l = rgb2hsl(c)[2]; return l > 0.68 ? mix(c, hex2rgb('#f0c84a'), LOOK.goldMix) : shade(c, LOOK.backlitL, LOOK.backlitS); };
  const hash = (i, k) => { let h = (i * 2654435761 + k * 40503 + 12345) >>> 0; h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995) >>> 0; h ^= h >>> 15; return (h % 10000) / 10000; };
  const CAME = hex2rgb(LOOK.came), CLEAR = hex2rgb(LOOK.clear), PARCH = hex2rgb(S.parchment || '#f4f1e8'), PLAIN = hex2rgb(LOOK.plain);
  const ICE_DEEP = hex2rgb(LOOK.iceDeep), ICE_PALE = hex2rgb(LOOK.icePale);
  const WARM_THRESHOLD_M = Q.get('thr') ? +Q.get('thr') : LOOK.threshold;
  let glassMode = Q.get('glass') === 'B' ? 'B' : 'A';   // bench only: the last million two ways
  let ENDS = Q.get('ends') === 'margin' ? 'margin' : 'inside';   // bench only: a flag's year at the end of the line

  // ---------- the three windows ----------
  // Each: the squares (100 a block, 10 columns of 10; time down each column and then right), the blocks in a row, the
  // rows, and the time of square i as its older and newer edges in million years ago (ma, the line's unit).
  const DECADES_BEGUN = Math.floor((THIS_YEAR - 2000) / 10) + 1;   // the thirteenth block of the 12,000 window: the 2000s, 2010s, 2020s in 2026
  const WINDOWS = [
    { id: 'w0', blocks: 10, rows: 5, unitMa: 1, startMa: 4600, squares: 4600,
      rowLabel: k => k < 4 ? (k + 1) + ' billion' : '4.6 billion',

    let lL = inL ? xL + PENNANT + LABEL_PAD : Math.max(0, xL - LABEL_PAD - wL);
    if (inL && !inR && lR < lL + wL + LABEL_GAP) lR = lL + wL + LABEL_GAP;

  function yearsWord(y) {

  }
  const endStep = () => STR.b - STR.a >= 1 ? Math.min(pixelStep(), 1e5) : 1;   // the line's own ends are exact (12,026 years, 3,476.3 million), not rounded to the pixel

  }
  const present = (el, on) => el.classList.toggle('absent', !on);
  function renderStretch() {

  }
  function resetFlags() { STR.flags = [STR.a, STR.b]; }
  function glideStretch(a1, b1) {
    const a0 = STR.a, b0 = STR.b, f0 = STR.flags.slice(), t0 = performance.now(), T = LOOK.glideMs;
    if (STR.anim) cancelAnimationFrame(STR.anim);

    const step = now => {
      const u = Math.min(1, (now - t0) / T), s = u * u * (3 - 2 * u);

  }
  function finishStretch() {   // bench only: the glide finished at once, for a browser pane that runs frames only while looked at

  }
  const YEARS_PER_PX_LEAST = 1;
  function doStretch() {
    if (STR.anim || !flagsMoved()) return;

    let least = (trackW() - 2 * margin()) * dpr() * YEARS_PER_PX_LEAST / 1e6;
    if (STR.b - STR.a < least) least = 0;   // a line already finer than a year a pixel (a span from the window) stretches on: a stretch never makes the line longer
    if (b1 - a1 < least) { const c = (a1 + b1) / 2; a1 = Math.max(0, c - least / 2); b1 = Math.min(EARTH_AGE, a1 + least); }
    if (Math.abs(a1 - STR.a) < 1e-12 && Math.abs(b1 - STR.b) < 1e-12) { resetFlags(); renderStretch(); return; }
    STR.stack.push([STR.a, STR.b]);

  }
  // shrink (Worknote-Deep-Time-Window-03): the timeline fills in on either side of the flags with years in proportion

  function doShrink() {

  }

  let sPtr = null;
  track.addEventListener('pointerdown', e => {

  track.addEventListener('pointerup', sUp); track.addEventListener('pointercancel', sUp);
  $('wStretch').addEventListener('click', doStretch);
  $('wShrink').addEventListener('click', doShrink);
  $('wBack').addEventListener('click', stretchBack);

  // ---------- the left column: How this works, Periods, Cities ----------
  const htwPanel = window.CW.createInfoPanel ? CW.createInfoPanel({ width: 344 }) : null;
  if (htwPanel) {
    document.body.appendChild(htwPanel.el); htwPanel.el.style.zIndex = '600'; htwPanel.el.style.cursor = 'default'; htwPanel.el.classList.add('cw-info-panel');
    htwPanel.body.innerHTML = '<div class="panel-text">' +
      '<p class="ph">[Placeholder words. Michael will write these.]</p>' +
      '<p>Every square in the window is a stretch of time, and the past is at the top left. On the first window a square is a million years and a row is a billion; the gold square is now. Under <i>Select years</i>, the three words change the scale: a thousand years a square, then ten.</p>' +
      '<p>Drag across squares to pick a span, and the line below stretches to it. On the line, drag the two flags in and tap <i>stretch</i> to look closer, or <i>shrink</i> to see more; <i>back</i> steps out. The lit squares always show where the line is. With <i>Periods</i> on, a box under the cursor says what the Earth was like then.</p>' +
      '</div>';
    const bw = $('benchWords'); bw.style.display = ''; htwPanel.body.appendChild(bw);
  }
  function placePanel(pn) { const r = $('glassBox').getBoundingClientRect(), w = pn.el.offsetWidth || 344; if (!pn.userMoved()) pn.setPosition(Math.max(8, Math.min(window.innerWidth - w - 16, r.left + 16)), Math.max(8, r.top + 16)); }
  function togglePanel(pn, wordEl) {

  $('wHtw').addEventListener('click', () => togglePanel(htwPanel, $('wHtw')));
  if (htwPanel) htwPanel.el.querySelector('span').addEventListener('click', () => $('wHtw').setAttribute('aria-pressed', 'false'));
  // Periods / Hide periods: the word renames, the Glass Geometry way. With Periods off the lighting stays and the box doesn't appear.
  function setPeriods(on) { state.periods = on; $('wPeriods').textContent = WORDS.periods[on ? 1 : 0]; if (!on) hideBox(); else if (state.hover >= 0) showBox(state.hover); draw(); }
  $('wPeriods').addEventListener('click', () => setPeriods(!state.periods));
  // Cities / Hide cities: the words only; nothing on this page yet (the globe shows cities)

  $('wCities').addEventListener('click', () => setCities(!state.cities));

  $('wEndsInside').addEventListener('click', () => setEnds('inside')); $('wEndsMargin').addEventListener('click', () => setEnds('margin'));

  // ---------- the data, then the first drawing ----------
