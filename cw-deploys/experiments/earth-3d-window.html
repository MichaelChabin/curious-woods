<title>The Earth in squares — Curious Woods</title>
<!-- The window (step 7 of the Earth bench; Michael's prompt Prompt-Build-Earth-Bench-07.md, 1 Nov 2026; the design
     Worknote-Deep-Time-Window-02.md): a page in front of the Earth bench that introduces a way of picking a time or a
     range. A stained-glass window where each square is a stretch of time, over the bench's own timeline; Next at the
     bottom right opens experiments/earth-3d.html as it is. Four windows, one shown at a time, chosen by four italic
     commands to the left of the glass, the one in use in copper: 4.6 billion years (a square a million years, 5,000
     squares in five rows of ten blocks, 4,600 of them past and the rest of the fifth row clear future glass, the twelve
     eras coloured by what she would have seen, their plaques); the last million years (1,000 squares of 1,000 years, ice
     age against warm spell from stories/curves/sea-level-ice-ages.json, the curve the globe's sea follows, two ways for
     the bench — A two colours, B graded by the sea; the plaques Ice age, Warm spell, and from 130,000 years the periods
     Hippos in London, Ice sheets, After the ice); the last 100,000 years (1,000 squares of 100 years, graded like B; Ice
     sheets, After the ice); the last 12,000 years (10-year squares counted from year 0 after the ice, twelve blocks to
     the year 12,000 and a thirteenth holding now, 12,026, the rest of it clear; plain glass, no plaques yet). Past at
     the top left, future to the right, time running down each column of ten and then right; the silver came, 2 points
     between blocks and 5 between rows; handmade-glass shading; a thin gold mark at now; events from
     stories/deep-time-events.json as single squares backlit in a brighter version of their own colour; a label under
     the cursor saying "ago" (and the ordinary decade on the 12,000 window); plaques on rollover (by finger, while it is
     down), below the glass, ivory with a fine border and a stripe of the era's colour, the era lit and the rest gently
     dimmed. The timeline below is the Earth bench's own stretching line with its two copper flags, stretch and back,
     copied from experiments/earth-3d.html (not moved into js/: see the report), drawn past-left so it runs the way the
     window does, with shrink added: the whole line as it stands fits between the flags, new time coming in on both
     sides, now a wall, the window stepping up a scale when the span outgrows it. Dragging across squares sets the line
     to that span with the usual glide; the flags, stretch, shrink and back move the lit squares. The left column is
     Glass Geometry's convention: How this works (a text box, placeholder words), bulleted words in normal type for the
     tools (Window, Timeline), italic words for commands. -->

<style>
  :root { color-scheme: light; }
  html, body { margin: 0; }
  body {
    background: var(--cw-parchment, #f4f1e8); color: var(--cw-ink, #2a241c);
    font-family: var(--cw-font, Georgia, serif); font-size: 17px; line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: 28px; padding-bottom: 48px;
  }
  .wide { max-width: 1180px; margin: 0 auto; }
  h1 { font-weight: normal; font-size: 1.5rem; line-height: 1.2; margin: 0 0 10px; letter-spacing: 0.01em; text-wrap: balance; }
  /* the left column, Glass Geometry's convention: How this works, bulleted items in normal type, italic commands */
  .bench { display: grid; grid-template-columns: 160px 1fr; gap: 18px 24px; align-items: start; }
  .left { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .word {
    background: none; border: 0; padding: 2px 0; color: var(--cw-payne, #546A80); font: inherit; cursor: pointer;
    border-bottom: 1px solid transparent; text-align: left; transition: opacity 300ms ease-in-out;
  }
  .word:hover { color: var(--cw-payne-hover, #3D3D3A); }
  .word:focus-visible { outline: 2px solid var(--cw-copper, #b5652b); outline-offset: 3px; }
  .word.absent { opacity: 0; pointer-events: none; }
  .word[aria-pressed="true"] { color: var(--cw-ink, #2a241c); border-bottom-color: var(--cw-copper, #b5652b); }
  .items { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .items li { position: relative; padding-left: 14px; font-size: 15px; }
  .items li::before { content: '\2022'; position: absolute; left: 0; color: var(--cw-payne, #546A80); }
  .items .word { font-size: 15px; border-bottom: 0; }
  .items .word[aria-pressed="true"] { color: var(--cw-payne-hover, #3D3D3A); }
  .cmd { font-style: italic; }
  .cmd[aria-pressed="true"] { color: var(--cw-copper, #b5652b); border-bottom-color: transparent; }
  /* the window: the four scales to its left, the glass, the plaque under it */
  .main { min-width: 0; }
  .window-row { display: grid; grid-template-columns: 150px 1fr; gap: 0 16px; align-items: start; }
  .scales { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; padding-top: 2px; }
  .scales .cmd { font-size: 15px; white-space: nowrap; }
  .glass-box { position: relative; min-width: 0; }
  canvas.glass { display: block; width: 100%; cursor: crosshair; touch-action: none; }
  .cursor-label { position: absolute; z-index: 5; pointer-events: none; font-size: 12px; line-height: 1.3; color: var(--cw-ink, #2a241c);
                  background: rgba(244,241,232,0.94); border: 0.5px solid #c8b89a; border-radius: 4px; padding: 2px 7px; white-space: nowrap; display: none; }
  .plaque-slot { min-height: 74px; margin: 10px 0 0; }

  .plaque.up { display: block; }
  .plaque::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; border-radius: 4px 0 0 4px; background: var(--stripe, #999); }
  .plaque b { font-weight: normal; color: var(--cw-ink, #2a241c); display: block; margin-bottom: 1px; }
  .plaque span { color: var(--cw-ink-soft, #6b655a); }
  /* the timeline: the Earth bench's age row (6c, 6d), its words stacked to the right */
  .age-row { margin: 14px 0 0; display: grid; grid-template-columns: 1fr 118px; column-gap: 14px; align-items: start; }
  .age-row .stretch-words { padding-top: 22px; display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
  .age-row .stretch-words .word { font-size: 15px; font-style: italic; }
  .stretch-track { position: relative; height: 62px; touch-action: none; cursor: default; user-select: none; -webkit-user-select: none; }
  .stretch-line { position: absolute; left: 0; right: 0; top: 45px; height: 2px; background: var(--cw-grey, #9a958b); border-radius: 1px; }
  .flag { position: absolute; top: 18px; width: 2px; height: 30px; margin-left: -1px; background: var(--cw-copper, #b5652b); cursor: ew-resize; }

  .flag::after { content: ""; position: absolute; top: -8px; bottom: -8px; left: -11px; right: -11px; }   /* room for a finger */
  .flag.a::before { left: 2px; border-radius: 0 3px 3px 0; }
  .flag.b::before { right: 2px; border-radius: 3px 0 0 3px; }
  .flag-label { position: absolute; top: 15px; line-height: 14px; font-size: 12px; color: var(--cw-grey-word, #7d7a72); font-variant-numeric: tabular-nums; white-space: nowrap; pointer-events: none; display: none; }
  .flag-label.above { top: 1px; }
  .stretch-under { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--cw-grey-word, #7d7a72); margin-top: 0; font-variant-numeric: tabular-nums; }
  .next-row { display: flex; justify-content: flex-end; margin: 36px 0 0; }
  .next-row .word { font-style: italic; text-decoration: none; }
  .cw-info-panel .panel-text { font-size: 13px; line-height: 1.5; color: var(--cw-ink, #2a241c); }
  .cw-info-panel .panel-text p { margin: 0 0 8px; }
  .cw-info-panel .panel-text i { color: var(--cw-copper, #b5652b); }
  .cw-info-panel .panel-text .ph { color: var(--cw-grey-word, #7d7a72); }
  .cw-info-panel .bench-words { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; margin-top: 10px; padding-top: 8px; border-top: 1px solid #e0d8c6; }
  .cw-info-panel .bench-words .label { font-size: 11px; color: var(--cw-grey-word, #7d7a72); font-style: italic; }
  .cw-info-panel .bench-words .pair { display: flex; gap: 10px; align-items: baseline; font-size: 13px; }
  .cw-info-panel .bench-words .word { font-size: 13px; }
  .cw-info-panel .bench-words .slash { color: var(--cw-grey, #9a958b); }
  .cw-info-panel .bench-words .readout { font-size: 11px; color: var(--cw-grey-word, #7d7a72); margin: 4px 0 0; line-height: 1.4; white-space: pre-line; }
  #fail { color: var(--cw-vermilion, #c84830); display: none; margin: 12px 0 0; white-space: pre-wrap; font-size: 13px; }
  @media (max-width: 760px) {
    .bench { grid-template-columns: 1fr; gap: 12px; }
    .left { flex-direction: row; flex-wrap: wrap; gap: 6px 22px; align-items: baseline; }
    .left h1 { width: 100%; margin-bottom: 2px; }
    .items { flex-direction: row; gap: 4px 18px; }
    .window-row { grid-template-columns: 1fr; gap: 6px 0; }
    .scales { flex-direction: row; flex-wrap: wrap; gap: 2px 16px; }
    .age-row { grid-template-columns: 1fr 86px; column-gap: 10px; }
  }

<body>
<div class="wide">
  <div class="bench">
    <div class="left" id="words">

        <div class="glass-box" id="glassBox"><canvas class="glass" id="glass" aria-label="A stained-glass window of time: each square a stretch of time, the past at the top left"></canvas><div class="cursor-label" id="cursorLabel"></div></div>

          <div class="stretch-track" id="stretchTrack" aria-label="The timeline: a line from the Earth’s birth to today, which she can stretch and shrink"><div class="stretch-line"></div><div class="flag a" id="flagA" title="drag in"></div><div class="flag b" id="flagB" title="drag in"></div><span class="flag-label" id="labelA"></span><span class="flag-label" id="labelB"></span><span class="flag-label" id="labelGap"></span></div>
          <div class="stretch-under"><span id="stretchFrom">4,567 million years ago</span><span class="pixel" id="pixelLine"></span><span id="stretchTo">today</span></div>

<!-- the bench's own words (moved into the How this works panel by the script) -->
<div id="benchWords" class="bench-words" style="display:none">
  <span class="label">for the bench</span>
  <div class="pair"><span style="font-size:12px;color:#7d7a72">the last million:</span><button class="word" id="wGlassA" type="button" aria-pressed="true">A two colours</button><span class="slash">/</span><button class="word" id="wGlassB" type="button" aria-pressed="false">B graded</button></div>
  <p class="readout" id="readout"></p>
</div>

<script>
  const CW_VERSION = '2026-11-01 46f58e8 · earth-3d-window step 7';   // date + short commit hash; bump in the same commit as any change
  console.log('earth-3d-window', CW_VERSION);
  const $ = id => document.getElementById(id);
  const S = window.CW && window.CW.STYLE;
  if (!S) { $('fail').style.display = 'block'; $('fail').textContent = 'cw-style.js did not load: this page has no colours.'; throw new Error('cw-style.js missing'); }
  const Q = new URLSearchParams(location.search);
  const THIS_YEAR = CW.THIS_YEAR, NOW_AI = THIS_YEAR + 10000;   // after-the-ice years: year 0 is the ice letting go, the store's −10000; this year is 12,026
  const EARTH_AGE = 4567;   // million years: the line's far end, as the bench's
  const fmt = n => n.toLocaleString('en');

  // ---------- colours ----------
  const hex2rgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const rgbStr = c => 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  function rgb2hsl(c) {
    const r = c[0] / 255, g = c[1] / 255, b = c[2] / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
    if (mx === mn) return [0, 0, l];
    const d = mx - mn, s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    let h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [h / 6, s, l];
  }
  function hsl2rgb(c) {
    const [h, s, l] = c; if (s === 0) return [l * 255, l * 255, l * 255];
    const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
    const f = t => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 1 / 2 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
    return [f(h + 1 / 3) * 255, f(h) * 255, f(h - 1 / 3) * 255];
  }
  const shade = (c, dl, ds) => { const h = rgb2hsl(c); h[2] = Math.max(0, Math.min(1, h[2] + dl)); h[1] = Math.max(0, Math.min(1, h[1] + (ds || 0))); return hsl2rgb(h); };
  const backlit = c => { const l = rgb2hsl(c)[2]; return l > 0.68 ? mix(c, hex2rgb('#f0c84a'), 0.75) : shade(c, 0.22, 0.18); };   // an event: a brighter version of the square's own colour; a pale square has no brighter, so it goes to gold
  const hash = (i, k) => { let h = (i * 2654435761 + k * 40503 + 12345) >>> 0; h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995) >>> 0; h ^= h >>> 15; return (h % 10000) / 10000; };
  const CAME = hex2rgb('#b9c0c4'), CLEAR = hex2rgb('#e6e8e4'), PARCH = hex2rgb(S.parchment || '#f4f1e8'), GOLD = '#c9a227', PLAIN = hex2rgb('#c8b48c');

  // ---------- the twelve eras of the 4.6 billion window (what she would have seen; the words from the sketch, revision 1's) ----------
  const ERAS = [
    { from: 4600, to: 4400, c: '#d9521f', n: 'Molten', t: 'The Sun has just lit up. Around it, a flat disk of dust and rock is crashing together into lumps, and one of the lumps is the Earth. It glows: its surface is a sea of melted rock. Early on, something the size of Mars hits it, and the splash becomes the Moon.' },
    { from: 4400, to: 3800, c: '#2c4a55', n: 'Dark seas, falling rocks', t: 'The rock has cooled enough for rain. It rains for a very long time, and oceans fill. Big rocks still fall out of the sky now and then.' },
    { from: 3800, to: 2450, c: '#8b7442', n: 'An orange sky', t: 'There are living things now, far too small to see. The air has no oxygen in it, so you couldn’t breathe here, and the sky may have been a hazy orange.' },
    { from: 2450, to: 1800, c: '#9a4529', n: 'Rust', t: 'Tiny living things have started making oxygen, and the air changes. Ice spreads a long way, perhaps nearly to the equator. Oxygen gets into the sea, and the iron dissolved in it rusts. Layers of red rust settle on the sea floor. People mine those layers for iron today.' },
    { from: 1800, to: 720, c: '#4c6c84', n: 'The quiet billion', t: 'Blue seas and bare brown land, and for a very long time not much seems to change. Out of sight, cells are learning to live together.' },
    { from: 720, to: 635, c: '#9fb6c3', n: 'Snowball Earth', t: 'The whole planet freezes, perhaps from pole to pole. It happens twice. Volcanoes slowly warm it up again.' },
    { from: 635, to: 539, c: '#2f80a5', n: 'Soft, strange creatures', t: 'The first living things big enough to see lie on the sea floor, shaped like quilts and feathers. Nothing like them is alive today.' },
    { from: 539, to: 470, c: '#1e66b0', n: 'Eyes and shells', t: 'Animals with eyes, legs and shells fill the sea. The land is still bare rock. Nothing green grows on it yet.' },
    { from: 470, to: 360, c: '#4f9a6a', n: 'Green comes ashore', t: 'Small plants creep onto the land, then bigger ones. By the end there are forests, and a fish has crawled out of the water.' },
    { from: 360, to: 252, c: '#2c6638', n: 'Swamp forests', t: 'Huge swampy forests, and dragonflies bigger than crows. The trees that fall here become the coal people burn today. It ends with the worst die-off the Earth has known.' },
    { from: 252, to: 66, c: '#73a03a', n: 'Dinosaurs', t: 'Dinosaurs take over. One giant continent slowly breaks apart into pieces you would almost recognize.' },
    { from: 66, to: 0, c: '#b8a043', n: 'Mammals, grass and ice', t: 'An asteroid ends the dinosaurs, all but the birds. Mammals spread everywhere, and grass covers the plains. At the very end, ice sheets grow and shrink, over and over. Everyone who has ever lived is in the last square.' }
  ];
  // the two kinds of glass of the ice ages (the plaque words are placeholders for Michael)
  const ICE = { c: '#93adb9', n: 'Ice age', t: 'Sheets of ice cover much of the north, and the sea is low enough to walk to some islands.' };
  const WARM = { c: '#7fa86a', n: 'Warm spell', t: 'Warm, like now. Forests grow where the ice was.' };
  const ICE_DEEP = hex2rgb('#7a9cad'), ICE_PALE = hex2rgb('#e6eef1');   // B: the ice colour at the threshold, the palest at the lowest sea
  // the threshold between the two: the sea at or above this is a warm spell. Set by looking at the repo's curve
  // (Spratt and Lisiecki's stack to 798,000 years, Bintanja and van de Wal beyond): at −20 m every one of the eleven
  // interglacials of the last million years shows; at −5 m only six do, because the stack's older interglacials
  // peak ten to twenty metres below today. See Report-Earth-3D-Bench-07.md.
  const WARM_THRESHOLD_M = Q.get('thr') ? +Q.get('thr') : -20, SEA_LOW_M = -130;
  let glassMode = Q.get('glass') === 'B' ? 'B' : 'A';   // bench only: the last million two ways

  // ---------- the four windows ----------
  // Each: the word, the squares (100 a block, 10 columns of 10; time down each column and then right), the blocks in a
  // row, the rows, and the time of square i as its older and newer edges in million years ago (ma, the line's unit).
  const WINDOWS = [
    { id: 'w0', word: '4.6 billion years', blocks: 10, rows: 5, unitMa: 1, startMa: 4600, squares: 5000, gutter: 60,
      labelsLeft: k => k === 0 ? '0' : k + ' billion', agoWord: i => i === 4599 ? 'the last million years' : fmt(4600 - i) + ' million years ago' },
    { id: 'w1', word: 'The last million years', blocks: 10, rows: 1, unitMa: 0.001, startMa: 1, squares: 1000, gutter: 0,
      labelsUnder: j => j === 0 ? '1 million' : j === 10 ? 'now' : fmt((10 - j) * 100000), agoWord: i => i === 999 ? 'the last 1,000 years' : fmt((1000 - i) * 1000) + ' years ago' },
    { id: 'w2', word: 'The last 100,000 years', blocks: 10, rows: 1, unitMa: 0.0001, startMa: 0.1, squares: 1000, gutter: 0,
      labelsUnder: j => j === 0 ? '100,000' : j === 10 ? 'now' : fmt((10 - j) * 10000), agoWord: i => i === 999 ? 'the last 100 years' : fmt((1000 - i) * 100) + ' years ago' },
    { id: 'w3', word: 'The last 12,000 years', blocks: 13, rows: 1, unitMa: 0.00001, startMa: NOW_AI / 1e6, squares: 1300, gutter: 0,
      labelsUnder: j => j === 0 ? 'year 0 after the ice' : j <= 12 ? fmt(j * 1000) : '', agoWord: i => decadeWord(i) }
  ];
  function decadeWord(i) {   // the 12,000 window: the ordinary decade and how long ago
    const start = 10 * i - 10000, mid = start + 5;   // astronomer's years: 0 is 1 BCE
    if (start + 10 > THIS_YEAR) return 'the ' + start + 's · now';
    const dec = start >= 10 ? 'the ' + start + 's' : start >= 0 ? 'the first years CE' : 'about ' + fmt(-start) + ' BCE';
    return dec + ' · ' + fmt(Math.round((THIS_YEAR - mid) / 10) * 10) + ' years ago';
  }
  WINDOWS.forEach(w => { w.olderMa = i => w.startMa - i * w.unitMa; w.newerMa = i => w.startMa - (i + 1) * w.unitMa; w.real = Math.ceil(w.startMa / w.unitMa - 1e-9); w.spanMa = Math.min(w.startMa, EARTH_AGE); });
  // the periods whose plaques the ice-age windows use (stories/deep-time-periods.json: the label and the first sentence of the summary)
  const PERIOD_PLAQUES = { w1: ['Hippos in London', 'Ice sheets', 'After the ice'], w2: ['Ice sheets', 'After the ice'] };
  const PERIOD_COLOURS = { 'Hippos in London': '#7fa86a', 'Ice sheets': '#93adb9', 'After the ice': '#7fa86a' };

  let periods = null, events = [], sea = null;   // loaded below
  const seaAt = year => sea ? CW.curveAt(sea.points, year) : null;

  // ---------- building a window's glass ----------
  // For each square: its kind (era, ice run, period, plain, clear), its colour (the era's, graded along the era; the ice
  // by the sea; handmade shading by a hash), its events. Built once per window and glass mode, drawn many times.
  function build(w) {
    const n = w.squares, col = new Array(n), kind = new Array(n), lit = new Array(n), ev = new Array(n);
    const plaques = [];   // one per era/run/period, by kind index
    const addPlaque = p => { plaques.push(p); return plaques.length - 1; };
    if (w.id === 'w0') {
      const ids = ERAS.map(e => addPlaque({ n: e.n, t: e.t, c: e.c }));
      for (let i = 0; i < n; i++) {

    if (b1 > EARTH_AGE) { b1 = EARTH_AGE; a1 = Math.max(0, b1 - len); }
    if (b1 - a1 <= STR.b - STR.a + 1e-12) { resetFlags(); renderStretch(); return; }
    STR.stack.push([STR.a, STR.b]);
    stepUpIfNeeded(b1);
    glideStretch(a1, b1);
  }
  function stretchBack() { if (STR.anim) return; const prev = STR.stack.pop(); if (prev) { stepUpIfNeeded(prev[1]); glideStretch(prev[0], prev[1]); } }
  function goToSpan(a, b) {   // from the window: the line glides to the span, as a stretch would; back returns
    if (STR.anim) finishStretch();
    if (b - a < 1e-12) return;
    if (Math.abs(a - STR.a) < 1e-12 && Math.abs(b - STR.b) < 1e-12) { resetFlags(); renderStretch(); return; }
    STR.stack.push([STR.a, STR.b]);
    glideStretch(a, b);
  }
  function setFlag(i, ma) {   // a flag dragged: kept inside the line and on its own side of the other flag
    const gap = (STR.b - STR.a) * 2 / trackW();
    STR.flags[i] = i === 0 ? Math.max(STR.a, Math.min(STR.flags[1] - gap, ma)) : Math.min(STR.b, Math.max(STR.flags[0] + gap, ma));
    renderStretch();
  }
  let sPtr = null;
  track.addEventListener('pointerdown', e => {
    const r = track.getBoundingClientRect(), x = e.clientX - r.left;
    const d0 = Math.abs(xOf(STR.flags[0]) - x), d1 = Math.abs(xOf(STR.flags[1]) - x);
    if (Math.min(d0, d1) > 22) return;   // the flags only: this line has no thumb
    sPtr = { id: e.pointerId, x0: x, target: d0 <= d1 ? 'f0' : 'f1', moved: false };
    try { track.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault(); renderStretch();
  });
  track.addEventListener('pointermove', e => {
    if (!sPtr) return;
    const r = track.getBoundingClientRect(), x = e.clientX - r.left;
    if (Math.abs(x - sPtr.x0) > 2) sPtr.moved = true;
    if (!sPtr.moved) return;
    setFlag(sPtr.target === 'f0' ? 0 : 1, maOf(x));
  });
  const sUp = () => { if (!sPtr) return; sPtr = null; renderStretch(); };
  track.addEventListener('pointerup', sUp); track.addEventListener('pointercancel', sUp);
  $('wStretch').addEventListener('click', doStretch);
  $('wShrink').addEventListener('click', doShrink);
  $('wBack').addEventListener('click', stretchBack);

  // ---------- the left column: How this works, Window, Timeline ----------
  const htwPanel = window.CW.createInfoPanel ? CW.createInfoPanel({ width: 344 }) : null;
  if (htwPanel) {
    document.body.appendChild(htwPanel.el); htwPanel.el.style.zIndex = '600'; htwPanel.el.style.cursor = 'default'; htwPanel.el.classList.add('cw-info-panel');
    htwPanel.body.innerHTML = '<div class="panel-text">' +
      '<p class="ph">[Placeholder words. Michael will write these.]</p>' +
      '<p>Every square in the window is a stretch of time, and the past is at the top left. On the first window a square is a million years and a row is a billion; the gold square is now. The four words to the left of the glass change the scale: a thousand years a square, then a hundred, then ten.</p>' +
      '<p>Drag across squares to pick a span, and the line below stretches to it. On the line, drag the two flags in and tap <i>stretch</i> to look closer, or <i>shrink</i> to see more; <i>back</i> steps out. The lit squares always show where the line is.</p>' +
      '</div>';
    const bw = $('benchWords'); bw.style.display = ''; htwPanel.body.appendChild(bw);
  }
  function placePanel(pn) { const r = $('glassBox').getBoundingClientRect(), w = pn.el.offsetWidth || 344; if (!pn.userMoved()) pn.setPosition(Math.max(8, Math.min(window.innerWidth - w - 16, r.left + 16)), Math.max(8, r.top + 16)); }
  function togglePanel(pn, wordEl) {
    if (!pn) return;
    if (pn.visible() && pn.el.style.opacity === '1') { pn.hide(); wordEl.setAttribute('aria-pressed', 'false'); return; }
    placePanel(pn); pn.show(); wordEl.setAttribute('aria-pressed', 'true');
  }
  $('wHtw').addEventListener('click', () => togglePanel(htwPanel, $('wHtw')));
  if (htwPanel) htwPanel.el.querySelector('span').addEventListener('click', () => $('wHtw').setAttribute('aria-pressed', 'false'));
  // the two tools: each word brings its tool up or takes it down; both are up at the start
  function setTool(which, on) {
    if (which === 'window') { state.up = on; $('windowRow').style.display = on ? '' : 'none'; document.querySelector('.plaque-slot').style.display = on ? '' : 'none'; $('iWindow').setAttribute('aria-pressed', on ? 'true' : 'false'); if (on) { layout(); draw(); } }
    else { state.lineUp = on; $('ageRow').style.display = on ? '' : 'none'; $('iTimeline').setAttribute('aria-pressed', on ? 'true' : 'false'); if (on) renderStretch(); }
  }
  $('iWindow').addEventListener('click', () => setTool('window', !state.up));
  $('iTimeline').addEventListener('click', () => setTool('timeline', !state.lineUp));
  // bench only: the last million two ways
  function setGlassMode(m) { glassMode = m; $('wGlassA').setAttribute('aria-pressed', m === 'A' ? 'true' : 'false'); $('wGlassB').setAttribute('aria-pressed', m === 'B' ? 'true' : 'false'); draw(); }
  $('wGlassA').addEventListener('click', () => setGlassMode('A')); $('wGlassB').addEventListener('click', () => setGlassMode('B'));

  // ---------- the data, then the first drawing ----------
  async function loadAll() {
    const [ev, per, curve] = await Promise.all([
      fetch('../stories/deep-time-events.json').then(r => r.json()),
      fetch('../stories/deep-time-periods.json').then(r => r.json()),
      fetch('../stories/curves/sea-level-ice-ages.json').then(r => r.json())
    ]);
    events = ev.events.map(e => ({ id: e.id, label: e.label, ma: e.ma != null ? e.ma : CW.yearToMa(e.year), side: e.side })).filter(e => e.ma != null && !isNaN(e.ma));
    periods = per.periods; sea = curve;
    WINDOWS.forEach(w => { w.built = null; });
    $('readout').textContent = events.length + ' events from deep-time-events.json (' + events.filter(e => e.side === 'deep').length + ' deep, ' + events.filter(e => e.side !== 'deep').length + ' after the ice) · the sea from sea-level-ice-ages.json, warm at or above ' + WARM_THRESHOLD_M + ' m';
  }
  WINDOWS.forEach(w => build(w));   // plain first; built again with the data
  layout(); draw(); renderStretch();
  setGlassMode(glassMode);
  if (Q.get('w')) setWindow(Math.max(0, Math.min(3, +Q.get('w'))), false);
  loadAll().then(() => { WINDOWS.forEach(w => build(w)); draw(); }).catch(e => { console.error(e); $('fail').style.display = 'block'; $('fail').textContent = 'The events or the sea curve did not load: ' + e.message; });
  window.addEventListener('resize', () => { layout(); renderStretch(); });
  if (window.ResizeObserver) new ResizeObserver(() => { layout(); renderStretch(); }).observe($('glassBox'));

  // ---------- for the bench's own checks (the browser pane) ----------
  window.cwWin = { WINDOWS, ERAS, state, STR, set: k => setWindow(k, true), draw, layout, rect, hit, select: (a, b) => goToSpan(a, b), finish: finishStretch,
    stretch: doStretch, shrink: doShrink, back: stretchBack, flag: setFlag, lit: litSpan, labelFor, showPlaque, setGlassMode, mode: () => glassMode, build,
    warmSpells: () => { const w = WINDOWS[1]; if (w.built !== glassMode) build(w); const runs = []; let cur = null; for (let i = 0; i < w.real; i++) { const warm = w.plaques[w.kind[i]].n !== 'Ice age' && w.plaques[w.kind[i]].n !== 'Ice sheets'; if (warm && !cur) cur = [i, i]; else if (warm) cur[1] = i; else if (cur) { runs.push(cur); cur = null; } } if (cur) runs.push(cur); return runs.map(([a, b]) => [(1000 - a) * 1000, (999 - b) * 1000]); },
    eventsIn: k => { const w = WINDOWS[k]; const out = []; w.ev.forEach((e, i) => { if (e) out.push([i, e]); }); return out; } };
</script>
