<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>the fog map</title>
<style>
  :root{
    --parchment:#f4f1e8; --ink:#2a2620; --slate:#546A80; --copper:#b87333;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--parchment);
    font-family:Georgia,serif;color:var(--ink);}
  #map{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none;}
  #map.dragging{cursor:grabbing;}
  .veil{position:absolute;left:0;right:0;pointer-events:none;}
  header.veil{top:0;padding:14px 20px 30px;
    background:linear-gradient(rgba(244,241,232,.97) 0%,rgba(244,241,232,.97) 62%,rgba(244,241,232,0) 100%);}
  header .title{font-size:17px;letter-spacing:.02em;}
  header .note{font-size:12.5px;font-style:italic;color:var(--slate);margin-top:2px;}
  footer.veil{bottom:0;padding:30px 20px 12px;display:flex;justify-content:space-between;
    align-items:baseline;background:linear-gradient(rgba(244,241,232,0) 0%,rgba(244,241,232,.97) 38%,rgba(244,241,232,.97) 100%);}
  #readout{font-size:14px;min-height:1.3em;}
  #readout .n{color:var(--copper);}
  #corner{font-size:12px;font-style:italic;color:var(--slate);text-align:right;}
</style>
</head>
<body>
<canvas id="map"></canvas>
<header class="veil">
  <div class="title">the fog map</div>
  <div class="note">every pane shaded by its largest prime &mdash; white is 2, black arrives at the 256th prime. drag and scroll.</div>
</header>
<footer class="veil">
  <div id="readout"></div>
  <div id="corner"></div>
</footer>
<script>
(function(){
"use strict";
/* ---------- primes and ranks ---------- */
const RANK_CAP = 256;                       // gray saturates at the 256th prime (1619)
const smallPrimes = [];                     // primes up to 1024, for trial division to 1e6
{ const N=1024, s=new Uint8Array(N+1);
  for(let i=2;i<=N;i++){ if(!s[i]){ smallPrimes.push(i);
    for(let j=i*i;j<=N;j+=i) s[j]=1; } } }
const rankOf = new Map();                   // prime -> 1-based rank, up to the 256th
{ const N=1700, s=new Uint8Array(N+1); let r=0;
  for(let i=2;i<=N && r<RANK_CAP;i++){ if(!s[i]){ r++; rankOf.set(i,r);
    for(let j=i*i;j<=N;j+=i) s[j]=1; } } }
const MAXC = 1000000;                       // coordinate ceiling

function largestPrimeFactor(n){             // n >= 1
  if(n<2) return 1;
  let m=n, best=1;
  for(let i=0;i<smallPrimes.length;i++){
    const p=smallPrimes[i]; if(p*p>m) break;
    if(m%p===0){ best=p; while(m%p===0) m/=p; }
  }
  return m>1 ? m : best;
}
const lpfCache = new Map();                 // n -> lpf
function lpf(n){ let v=lpfCache.get(n);
  if(v===undefined){ v=largestPrimeFactor(n); lpfCache.set(n,v); } return v; }
function rankClamped(p){                    // prime (or 1) -> 1..256 ; 1 -> 0
  if(p<2) return 0;
  const r=rankOf.get(p); return r!==undefined ? r : RANK_CAP;
}
/* gray: rank 1 -> 250, rank 256 -> 18, linear; rank 0 (the pane of 1) -> 253 */
function grayFor(rank){ return rank===0 ? 253 : Math.round(250 - (rank-1)*(232/(RANK_CAP-1))); }

/* ---------- view state (world y up, u,v >= 1) ---------- */
const cv=document.getElementById('map'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
let scale=6;                                // device px per unit
let ox=1, oy=1;                             // world coords at bottom-left of canvas
const SCALE_MIN=0.05, SCALE_MAX=160;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(1,Math.round(innerWidth*DPR)); H=Math.max(1,Math.round(innerHeight*DPR));
  cv.width=W; cv.height=H; cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  draw();
}
addEventListener('resize',resize);

function clampView(){
  scale=Math.min(SCALE_MAX,Math.max(SCALE_MIN,scale));
  const span=W/scale;
  ox=Math.min(MAXC-span, Math.max(1-span*0.15, ox));
  oy=Math.min(MAXC-H/scale, Math.max(1-(H/scale)*0.15, oy));
}

/* ---------- render ---------- */
let img=null;
function draw(){
  clampView();
  if(!img || img.width!==W || img.height!==H) img=ctx.createImageData(W,H);
  const d=img.data;
  // per-column u and per-row v rank tables
  const colRank=new Int16Array(W), rowRank=new Int16Array(H);
  for(let x=0;x<W;x++){
    const u=Math.floor(ox+x/scale);
    colRank[x]=(u<1||u>MAXC)? -1 : rankClamped(lpf(u));
  }
  for(let y=0;y<H;y++){
    const v=Math.floor(oy+(H-1-y)/scale);   // y up
    rowRank[y]=(v<1||v>MAXC)? -1 : rankClamped(lpf(v));
  }
  let i=0;
  for(let y=0;y<H;y++){
    const rv=rowRank[y];
    for(let x=0;x<W;x++){
      const ru=colRank[x];
      if(ru<0||rv<0){ d[i]=244;d[i+1]=241;d[i+2]=232;d[i+3]=255; } // off-map: parchment
      else{ const g=grayFor(Math.max(ru,rv));
        d[i]=g; d[i+1]=g; d[i+2]=g; d[i+3]=255; }
      i+=4;
    }
  }
  ctx.putImageData(img,0,0);
  labels();
  cornerReadout();
}
function niceStep(px){                       // 1-5-10 ladder on the target of ~90px
  const raw=90/px; const e=Math.pow(10,Math.floor(Math.log10(raw)));
  for(const m of [1,2,5,10]) if(m*e>=raw) return m*e;
  return 10*e;
}
function labels(){
  if(scale*DPR<0.8) return;                  // too far out for numbers
  const step=Math.max(1,Math.round(niceStep(scale)));
  ctx.font=`${Math.round(11*DPR)}px Georgia`; ctx.fillStyle='rgba(84,106,128,.75)';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  for(let u=Math.ceil(ox/step)*step; u<ox+W/scale; u+=step){
    if(u<1) continue; ctx.fillText(String(u), (u+0.5-ox)*scale, H-6*DPR);
  }
  ctx.textAlign='left'; ctx.textBaseline='middle';
  for(let v=Math.ceil(oy/step)*step; v<oy+H/scale; v+=step){
    if(v<1) continue; ctx.fillText(String(v), 6*DPR, H-(v+0.5-oy)*scale);
  }
}
function cornerReadout(){
  const u=Math.floor(ox+W/scale)-1, v=Math.floor(oy+H/scale)-1;
  document.getElementById('corner').textContent=
    (u>=1&&v>=1)? `far corner ${fmt(u)} \u00D7 ${fmt(v)} = ${fmt(u*v)}` : '';
}
const fmt=n=>n.toLocaleString('en-US').replace(/,/g,'\u2009');

/* ---------- hover readout ---------- */
function factorization(n){
  if(n<2) return '1';
  let m=n; const parts=[];
  for(let i=0;i<smallPrimes.length;i++){
    const p=smallPrimes[i]; if(p*p>m) break;
    if(m%p===0){ let k=0; while(m%p===0){m/=p;k++;}
      parts.push(k>1?`${p}^${k}`:`${p}`); }
  }
  if(m>1) parts.push(`${m}`);
  return parts.join(' \u00B7 ');
}
const readout=document.getElementById('readout');
function hover(px,py){
  const u=Math.floor(ox+px*DPR/scale), v=Math.floor(oy+(H-1-py*DPR)/scale);
  if(u<1||v<1||u>MAXC||v>MAXC){ readout.textContent=''; return; }
  const n=u*v, p=Math.max(lpf(u),lpf(v));
  readout.innerHTML = `<span class="n">${fmt(n)}</span>&ensp;=&ensp;${factorization(n)}`
    + (n>1?`&ensp;&mdash;&ensp;largest prime ${fmt(p)}`:'');
}

/* ---------- pan and zoom ---------- */
let dragging=false,lx=0,ly=0,moved=false;
cv.addEventListener('pointerdown',e=>{dragging=true;moved=false;lx=e.clientX;ly=e.clientY;
  cv.classList.add('dragging');cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{
  if(dragging){
    const dx=(e.clientX-lx)*DPR/scale, dy=(e.clientY-ly)*DPR/scale;
    if(Math.abs(e.clientX-lx)+Math.abs(e.clientY-ly)>2) moved=true;
    ox-=dx; oy+=dy; lx=e.clientX; ly=e.clientY; requestDraw();
  }
  hover(e.clientX,e.clientY);
});
cv.addEventListener('pointerup',e=>{dragging=false;cv.classList.remove('dragging');});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=Math.exp(-e.deltaY*0.0015);
  zoomAt(e.clientX*DPR, e.clientY*DPR, f);
},{passive:false});
function zoomAt(px,py,f){
  const wu=ox+px/scale, wv=oy+(H-1-py)/scale;
  scale*=f; clampView();
  ox=wu-px/scale; oy=wv-(H-1-py)/scale; requestDraw();
}
/* pinch */
const touches=new Map();
cv.addEventListener('touchstart',e=>{for(const t of e.changedTouches)touches.set(t.identifier,[t.clientX,t.clientY]);},{passive:true});
cv.addEventListener('touchend',e=>{for(const t of e.changedTouches)touches.delete(t.identifier);},{passive:true});
cv.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    e.preventDefault();
    const a=e.touches[0],b=e.touches[1];
    const pa=touches.get(a.identifier),pb=touches.get(b.identifier);
    if(pa&&pb){
      const d0=Math.hypot(pa[0]-pb[0],pa[1]-pb[1]), d1=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
      if(d0>0) zoomAt((a.clientX+b.clientX)/2*DPR,(a.clientY+b.clientY)/2*DPR, d1/d0);
    }
    touches.set(a.identifier,[a.clientX,a.clientY]);
    touches.set(b.identifier,[b.clientX,b.clientY]);
  }
},{passive:false});

let pending=false;
function requestDraw(){ if(!pending){ pending=true;
  requestAnimationFrame(()=>{pending=false;draw();}); } }

resize();
})();
</script>
</body>
</html>
