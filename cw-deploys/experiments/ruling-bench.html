<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ruling — a bench</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#f4f1e8;font-family:Georgia,serif;color:#3D3D3A;overflow:hidden;
       user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;position:fixed;inset:0;touch-action:none;cursor:grab}
  canvas.dragging{cursor:grabbing}
  canvas.overone{cursor:crosshair}

  .panel{position:fixed;left:16px;top:16px;z-index:10;width:270px;
         background:rgba(244,241,232,.94);border:.5px solid #c8b89a;border-radius:6px;
         padding:13px 15px 13px;box-shadow:0 2px 12px rgba(42,38,32,.08)}
  h1{font-size:15px;font-weight:normal;color:#546A80;margin-bottom:3px}
  .sub{font-size:11px;color:#a09880;margin-bottom:11px;line-height:1.45}

  /* The stepper: a word with a step to either side. */
  .rule{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;min-height:20px}
  .ax{font-size:10.5px;color:#8d8879;letter-spacing:.07em;text-transform:uppercase;width:9px}
  /* Padded well past the glyph: on an iPad a bare chevron is a 12px target, and
     the stepper is the one control here she is meant to press over and over. */
  .step{font:inherit;font-size:15px;color:#546A80;background:none;border:0;cursor:pointer;
        padding:5px 9px;line-height:1}
  .step:hover{color:#3D3D3A}
  .word{font-size:13px;color:#252623;min-width:74px;text-align:center}
  .row{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;align-items:baseline;
       margin-top:8px;min-height:18px}

  button{font:inherit;font-size:13px;color:#546A80;background:none;border:0;
         border-bottom:1px solid transparent;cursor:pointer;padding:1px 1px}
  button:hover{color:#3D3D3A;border-bottom-color:#c8b89a}
  /* Options fade when irrelevant, never grey out. */
  button.gone{display:none}
  button.dark{visibility:hidden}

  /* The stacked fractions, and the math axis they sit on, are CW.num's rather
     than this page's — js/cw-number.js carries the rules and injects
     `.cw-line`, `.cw-frac` and the rest, so this readout and the labs cannot
     drift apart. What is left here is only this readout's colour and rhythm. */
  .out{margin-top:11px;padding-top:10px;border-top:1px solid rgba(84,106,128,.18);
       font-size:15px;color:#3D3D3A;min-height:26px}
  .out .cw-op{font-size:12.5px;color:#8d8879}
  .cw-line{margin-bottom:6px}
  .stack{display:flex;gap:14px;font-size:13px;margin-top:2px}

<body>
<canvas id="c"></canvas>

<div class="panel">

    <button class="step" id="xdn">&lsaquo;</button><span class="word" id="xw"></span><button class="step" id="xup">&rsaquo;</button>

  </div>

</div>

<script src="../js/cw-number.js?v=2026-09-02"></script>
<script src="../js/plane.js?v=2026-08-13"></script>
<script>
var CW_VERSION = '2026-09-03 pending'; try { console.log('Curious Woods · ' + document.title + ' · ' + CW_VERSION); } catch (e) {}
// ============================================================================
// RULING — A BENCH
//
// One question on screen: DOES MULTIPLICATION CARE HOW THE GRID IS RULED? A
// rectangle, and a ruling she steps under it. The rectangle never moves. Only
// the came does — and then, if she asks, the pieces regroup and the division
// falls out of the regrouping.
//
// Companion to experiments/multiply-bench.html, and its junior: for every
// behaviour the two share — drag-the-1, panning, zoom, pinch, Home, Clear, the
// panel idiom, the glass, the came, the numbers — THAT FILE AS IT STANDS is the
// authority. Every fix it has had is carried here.
//
// Numbers are CW.num's throughout (js/cw-number.js, loaded before plane.js):
// stacked fractions, never slashes; nothing rounds; the math axis.
//
// ---------------------------------------------------------------------------
// THIRD PASS, 3 Sep — the stepper and the restack. Two reversals, recorded here
// because the vault has not caught up:
//
//   • THE FIXED ROW OF FIVE WORDS IS GONE. Each axis now shows one word with a
//     step to either side — ‹ Thirds › — walking Units, Halves, Thirds,
//     Fourths, Fifths and on without end; past Tenths the words read 11ths,
//     12ths. NOTHING IS SPECIAL ABOUT TENTHS ANY MORE, which was the last
//     place base ten was privileged in this bench.
//
//   • THE DARK WORD IS GONE, and this is the better idea. The second pass
//     offered a ruling only while it could measure the current side, and went
//     dark when it could not — divisibility announced by the interface. Now
//     ANY RULING IS SETTABLE and the fit is something she SEES: when the ruling
//     does not measure a side, the pieces at the far edge are cut short — real
//     glass cut at the rectangle's boundary, never a thin line — and the count
//     along that side does not come out whole. Nothing is disabled, nothing is
//     announced. This also retires the second pass's "no common ruling for
//     1/3 × 1/2" finding as an *interface* fact; it survives as a fact about
//     numbers, which is where it belonged.
//
// ---------------------------------------------------------------------------
// WHAT TO LOOK AT — six questions, none answered here by fiat.
//
//  Q1. Step x's ruling under a side of 1/3: it fits at every third press.
//      Under 1/2, every second. Linked, both fit together first at Sixths, then
//      Twelfths. Does the rhythm arrive by LOOKING, or only by being told?
//
//  Q2. The common term arrives without anyone asking for it: split rulings mint
//      identical pieces, and the cross-hatched 1 shows their worth. Does she
//      read the piece against the 1 unprompted?
//
//  Q3. Does the moment a square closes read as "a whole 1", and does the
//      partial read as 11-of-15 without being told? The partial keeps its full
//      unit seam so the missing 4 are plainly absent rather than merely not
//      there.
//
//  Q4. Do Stack ↑ and Stack → register as the same fact twice, or as two
//      different operations? They must land on the same answer; that is the
//      point of there being two.
//
//  Q5. A rectangle smaller than the 1 — 1/3 × 1/2 — restacks to a lone partial
//      square, and the second line adds nothing new: it reads 1/6 = 1/6. Do the
//      arrows still make sense there, or should they sit quiet below area 1?
//
//  Q6. Is the stepper fast enough for the hunt, or does walking from Units to
//      Twelfths one press at a time kill the wanting to?
//
// ---------------------------------------------------------------------------
// THREE READINGS THE PROMPT LEFT TO THE BUILD, each one line to change:
//
//  1. THE LINE IS NOT SHOWN DURING A DRAG. "One line on release" is read as
//     timing — nothing while her finger is down, the line when she lifts —
//     which is also the Multiply bench's rule that no product appears during a
//     drag. Stepping the ruling afterwards keeps the line current: it says the
//     sides as the ruling in force counts them.
//
//  2. WHEN THE RULING DOES NOT MEASURE BOTH SIDES THE LINE IS ABSENT. There is
//     no whole-number multiplication to state, and stating a rounded one would
//     break "never more precision than the act showed". The glass, with its cut
//     pieces, is the whole statement. So the fit is legible twice — in the came
//     and in whether there is a line at all — without anything being announced.
//
//  3. THE ARROWS ARE OFFERED ONLY WHEN THE RULING FITS. You cannot regroup a
//     cut piece into a whole square; the count would be a lie. They also stand
//     down past STACK_MAX pieces, because the animation IS the division being
//     counted and nobody counts six hundred of anything.
//
// Not in this bench, on purpose: no twin, no persisting tiles, no products on
// the glass, no Undo (one rectangle at a time), no prime colour, no sound, no
// operation log. Only the two sides are written on the glass.
// ============================================================================
(() => {
'use strict';

const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');

// ---- the dials ------------------------------------------------------------
const U            = 200;   // world units per unit interval — as both labs declare it
const PPU_MIN      = 46;    // px per unit at the greeting, as the Multiply bench pins it
const PPU_MAX      = 78;
const ORIGIN_PAD   = 56;
const GRAB_MIN     = 22;    // px: the 1's grab box never shrinks below this
const MOVE_SLOP    = 5;     // px before a touch on the 1 counts as a drag at all
const CAME_ALPHA   = 0.30;  // a piece's lead, at the weight plane.js gives its axes
const SEAM_ALPHA   = 0.72;  // a closed unit square's seam, a step up from that
const PIECE_GLASS  = 22;    // px below which pieces stop carrying their own highlight
const CAME_FLOOR   = 3;     // px below which a came line stops resolving (plane.js's rule)
const ROW_MS_MAX   = 500;   // a row of the restack, at small counts: about half a second
const ROW_MS_MIN   = 110;
const ROW_MS_BUDGET= 2500;  // …and the whole thing aims to land inside this
const STACK_MAX    = 600;   // pieces past which the restack stands down (see reading 3)
const INK          = '#2b2a26';
const LATTICE      = '#546A80';
const GLASS_WHITE  = ['#ffffff', '#e9eef5', '#cfd6e0'];

// Units, Halves, Thirds, Fourths … and past Tenths the ordinals run out of
// English worth having, so the words become numerals. Nothing is special about
// ten; the list simply stops pretending to be a list.
const ORD = ['Units','Halves','Thirds','Fourths','Fifths','Sixths','Sevenths','Eighths','Ninths','Tenths'];
const ruleName = d => d <= ORD.length ? ORD[d - 1] : d + 'ths';

// ---- the plane ------------------------------------------------------------
function greetingView(w, h) {
  const ppu = Math.max(PPU_MIN, Math.min(PPU_MAX, Math.min(w, h) / 11));
  const zoom = ppu / U;
  return { x: (w / 2 - ORIGIN_PAD) / zoom, y: (h / 2 - ORIGIN_PAD) / zoom, zoom };
}
const plane = CW.createPlane({ defaultView: greetingView });
plane.setUnitFrame(0, 0, U);
const ppu = () => plane.zoom() * U;

function atGreeting() {
  const v = plane.view(), g = greetingView(plane.viewportWidth(), plane.viewportHeight());
  return Math.abs(v.zoom - g.zoom) < 1e-9 &&
         Math.abs(v.x - g.x) < 1e-6 && Math.abs(v.y - g.y) < 1e-6;
}

let viewSettled = false;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth, h = window.innerHeight;
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  plane.setViewport(w, h);
  if (!viewSettled) plane.resetView();
  draw();
}
window.addEventListener('resize', resize);

// ---- the rectangle, and the ruling over it --------------------------------
// THE RECTANGLE IS A TRUE SIZE, not a count of pieces: two exact rationals that
// do not change when the ruling does. That separation is the whole of the third
// pass — the ruling became a lens laid over a thing rather than the terms the
// thing is made of, which is what lets a ruling fail to measure it.
let rect = null;            // {wn, wd, hn, hd} — width wn/wd, height hn/hd
let dx = 1, dy = 1, linked = true;

// A side of n/d, ruled in 1/D: how many whole pieces, and what is left over.
// Integers all the way; the leftover is returned as a share of one piece so the
// cut glass can be drawn at exactly the rectangle's boundary.
function along(n, d, D) {
  const total = n * D;                       // pieces × d
  const full = Math.floor(total / d);
  const rem = total - full * d;              // leftover, in d-ths of a piece
  return { full: full, remShare: rem / d, fits: rem === 0 };
}
const spanX = () => rect && along(rect.wn, rect.wd, dx);
const spanY = () => rect && along(rect.hn, rect.hd, dy);
const fits = () => rect && spanX().fits && spanY().fits;

function setRule(axis, D) {
  if (D < 1) return;
  if (axis === 'x' || linked) dx = D;
  if (axis === 'y' || linked) dy = D;
  stack = null;                              // a new ruling is a new set of pieces
  draw();
}
// The finer step stands down at the pixel floor — the plane's own way of saying
// the end of refinement, and it moves with the zoom, so the answer is always
// "zoom in and there is more" rather than "that is all there is".
const canRefine = D => ppu() / (D + 1) >= CAME_FLOOR;

// ---- the restack ----------------------------------------------------------
// Division as regrouping. The pieces are re-poured into a channel one unit wide
// (↑) or one unit tall (→); every dx·dy of them closes a whole square, and what
// is left over is the remainder, sitting inside a seam with its absences
// visible. No arithmetic is performed on numerals anywhere in here: the second
// line of the readout only names what the glass has finished showing.
let stack = null;           // {dir, t0, px, py, rows, rowMs, dur, done}
let lastKey = '', reps = 0;

function beginStack(dir) {
  if (!fits()) return;
  const px = spanX().full, py = spanY().full;
  if (px * py === 0 || px * py > STACK_MAX) return;
  const lanes = dir === 'up' ? Math.ceil(px * py / dx) : Math.ceil(px * py / dy);
  // House pattern: the same shape asked for again moves quicker each time.
  const key = [dir, px, py, dx, dy].join(':');
  reps = key === lastKey ? reps + 1 : 0; lastKey = key;
  const rowMs = Math.max(ROW_MS_MIN,
                  Math.min(ROW_MS_MAX, ROW_MS_BUDGET / lanes) / (1 + 0.7 * reps));
  stack = { dir: dir, t0: performance.now(), px: px, py: py,
            lanes: lanes, rowMs: rowMs, dur: rowMs * 1.35, done: false };
  tick();
}

// Where piece i sits before, and where it is going. Both are in piece units —
// a piece is 1/dx by 1/dy either way, which is why the pieces never change
// shape while they move. Only their company changes.
const srcOf = (i, px) => ({ c: i % px, r: Math.floor(i / px) });
const dstOf = (i, dir) => dir === 'up'
  ? { c: i % dx, r: Math.floor(i / dx) }
  : { c: Math.floor(i / dy), r: i % dy };
// A piece's lane is the row (↑) or column (→) it lands in; lanes fill in order,
// so the squares close in counting order rather than all at once.
const laneOf = (i, dir) => dir === 'up' ? Math.floor(i / dx) : Math.floor(i / dy);

function stackProgress(i, now) {
  const t = now - stack.t0 - laneOf(i, stack.dir) * stack.rowMs;
  if (t <= 0) return 0;
  if (t >= stack.dur) return 1;
  const p = t / stack.dur;                   // ease, so a piece arrives rather than stops
  return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
}
function stackEnds() { return stack.t0 + (stack.lanes - 1) * stack.rowMs + stack.dur; }

// How many pieces square k holds, and whether all of them have landed.
function squaresOf() {
  const n = stack.px * stack.py, per = dx * dy;
  const out = [];
  for (let k = 0; k * per < n; k++) out.push({ k: k, n: Math.min(per, n - k * per) });
  return out;
}

let raf = null;
function tick() {
  if (raf) return;
  const step = () => {
    raf = null;
    if (!stack) return;
    const now = performance.now();
    if (!stack.done && now >= stackEnds()) { stack.done = true; syncPanel(); }
    draw();
    if (!stack.done) { raf = requestAnimationFrame(step); }
  };
  raf = requestAnimationFrame(step);
}

// ---- drawing --------------------------------------------------------------
const glassCache = new Map();
function unityGlass(w, h) {
  const key = Math.round(w) + 'x' + Math.round(h);
  let g = glassCache.get(key);
  if (!g) {
    g = ctx.createRadialGradient(w * 0.44, h * 0.38, 0, w * 0.44, h * 0.38, Math.max(1, w * 0.75));
    g.addColorStop(0, GLASS_WHITE[0]); g.addColorStop(0.62, GLASS_WHITE[1]);
    g.addColorStop(1, GLASS_WHITE[2]);
    if (glassCache.size > 400) glassCache.clear();
    glassCache.set(key, g);
  }
  return g;
}
// unit coords -> screen rect
function box(x0, y0, x1, y1) {
  const a = plane.worldToScreen(x0 * U, y1 * U), b = plane.worldToScreen(x1 * U, y0 * U);
  return { x: a.x, y: a.y, w: b.x - a.x, h: b.y - a.y };
}
function pane(r, glass) {
  if (r.x > plane.viewportWidth() || r.y > plane.viewportHeight() ||
      r.x + r.w < 0 || r.y + r.h < 0 || r.w <= 0 || r.h <= 0) return;
  if (glass && Math.min(r.w, r.h) >= PIECE_GLASS) {
    ctx.save(); ctx.translate(r.x, r.y);
    ctx.fillStyle = unityGlass(r.w, r.h); ctx.fillRect(0, 0, r.w, r.h); ctx.restore();
  } else {
    ctx.fillStyle = GLASS_WHITE[1]; ctx.fillRect(r.x, r.y, r.w, r.h);
  }
  if (Math.min(r.w, r.h) >= CAME_FLOOR) {
    ctx.save(); ctx.globalAlpha = CAME_ALPHA; ctx.strokeStyle = LATTICE; ctx.lineWidth = 1;
    ctx.strokeRect(CW.snap(r.x), CW.snap(r.y), Math.round(r.w), Math.round(r.h));
    ctx.restore();
  }
}

// The rectangle as the ruling cuts it. Whole pieces, and then — when the ruling
// does not measure the side — a last column or row cut short at the boundary.
// Cut glass is still glass: it is filled and leaded like any other piece, never
// reduced to a line, so what she sees is a piece that did not come out whole.
function drawRuled(r) {
  const sx = along(r.wn, r.wd, dx), sy = along(r.hn, r.hd, dy);
  const nx = sx.full + (sx.remShare > 0 ? 1 : 0), ny = sy.full + (sy.remShare > 0 ? 1 : 0);
  const wOf = c => (c < sx.full ? 1 : sx.remShare) / dx;
  const hOf = rr => (rr < sy.full ? 1 : sy.remShare) / dy;
  let y0 = 0;
  for (let rr = 0; rr < ny; rr++) {
    let x0 = 0;
    for (let c = 0; c < nx; c++) {
      pane(box(x0, y0, x0 + wOf(c), y0 + hOf(rr)), true);
      x0 += wOf(c);
    }
    y0 += hOf(rr);
  }
  // The rectangle's own edge, a step up in presence: the pieces are inside it.
  const s = box(0, 0, r.wn / r.wd, r.hn / r.hd);
  ctx.save();
  ctx.globalAlpha = 0.62; ctx.strokeStyle = LATTICE; ctx.lineWidth = 1.5;
  ctx.strokeRect(CW.snap(s.x), CW.snap(s.y), Math.round(s.w), Math.round(s.h));
  ctx.restore();
  drawSides(r, s);
}

// The two sides, on the rectangle, each a stacked fraction in the terms of the
// ruling that measures it — and only while it does. A side the ruling cannot
// count has no honest numeral, so it goes without one rather than being rounded.
function drawSides(r, s) {
  const room = Math.min(s.w, s.h);
  if (room < 34) return;
  const size = Math.max(11, Math.min(26, room * 0.17, s.h / 5.2));
  const o = { size: size, weight: 'bold', color: INK };
  const pad = size * 0.62;
  const sx = along(r.wn, r.wd, dx), sy = along(r.hn, r.hd, dy);
  ctx.save(); ctx.globalAlpha = 0.95;
  if (sx.fits) CW.num.draw(ctx, sx.full, dx, s.x + s.w / 2, s.y + pad + size * 0.35, o);
  if (sy.fits) CW.num.draw(ctx, sy.full, dy, s.x + s.w - pad, s.y + s.h / 2,
                           Object.assign({ align: 'right' }, o));
  ctx.restore();
}

// The restack, mid-flight and at rest. Each piece slides from where it lay to
// where it lands; a square gets its seam the moment its last piece arrives.
function drawStack() {
  const n = stack.px * stack.py, now = performance.now(), per = dx * dy;
  const landed = [];
  for (let k = 0; k * per < n; k++) landed.push(true);
  for (let i = 0; i < n; i++) {
    const p = stackProgress(i, now);
    if (p < 1) landed[Math.floor(i / per)] = false;
    const a = srcOf(i, stack.px), b = dstOf(i, stack.dir);
    const c = a.c + (b.c - a.c) * p, rr = a.r + (b.r - a.r) * p;
    pane(box(c / dx, rr / dy, (c + 1) / dx, (rr + 1) / dy), true);
  }
  // A closed square is a whole 1 again: one seam round it, and the came inside
  // it still says what it is made of. The partial keeps its seam too, so the
  // pieces it is missing are plainly absent rather than merely not there.
  ctx.save();
  ctx.globalAlpha = SEAM_ALPHA; ctx.strokeStyle = LATTICE; ctx.lineWidth = 2;
  squaresOf().forEach(sq => {
    if (!landed[sq.k]) return;
    const s = stack.dir === 'up' ? box(0, sq.k, 1, sq.k + 1) : box(sq.k, 0, sq.k + 1, 1);
    ctx.strokeRect(CW.snap(s.x), CW.snap(s.y), Math.round(s.w), Math.round(s.h));
  });
  ctx.restore();
}

// The 1. Empty plane: a filled white tile with its numeral, the handle. With
// anything on the glass: its outline only, so it becomes the scale mark — and
// under split rulings the came cross-hatches it, which is where the worth of a
// piece can be read off without anyone saying it (Q2).
function drawOne() {
  const r = box(0, 0, 1, 1);
  ctx.save();
  if (!rect) {
    ctx.save(); ctx.translate(r.x, r.y);
    ctx.fillStyle = unityGlass(r.w, r.h); ctx.fillRect(0, 0, r.w, r.h); ctx.restore();
    ctx.strokeStyle = LATTICE; ctx.globalAlpha = CAME_ALPHA; ctx.lineWidth = 1;
    ctx.strokeRect(CW.snap(r.x), CW.snap(r.y), Math.round(r.w), Math.round(r.h));
    ctx.globalAlpha = 1;
    CW.num.drawText(ctx, '1', r.x + r.w / 2, r.y + r.h / 2,
                    { size: Math.max(9, Math.min(26, r.w * 0.34)), color: INK });
  } else {
    ctx.strokeStyle = LATTICE; ctx.globalAlpha = 0.5; ctx.lineWidth = 2;
    ctx.strokeRect(CW.snap(r.x), CW.snap(r.y), Math.round(r.w), Math.round(r.h));
  }
  ctx.restore();
}

function draw() {
  const W = plane.viewportWidth(), H = plane.viewportHeight();
  ctx.fillStyle = '#f4f1e8'; ctx.fillRect(0, 0, W, H);
  plane.drawLattice(ctx);          // the plane's unit lattice, axes and ladder labels
  if (build && build.moved) drawRuled(build);
  else if (stack) drawStack();
  else if (rect) drawRuled(rect);
  drawOne();
  syncPanel();
}

// ---- the grammar ----------------------------------------------------------
// Touch the 1 and drag: make a rectangle, snapped to the ruling on each axis —
// so a rectangle always fits the ruling that made it, and any misfit afterwards
// is one she caused by stepping. Touch anywhere else and drag: pan. Pinch or
// wheel: zoom. A tap on the 1 is a drag of zero length and nothing happens.
const pointers = new Map();
let mode = null, build = null, panLast = null, pinch = null;

function overOne(x, y) {
  const r = box(0, 0, 1, 1), cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  const hw = Math.max(r.w / 2, GRAB_MIN / 2), hh = Math.max(r.h / 2, GRAB_MIN / 2);
  return Math.abs(x - cx) <= hw && Math.abs(y - cy) <= hh;
}
function snapPieces(x, y) {
  const p = plane.screenToWorld(x, y);
  return { wn: Math.max(1, Math.round(p.x / U * dx)), wd: dx,
           hn: Math.max(1, Math.round(p.y / U * dy)), hd: dy };
}
function zoomAbout(sx, sy, factor) {
  const before = plane.screenToWorld(sx, sy);
  plane.setZoom(plane.zoom() * factor);
  const after = plane.screenToWorld(sx, sy);
  const p = plane.pan();
  plane.setPan(p.x + (before.x - after.x), p.y + (before.y - after.y));
  viewSettled = true;
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const p = [...pointers.values()];
    mode = 'pinch'; build = null; panLast = null;
    pinch = { d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y),
              mx: (p[0].x + p[1].x) / 2, my: (p[0].y + p[1].y) / 2 };
  } else if (pointers.size === 1) {
    if (overOne(e.clientX, e.clientY)) {
      mode = 'build';
      build = Object.assign({ sx: e.clientX, sy: e.clientY, moved: false },
                            snapPieces(e.clientX, e.clientY));
    } else {
      mode = 'pan';
      panLast = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: false };
      canvas.classList.add('dragging');
    }
  }
  draw();
});

canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) {
    canvas.classList.toggle('overone', overOne(e.clientX, e.clientY));
    return;
  }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (mode === 'pinch' && pointers.size >= 2) {
    const p = [...pointers.values()];
    const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    const mx = (p[0].x + p[1].x) / 2, my = (p[0].y + p[1].y) / 2;
    if (pinch.d > 0) zoomAbout(mx, my, d / pinch.d);
    const pan = plane.pan();
    plane.setPan(pan.x - (mx - pinch.mx) / plane.zoom(), pan.y + (my - pinch.my) / plane.zoom());
    pinch = { d, mx, my };
  } else if (mode === 'build' && build) {
    if (!build.moved && Math.hypot(e.clientX - build.sx, e.clientY - build.sy) > MOVE_SLOP) {
      build.moved = true;
      stack = null; rect = null;         // starting over: the old restack clears
    }
    Object.assign(build, snapPieces(e.clientX, e.clientY));
  } else if (mode === 'pan' && panLast) {
    const dxp = e.clientX - panLast.x, dyp = e.clientY - panLast.y;
    const pan = plane.pan();
    plane.setPan(pan.x - dxp / plane.zoom(), pan.y + dyp / plane.zoom());
    if (Math.hypot(e.clientX - panLast.sx, e.clientY - panLast.sy) > MOVE_SLOP) panLast.moved = true;
    panLast.x = e.clientX; panLast.y = e.clientY;
    viewSettled = true;
  } else return;
  draw();
});

function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (mode === 'build' && build) {
    if (build.moved) {                    // the line arrives on release, not before
      rect = { wn: build.wn, wd: build.wd, hn: build.hn, hd: build.hd };
      lastKey = ''; reps = 0;
    }
    build = null; mode = null;
  } else if (mode === 'pan' && panLast) {
    panLast = null; mode = null;
    canvas.classList.remove('dragging');
  } else if (mode === 'pinch') {
    if (pointers.size === 1) {            // one finger left: carry on panning
      const p = [...pointers.values()][0];
      mode = 'pan'; panLast = { x: p.x, y: p.y, sx: p.x, sy: p.y, moved: true };
    } else { mode = null; pinch = null; }
  }
  if (pointers.size === 0) { mode = null; pinch = null; canvas.classList.remove('dragging'); }
  draw();
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAbout(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015));
  draw();
}, { passive: false });

// ---- the panel ------------------------------------------------------------
const outEl = document.getElementById('out');
const el = id => document.getElementById(id);
const linkBtn = el('link'), homeBtn = el('home'), clearBtn = el('clear'),
      supBtn = el('sup'), srightBtn = el('sright');

el('xdn').addEventListener('click', () => setRule('x', dx - 1));
el('xup').addEventListener('click', () => setRule('x', dx + 1));
el('ydn').addEventListener('click', () => setRule('y', dy - 1));
el('yup').addEventListener('click', () => setRule('y', dy + 1));
linkBtn.addEventListener('click', () => {
  if (linked) linked = false; else { linked = true; dy = dx; stack = null; }
  draw();
});
homeBtn.addEventListener('click', () => { plane.resetView(); viewSettled = false; draw(); });
clearBtn.addEventListener('click', () => {
  rect = null; stack = null; dx = 1; dy = 1; linked = true; lastKey = ''; draw();
});
supBtn.addEventListener('click', () => beginStack('up'));
srightBtn.addEventListener('click', () => beginStack('right'));

function syncPanel() {
  el('xw').textContent = ruleName(dx);
  el('yw').textContent = ruleName(dy);
  el('xdn').classList.toggle('dark', dx <= 1);
  el('ydn').classList.toggle('dark', dy <= 1);
  el('xup').classList.toggle('dark', !canRefine(dx));
  el('yup').classList.toggle('dark', !canRefine(dy));
  linkBtn.textContent = linked ? 'Split' : 'Link';
  homeBtn.classList.toggle('gone', atGreeting());
  clearBtn.classList.toggle('gone', !rect);

  // The multiplication, once — and only while the ruling can count both sides.
  const live = !build && rect && fits();
  const canStack = live && spanX().full * spanY().full <= STACK_MAX
                        && spanX().full * spanY().full > 0;
  supBtn.classList.toggle('gone', !canStack);
  srightBtn.classList.toggle('gone', !canStack);

  if (!live) { outEl.innerHTML = ''; return; }
  const px = spanX().full, py = spanY().full, P = px * py, Q = dx * dy;
  let html = '<div class="cw-line">' + CW.num.html(py, dy) + CW.num.op('×') +
             CW.num.html(px, dx) + CW.num.op('=') + CW.num.html(P, Q) + '</div>';
  // The second line waits for the glass. It performs no arithmetic — it names
  // what the closed squares and the partial have already counted out.
  if (stack && stack.done)
    html += '<div class="cw-line">' + CW.num.html(P, Q) + CW.num.op('=') +
            CW.num.html(P, Q, { mixed: true }) + '</div>';
  outEl.innerHTML = html;
}

resize();
})();
</script>
</body>
</html>
